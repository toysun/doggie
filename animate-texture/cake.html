<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>animate texture</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <!--script type="module" src="./app1.js" defer></script-->
  
</head>

<body>
<a-scene 
  landing-page
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  renderer="webgl2: true;"
  xrweb="allowedDevices: any">

  <a-assets>
    <img id="grass" src="assets/grass.jpg">
    <a-asset-item id="cakeModel" src="./assets/cake-with-candle-fire.glb"></a-asset-item>
  </a-assets>

  <a-camera
    id="camera"
    position="0 4 4"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>
  
  <a-entity
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 10;
      target: #cowboy;
      shadowRadius: 12"
    xrextras-attach="target: cake; offset: 1 15 3;"
    shadow>
  </a-entity>

  <a-light type="ambient" intensity="0.7"></a-light>

  <a-plane
    id="myplane"
    material="shader: flat; side: double; src: #grass; repeat: 0.5 0.5"
    animate-texture
    height="6"
    width="6"
    rotation="-90 0 0">
  </a-plane>

  <a-entity
    id="cake"
    animate-cake
    gltf-model="#cakeModel"
    position="0 0.1 0"
    class="cantap"
    xrextras-hold-drag
    xrextras-two-finger-rotate
    xrextras-pinch-scale
    animation-mixer
    shadow="receive: false">
  </a-entity>
  
  <a-plane
    id="ground" 
    rotation="-90 0 0" 
    width="1000" 
    height="1000" 
    material="shader: shadow" 
    shadow>
  </a-plane>  
</a-scene>
<script>
AFRAME.registerComponent('animate-texture', {
  init() {
    this.offset = 0
  },
  tick() {
    const mesh = this.el.getObject3D('mesh')
    if (!mesh) return

    mesh.traverse((node) => {
      if (node.isMesh && node.material && node.material.map) {
        node.material.map.offset.x = this.offset
        // Removed node.material.needsUpdate = true to prevent critical lag
      }
    })
    this.offset += 0.001
  }
})

AFRAME.registerComponent('animate-cake', {
  init() {
    this.offset = 0
    this.cakeTexture = null

    // Wait for the GLTF model to safely finish loading before querying its children
    this.el.addEventListener('model-loaded', () => {
      const mesh = this.el.getObject3D('mesh')
      const cakeBody = mesh.getObjectByName('CakeBody')
      
      if (cakeBody && cakeBody.material && cakeBody.material.map) {
        this.cakeTexture = cakeBody.material.map
        // Set repeat configuration once, instead of doing it every frame
        this.cakeTexture.repeat.set(0.5, 0.5)
      }
    })
  },
  tick() {
    // Only animate if the texture reference has been successfully found
    if (this.cakeTexture) {
      this.cakeTexture.offset.x = this.offset
      this.offset += 0.002
    }
  }
})
</script>
</body>
</html>
