<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>8th Wall WebAR: 단종 헤드 Face Effect</title>

  <!-- 8th Wall & A-Frame 엔진 라이브러리 -->
  <script src="./../../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../../xr_st/xrextras.js"></script>
  <script src="./../../xr_st/landing-page.js"></script>  
  <script async src="./../../xr_st/xr.js" data-preload-chunks="face"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 포토프레임 오버레이 레이어 */
    #frame-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none; /* 터치 이벤트가 하단 AR 화면 및 버튼으로 전달되도록 설정 */
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #frame-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* 카메라 전환 버튼 */
    #cam-flip-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.85);
      border: 2px solid #ffffff;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease;
      padding: 0;
    }

    #cam-flip-btn:active {
      transform: scale(0.9);
    }
  </style>
</head>

<body>

  <!-- 1. 포토프레임 이미지 (사용할 이미지 경로로 수정하세요) -->
  <div id="frame-container">
    <img id="frame-img" src="./photo_frame.png" alt="포토프레임">
  </div>

  <!-- 2. 카메라 전/후면 전환 버튼 -->
  <button id="cam-flip-btn" aria-label="카메라 전환">🔄</button>

  <a-scene
    id="scene"
    landing-page
    xrextras-loading
    xrextras-runtime-error
    xrextras-pause-on-hidden
    renderer="maxCanvasWidth: 960; maxCanvasHeight: 960"
    xrface="mirroredDisplay: true; maxDetections: 3; meshGeometry: eyes, face, mouth; cameraDirection: front; allowedDevices: any;">

    <a-assets>
      <!-- 오클루더(얼굴 차폐) 모델 -->
      <a-asset-item id="head-occluder" src="./headOccluder.glb"></a-asset-item>
      <!-- GLB 모델 목록 -->
      <a-asset-item id="danjong-head" src="./danjong_head.glb"></a-asset-item>
      <a-asset-item id="jungsun-head" src="./jungsun_head.glb"></a-asset-item>
      <a-asset-item id="kkebi-head" src="./kkebi_head.glb"></a-asset-item>
    </a-assets>

    <!-- 화면 캡처 및 미리보기 UI -->
    <xrextras-capture-button></xrextras-capture-button>
    <xrextras-capture-preview></xrextras-capture-preview>

    <a-camera
      look-controls="enabled: false"
      wasd-controls="enabled: false"
      position="0 1.6 0"></a-camera>

    <!-- [얼굴 1] -->
    <xrextras-faceanchor face-id="1">
      <a-entity 
        gltf-model="#head-occluder" 
        position="0 0 0.02" 
        scale="1 1 1"
        xrextras-hider-material>
      </a-entity>

      <xrextras-face-attachment point="noseBridge">
        <a-entity 
          gltf-model="#danjong-head" 
          position="0 0.4 1" 
          rotation="0 180 0" 
          scale="12 12 12">
        </a-entity>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <!-- [얼굴 2] -->
    <xrextras-faceanchor face-id="2">
      <a-entity 
        gltf-model="#head-occluder" 
        position="0 0 0.02" 
        scale="1 1 1"
        xrextras-hider-material>
      </a-entity>

      <xrextras-face-attachment point="noseBridge">
        <a-entity 
          gltf-model="#jungsun-head" 
          position="0 0.4 1" 
          rotation="0 180 0" 
          scale="12 12 12">
        </a-entity>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <!-- [얼굴 3] -->
    <xrextras-faceanchor face-id="3">
      <a-entity 
        gltf-model="#head-occluder" 
        position="0 0 0.02" 
        scale="1 1 1"
        xrextras-hider-material>
      </a-entity>

      <xrextras-face-attachment point="noseBridge">
        <a-entity 
          gltf-model="#kkebi-head" 
          position="0 0.4 1" 
          rotation="0 180 0" 
          scale="12 12 12">
        </a-entity>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <!-- 조명 세팅 -->
    <a-light type="directional" position="0 1.8 3" intensity="0.8"></a-light>
    <a-light type="ambient" intensity="0.8"></a-light>
  </a-scene>

  <!-- 스크립트: 안정적인 카메라 스위칭 및 AR 재개 -->
  <script>
    let currentCameraDir = 'front';
    let isSwitching = false;

    document.addEventListener('DOMContentLoaded', () => {
      const flipBtn = document.getElementById('cam-flip-btn');
      const sceneEl = document.getElementById('scene');

      if (flipBtn && sceneEl) {
        const switchCamera = (e) => {
          e.preventDefault();
          e.stopPropagation();

          // 중복 클릭 방지 및 XR8 로드 확인
          if (isSwitching || !window.XR8) return;
          isSwitching = true;

          // 방향 토글 (전면 ↔ 후면)
          currentCameraDir = (currentCameraDir === 'front') ? 'back' : 'front';
          const isFront = (currentCameraDir === 'front');

          try {
            // 1. 기존 8th Wall 카메라 엔진 세션만 정지 (DOM 및 A-Frame 컴포넌트 유지를 위해 removeAttribute 사용 안함)
            XR8.stop();

            // 2. 8th Wall FaceController 엔진 구성 업데이트
            XR8.FaceController.configure({
              meshGeometry: [
                XR8.FaceController.MeshGeometry.FACE,
                XR8.FaceController.MeshGeometry.EYES,
                XR8.FaceController.MeshGeometry.MOUTH
              ],
              cameraDirection: currentCameraDir,
              mirroredDisplay: isFront,
              maxDetections: 3
            });

            // 3. A-Frame xrface 컴포넌트 속성 동기화
            sceneEl.setAttribute('xrface', {
              cameraDirection: currentCameraDir,
              mirroredDisplay: isFront,
              maxDetections: 3,
              meshGeometry: 'eyes, face, mouth',
              allowedDevices: 'any'
            });

            // 4. 새로운 카메라 스트림으로 XR8 세션 재개 (기존 A-Frame Canvas 활용)
            setTimeout(() => {
              XR8.run({
                canvas: sceneEl.canvas
              });
              isSwitching = false;
            }, 150);

          } catch (err) {
            console.error("Camera switch error:", err);
            isSwitching = false;
          }
        };

        ['click', 'touchstart'].forEach(eventType => {
          flipBtn.addEventListener(eventType, switchCamera, { passive: false });
        });
      }
    });
  </script>

</body>
</html>
