<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>8th Wall Web: Manipulate</title>

  <script src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Pretendard Variable", Pretendard, sans-serif;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: relative !important;
    }

    /* 시작 선택 팝업 레이어 */
    #container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #edf6f5;
        z-index: 999999;
        pointer-events: auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px 15px 60px;
        box-sizing: border-box;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #start_area {
        width: 100%;
        max-width: 450px;
        text-align: center;
        background: #ffffff;
        padding: 35px 25px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(65, 156, 146, 0.06);
        border: 1px solid #d3eae7;
        margin-bottom: 20px;
    }

    .main-guide-img {
        margin-bottom: 15px;
        display: inline-block;
        height: auto;
        max-width: 60%;
    }

    .guide-text {
        color: #245752;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 25px;
        word-break: keep-all;
    }

    .photozone-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 15px;
    }

    .photozone-card {
        background: #fafdfd;
        border: 1px solid #e1f0ee;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .photozone-card:active {
        transform: scale(0.98);
        border-color: #419c92;
    }

    .photozone-card img {
        max-width: 70%;
        height: auto;
        margin-bottom: 15px;
        border-radius: 8px;
    }

    .photozone-title {
        font-size: 16px;
        font-weight: 700;
        color: #35877e;
        margin-bottom: 12px;
    }

    .start-zone-btn {
        width: 100%;
        max-width: 200px;
        height: 44px;
        background: linear-gradient(to right, #79cb83, #3ca89e);
        color: #ffffff;
        border: none;
        border-radius: 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(60, 168, 158, 0.2);
        transition: opacity 0.2s;
    }
    
    .start-zone-btn:hover {
        opacity: 0.95;
    }

    /* ── 🛠️ 추가: 실시간 AR 화면 터치 유도 가이드 UI 디자인 ── */
    #ar-touch-guide {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 9999 !important; /* AR 화면보다는 위, 시작 팝업보다는 아래 배치 */
      
      /* ⭐ 핵심: 가이드 박스가 생성되어도 뒤쪽 바닥 터치가 그대로 관통되도록 설정 */
      pointer-events: none !important; 
      
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      width: 85% !important;
      max-width: 300px !important;
      background: rgba(36, 87, 82, 0.88) !important; /* 민트 스크린 매칭 딥 청록 불투명 레이어 */
      padding: 24px 20px !important;
      border-radius: 18px !important;
      border: 1px solid #d3eae7 !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25) !important;
      
      /* 초기 상태는 완전히 숨김 (포토존 선택 전까지 미노출) */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease !important;
    }

    /* 활성화 시 부드럽게 나타날 클래스 */
    #ar-touch-guide.show {
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* 보내주신 터치 아이콘 애니메이션 규격화 */
    #ar-touch-guide img {
      width: 52px !important;
      height: auto !important;
      margin-bottom: 12px !important;
      animation: pulseMotion 1.4s infinite ease-in-out !important; /* 팝핑 애니메이션 */
    }

    #ar-touch-guide p {
      color: #ffffff !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      line-height: 1.5 !important;
      word-break: keep-all !important;
    }

    /* 손가락 펄스 모션 키프레임 */
    @keyframes pulseMotion {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>

  <script>
    AFRAME.registerComponent('fix-metal-material', {
      init: function () {
        this.el.addEventListener('model-loaded', (evt) => {
          const model = evt.detail.model;
          model.traverse((node) => {
            if (node.isMesh && node.material) {
              const materials = Array.isArray(node.material) ? node.material : [node.material];
              materials.forEach((mat) => {
                mat.metalness = 0.95;    
                mat.roughness = 0.1;     
                mat.needsUpdate = true;  
              });
            }
          });
        });
      }
    });
  </script>
</head>

<body>

  <div id="ar-touch-guide">
    <img src="./touch.png" alt="터치 안내 아이콘">
    <p>우측 메뉴를 선택 후 바닥을 터치하면 AR 효과가 나타납니다.</p>
  </div>

  <div id="container">
    <div id="start_area">
      <img src="./photo-auth.png" alt="AR 포토존 인증" width="200" class="main-guide-img">

      <p class="guide-text">
        등대를 배경으로 <br>
        아래의 2개 AR포토존 중 하나를 선택해서<br>
        사진을 찍고 업로드 하시면 최종 인증이 완료됩니다.
      </p>

      <div class="photozone-container">
        <div class="photozone-card">
          <div class="photozone-title">✨ AR 루미와 어선 포토존</div>
          <img src="./lumi-boat-300.png" alt="AR 루미" width="200">
          <button class="start-zone-btn" onclick="startNavigation('lumi')">포토존 시작</button>
        </div>

        <div class="photozone-card">
          <div class="photozone-title">🌍 AR 최고의 칭찬</div>
          <img src="./text-best-300.png" alt="AR Best" width="200">
          <button class="start-zone-btn" onclick="startNavigation('text')">포토존 시작</button>
        </div>
      </div>
    </div>
  </div>

  <a-scene
    xrextras-gesture-detector
    landing-page
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any">

    <a-assets>
      <a-asset-item id="lumi-telescope"  src="./lumi-telescope-ani.glb"></a-asset-item>
      <a-asset-item id="boat-circle"     src="./boat-circle-ani.glb"></a-asset-item>
      <a-asset-item id="seagull-fly"     src="./seagull-fly-loop.glb"></a-asset-item>
      <a-asset-item id="text-best"       src="./text-best-ani.glb"></a-asset-item>
      <a-asset-item id="heart-balloon"   src="./heart-balloon-color-confetti.glb"></a-asset-item>
    </a-assets>

    <xrextras-capture-button></xrextras-capture-button>
    <xrextras-capture-preview></xrextras-capture-preview>

    <a-camera
      id="camera"
      position="0 8 16"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-entity
      light="
        type: directional;
        intensity: 1.2;
        castShadow: true;
        shadowMapHeight:2048;
        shadowMapWidth:2048;
        shadowCameraTop: 10;
        target: #heart;"
      xrextras-attach="target: heart; offset: 1 15 3;"
      shadow>
    </a-entity>

    <a-light type="ambient" intensity="0.4"></a-light>

    <a-entity
      id="lumi"
      visible="false"
      gltf-model="#lumi-telescope"
      rotation="0 0 0"
      scale="6 6 6"
      xrextras-hold-drag="rise-height: 0"
      xrextras-two-finger-rotate
      absolute-pinch-scale
      proximity
      animation="property: position; from: 0 -10 0; to: 0 5 0; dir: linear; delay: 1000; dur: 8000; loop: false"
      animation__1="property: scale; from: 0 0 0; to: 2 2 2; dir: linear; delay: 1000; dur: 8000; loop: false"
      animation-mixer
      shadow="receive: false">
      
      <a-entity
        id="boat"
        gltf-model="#boat-circle"
        rotation="0 90 0"
        scale="2 2 2"
        xrextras-hold-drag="rise-height: 0"
        xrextras-two-finger-rotate
        absolute-pinch-scale
        proximity
        animation-mixer
        shadow="receive: false">
      </a-entity>
      
      <a-entity
        id="seagull"
        gltf-model="#seagull-fly"
        rotation="0 90 0"
        scale="2 2 2"
        xrextras-hold-drag="rise-height: 0"
        xrextras-two-finger-rotate
        absolute-pinch-scale
        proximity
        animation-mixer
        shadow="receive: false">
      </a-entity>
    </a-entity>

    <a-entity
      id="text"
      visible="false"
      gltf-model="#text-best"
      rotation="0 0 0"
      scale="6 6 6"
      xrextras-hold-drag="rise-height: 0"
      xrextras-two-finger-rotate
      absolute-pinch-scale
      proximity
      animation="property: position; from: 0 -10 0; to: 0 8 0; dir: linear; delay: 4000; dur: 8000; loop: false"
      animation__1="property: scale; from: 0 0 0; to: 2 2 2; dir: linear; delay: 4000; dur: 8000; loop: false"
      animation-mixer
      shadow="receive: false">
      
      <a-entity
        id="heart"
        gltf-model="#heart-balloon"
        fix-metal-material
        rotation="0 0 0"
        scale="2 2 2"
        xrextras-hold-drag="rise-height: 0"
        xrextras-two-finger-rotate
        absolute-pinch-scale
        proximity
        animation-mixer
        shadow="receive: false">
      </a-entity>
    </a-entity>

    <a-plane
      id="ground"
      rotation="-90 0 0"
      width="1000"
      height="1000"
      material="shader: shadow"
      shadow>
    </a-plane>
  </a-scene>

  <script>
    const zoneIds = ['lumi', 'text'];

    // 포토존 선택 및 진입 로직
    function startNavigation(zoneType) {
      console.log("선택된 포토존 형태: " + zoneType);

      const uiContainer = document.getElementById('container');
      if (uiContainer) {
        uiContainer.style.opacity = '0';
        setTimeout(() => {
          uiContainer.style.visibility = 'hidden';
          uiContainer.style.display = 'none';
          
          // 🛠️ 추가: 메인 선택창이 완전히 꺼진 직후 터치 유도 가이드 노출
          const touchGuide = document.getElementById('ar-touch-guide');
          if (touchGuide) touchGuide.classList.add('show');
        }, 400);
      }

      zoneIds.forEach((id) => {
        const entity = document.getElementById(id);
        if (entity) {
          entity.setAttribute('visible', id === zoneType);
        }
      });
    }

    // ── 🛠️ 추가: 사용자가 화면(바닥)을 클릭/터치 시 가이드를 사라지게 하는 전역 리스너 ──
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      
      if (scene) {
        // 모바일 터치(touchstart)와 PC 마우스 클릭(click)에 모두 대응
        ['click', 'touchstart'].forEach(eventType => {
          scene.addEventListener(eventType, () => {
            const touchGuide = document.getElementById('ar-touch-guide');
            
            // 가이드가 켜져 있는 상태(show 클래스 보유 시)에만 작동
            if (touchGuide && touchGuide.classList.contains('show')) {
              console.log("화면 터치가 감지되어 실시간 안내 가이드를 소멸합니다.");
              touchGuide.classList.remove('show'); // 페이드아웃 효과 발동
              
              setTimeout(() => {
                touchGuide.style.display = 'none'; // DOM 레이아웃에서 완전 삭제
              }, 400);
            }
          });
        });
      }
    });
  </script>
</body>
</html>
