<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>World Portal</title>

   <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  

  <script crossorigin="anonymous" src="./../xr_st/aframe-chromakey-material-1.1.4.min.js"></script>
  <!--script src="./../xr_st/aframe-extras-7.0.0.min.js"></script-->
<script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
<!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet">

  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>

  <script type="module" src="./app.js" defer></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { TexturePass } from 'three/addons/postprocessing/TexturePass.js';
  import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
  import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

  window.THREE = { ...THREE };
  window.THREE.GLTFLoader = GLTFLoader;
  window.THREE.EffectComposer = EffectComposer;
  window.THREE.RenderPass = RenderPass;
  window.THREE.GlitchPass = GlitchPass;
  window.THREE.UnrealBloomPass = UnrealBloomPass;
  window.THREE.TexturePass = TexturePass;
  window.THREE.AfterimagePass = AfterimagePass;
  window.THREE.ShaderPass = ShaderPass;
  window.dispatchEvent(new CustomEvent('threeloaded'));
</script>
  <link rel="stylesheet" href="./index.css">

</head>
<body>
<div id="overlay" style="display: none" class="absolute-fill">
  <img id="recenterButton" src="./assets/textures/recenter.png"> 
  <span id="promptText"></span>
</div>

<a-scene
  responsive-immersive
  landing-page="mediaSrc: #landing-page-video;"
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true;"
  xrweb="allowedDevices: any; disableDefaultEnvironment: true;">

  <xrextras-resource id="landing-page-video" src="./assets/moon-portal.mp4"></xrextras-resource>

  <!-- We can define assets here to be loaded while the load screen is displayed -->
  <a-assets>
    <!-- models -->
    <a-asset-item id="portal-rim-model" src="./assets/models/ring-s2.glb"></a-asset-item>
    <a-asset-item id="moon-model" src="./assets/models/transparent-ground.glb"></a-asset-item>
    <a-asset-item id="platform-model" src="./assets/models/transparent-ground.glb"></a-asset-item>
    <a-asset-item id="flag-model" src="./assets/models/floating_fox.glb"></a-asset-item>
    <a-asset-item id="rocks-model" src="./assets/models/little-prince-planet.glb"></a-asset-item>
    <a-asset-item id="birds-model" src="./assets/models/the_little_prince.glb"></a-asset-item>
    <!-- textures -->
    <img id="skybox-img" src="./assets/textures/fairy-universe.png">
    <img id="blob-shadow-img" src="./assets/textures/blob-shadow.png">
    <img id="satellite-img" src="./assets/textures/little-prince-letter.png">
    <img id="palanquin-low-img" src="./assets/textures/space-whale.png">
    <video id="portal-video" muted autoplay playsinline crossorigin="anonymous" loop="true" src="./assets/textures/portal-video.mp4"></video>
    <video id="palanquin-video" muted autoplay playsinline crossorigin="anonymous" loop="false" src="./assets/textures/little-prince-fly.mp4"></video>
  </a-assets>

  <!-- Camera -->
  <a-camera
    id="camera"
    position="0 9 11">
  </a-camera>

  <!-- Hider walls -->
  <xrextras-opaque-background remove="true">
    <a-entity id="hider-walls">
      <a-box scale="100 1 100" position="0 -1 49" xrextras-hider-material></a-box>
      <a-box scale="100 100 1" position="0 50 75" xrextras-hider-material></a-box>
      <a-box scale="100 1 100" position="0 100 49" xrextras-hider-material></a-box>
      <a-box scale="1 100 100" position="-30 50 50" xrextras-hider-material></a-box>
      <a-box scale="1 100 100" position="30 50 50" xrextras-hider-material></a-box>
      <a-ring id="portalHiderRing" radius-inner="0.001" radius-outer="100" position="0 7.5 -0.2" xrextras-hider-material></a-ring>
    </a-entity>
  
     <a-entity id="portal-wall">
      <a-circle radius="5.2" rotation="0 180 0" position="0 7.5 0" scale="0.8 0.8 0" xrextras-hider-material></a-circle>
      <a-circle radius="5.2" rotation="0 180 0" position="0 7.5 0.25" scale="0.8 0.8 0" xrextras-hider-material></a-circle>
    </a-entity>
  </xrextras-opaque-background>

  
  <!-- Lights -->
  <a-entity
    light="
      type: directional;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 35;
      shadowCameraBottom: -20;
      shadowCameraRight: 40;
      shadowCameraLeft: -10;
      target: #portalRim"
    xrextras-attach="target: portalRim; offset: 18 7 14"
    shadow>
  </a-entity>
  
  <a-light type="ambient" intensity="0.4"></a-light>

<!-- Portal Contents -->
  <a-entity id="portal-contents">
          <a-sphere
    xrextras-one-finger-rotate
    position="0 0.5 -1.0"
    radius="0.5"
    material="
      color: #AD50FF; shader: flat; 
      src: ./cube-texture-w.png"
    shadow
    data-bloom="bloom"></a-sphere>
    
    <a-entity
      gltf-model="#moon-model"
      rotation="0 90 0"
      position="8 -0.5 -5"
      scale="1.5 1.5 1.5"
      shadow="cast: false">
    </a-entity>

    <!--a-entity
      gltf-model="#platform-model"
      rotation="0 -90 0"
      reflections="type: static"
      position="-0.4 -15 -70"
      scale="9 9 9"
      shadow="receive: false">
    </a-entity-->
    
    <a-plane
      material="src: #satellite-img; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 30 0"
      position="-200 200 -250"
      scale="480 320 1"
      shadow="receive: false">     
    </a-plane>
    
    <a-plane
      material="src: #palanquin-low-img; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 30 0"
      position="300 -150 -250"
      scale="720 640 1"
      shadow="receive: false">
     </a-plane>
    
     <a-entity
      gltf-model="#flag-model"
      rotation="0 0 0"
      reflections="type: static"
      position="-54 -15 -123"
      scale="5 5 5"
      shadow="receive: false"
       animation-mixer>
     </a-entity>
    
     <a-entity
      gltf-model="#rocks-model"
      reflections="type: static"
      rotation="0 90 0"
      position="5 -15 -90"
      scale="15 15 15"
      shadow="receive: false"
       animation-mixer>
     </a-entity>
    <a-entity rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
    <a-entity
      gltf-model="#birds-model"
      position="150 150 -25"
      rotation="0 180 0"
      scale="1 1 1"
      shadow="receive: false"
      animation-mixer>
     </a-entity>
      </a-entity>

        <a-entity
    id="palanquinVideo"
    auto-play-video="video: #palanquin-video"
    material="shader: chromakey; src: #palanquin-video; color: 0 0 0; opacity: 1"
    geometry="primitive: plane; height: 3.5; width: 2.5;"
    position="0 5.5 -12.1"
    scale="10 10 10">
  </a-entity>
    
     <a-sky src="#skybox-img" rotation="0 -90 0"></a-sky>

  <!-- Portal -->
  <a-entity
    id="portalRim"
    gltf-model="#portal-rim-model"
    spin="axis: x; speed: 14000"
    reflections="type: realtime"
    position="0 7.5 0"
    rotation="90 -90 -90"
    scale="0.00002 0.00002 0.00002"
    shadow="receive: false">
  </a-entity>

  <a-entity
    id="portalVideo"
    auto-play-video="video: #portal-video"
    material="shader: chromakey; src: #portal-video; color: 0 0 0; blending: additive; side: front"
    geometry="primitive: plane; height: 1.5; width: 1.5;"
    position="0 7.5 0.1"
    scale="0.02 0.02 0.02">
  </a-entity>

  <a-circle
    id="portalShadow"
    radius="1.5"
    material="src: #blob-shadow-img; opacity: 0.65; roughness: 0.8; metalness: 0"
    position="0 0.01 1.25"
    rotation="-90 0 0"
    scale="0.02 0.02 0.02">
  </a-circle>
  
</a-scene>

</body>
</html>
