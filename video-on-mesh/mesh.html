<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>video & image material on mesh</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  
  <link rel="stylesheet" type="text/css" href="index.css">
  
  <style>
    /* 로딩 레이어 오버레이보다 무조건 위에 배치되도록 z-index 최상위 설정 및 버튼 시각화 */
    .custom-upload {
      position: fixed;
      z-index: 99999;
      top: 20px;
      left: 20px;
      background: #007AFF;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-family: sans-serif;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: block !important; /* display: none 제거 */
    }
    #file { display: none; }
  </style>
</head>

<body>

<label id="uploadBtn" for="file" class="custom-upload">Add Media (Image/Video)</label>
<input id="file" type="file" name="filename" accept="video/*, image/*">

<a-scene
  xrextras-gesture-detector
  landing-page="mediaSrc: https://i.giphy.com/media/gtfuPId8wvtfkyQ7Tc/giphy.mp4"
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true"
  xrweb>

  <a-assets>
    <a-asset-item id="photo" src="./assets/glb/photo_frame.glb"></a-asset-item>
    <a-asset-item id="cake" src="./assets/glb/cake-with-candle-fire.glb"></a-asset-item>
    <a-asset-item id="tv" src="./assets/glb/retro-tv.glb"></a-asset-item>
    
    <video id="vid-neon" muted autoplay playsinline loop="true" crossorigin="anonymous" src="./assets/video/neon-frame.mp4"></video>    
    <video id="vid-cat" muted autoplay playsinline loop="true" crossorigin="anonymous" src="./assets/video/cat-noir.mp4"></video>    
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-config request-mic="manual" enable-end-card="false"></xrextras-capture-config>
  <xrextras-capture-preview></xrextras-capture-preview>
  
  <a-camera
    id="camera"
    position="0 8 10"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>
  
  <a-entity
    xr-light
    light="type: directional; castShadow: true; shadowMapHeight:2048; shadowMapWidth:2048; shadowCameraTop: 20; shadowCameraBottom: -20; shadowCameraRight: 20; shadowCameraLeft: -20; target: #camera"
    xrextras-attach="target: camera; offset: 8 15 4"
    position="1 4.3 2.5"
    shadow>
  </a-entity>
  
  <a-light xr-light="max: 0.5" type="ambient"></a-light>

  <a-entity 
    id="group"
    geometry="primitive: box; width: 8; height: 8; depth: 4;"
    material="transparent: true; opacity: 0.0; depthTest: false"
    xrextras-pinch-scale="max: 2"
    xrextras-two-finger-rotate
    xrextras-hold-drag="riseHeight: 1">

    <a-entity 
      id="photoModel" 
      gltf-model="#photo"
      media-texture="src: #vid-neon; meshName: " 
      position="-3 5.5 0"
      rotation="0 35 0"
      scale="50 50 50"
      animation-mixer
      shadow="receive: false"
    ></a-entity>

    <a-entity 
      id="tvModel" 
      gltf-model="#tv"
      media-texture="src: #vid-cat; meshName: " 
      position="2 0 0"
      rotation="0 -55 0"
      scale="3 3 3"
      reflections="type: realtime"
      shadow="receive: false"
    ></a-entity>
  
  </a-entity>

  <a-entity 
    id="cakeModel" 
    gltf-model="#cake"
    position="-1 0 0"
    rotation="0 0 0"
    scale="3 3 3"
    animation-mixer
    shadow="receive: false"
  ></a-entity>

  <a-plane id="ground" rotation="-90 0 0" width="100" height="100" material="shader: shadow; opacity: 0.5;" shadow></a-plane>
</a-scene>

<script>
/**
 * 비디오와 이미지를 모두 판별하여 3D Mesh에 텍스처를 주입하는 만능 컴포넌트
 */
AFRAME.registerComponent('media-texture', {
  schema: {
    src: { type: 'selector' },          // <video> 또는 <img> 태그 선택자
    meshName: { type: 'string', default: '' } // 특정 하위 Mesh 명칭 (비워두면 전체 적용)
  },

  init() {
    this.texture = null;
    this.applyMedia = this.applyMedia.bind(this);
    this.el.addEventListener('model-loaded', this.applyMedia);
  },

  update() {
    this.applyMedia();
  },

  remove() {
    this.el.removeEventListener('model-loaded', this.applyMedia);
    if (this.texture) this.texture.dispose();
  },

  applyMedia() {
    const mesh = this.el.getObject3D('mesh');
    const targetElement = this.data.src;

    if (!mesh || !targetElement) return;

    // 이전 텍스처 메모리 해제
    if (this.texture) this.texture.dispose();

    // 1. 미디어 종류 감지 및 쓰리제이에스 텍스처 최적화 설정
    if (targetElement.tagName === 'VIDEO') {
      if (targetElement.paused) {
        targetElement.play().catch(() => console.log("유저 인터랙션 대기"));
      }
      this.texture = new THREE.VideoTexture(targetElement);
      this.texture.minFilter = THREE.LinearFilter;
      this.texture.magFilter = THREE.LinearFilter;
    } else if (targetElement.tagName === 'IMG') {
      this.texture = new THREE.Texture(targetElement);
      if (targetElement.complete) {
        this.texture.needsUpdate = true;
      } else {
        targetElement.addEventListener('load', () => {
          this.texture.needsUpdate = true;
        });
      }
    } else {
      return; // 지원하지 않는 포맷일 때 예외 처리로 튕김 방지
    }

    this.texture.colorSpace = THREE.SRGBColorSpace || THREE.sRGBEncoding;

    // 2. 모델 내부 노드를 순회하며 텍스처 주입
    mesh.traverse((node) => {
      if (node.isMesh) {
        // meshName 설정이 없거나, 노드 이름이 일치할 때 적용
        if (!this.data.meshName || node.name === this.data.meshName) {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach((mat) => {
            if (mat) {
              mat.map = this.texture;
              mat.needsUpdate = true;
            }
          });
        }
      }
    });
  }
});

/**
 * 디바이스 미디어(이미지/동영상) 업로드 처리 스크립트
 */
document.getElementById('file').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const fileURL = URL.createObjectURL(file);
  const assetsContainer = document.querySelector('a-assets');
  
  // 업로드 시 미디어가 바뀔 타겟 모델 지정 (여기서는 예시로 tvModel로 지정)
  const targetEntity = document.getElementById('tvModel'); 

  if (file.type.startsWith('video/')) {
    let videoEl = document.getElementById('user-dynamic-video');
    if (!videoEl) {
      videoEl = document.createElement('video');
      videoEl.id = 'user-dynamic-video';
      videoEl.setAttribute('autoplay', '');
      videoEl.setAttribute('muted', '');
      videoEl.setAttribute('playsinline', '');
      videoEl.setAttribute('loop', 'true');
      videoEl.setAttribute('crossorigin', 'anonymous');
      assetsContainer.appendChild(videoEl);
    }
    videoEl.src = fileURL;
    videoEl.play().then(() => {
      targetEntity.setAttribute('media-texture', { src: '#user-dynamic-video' });
    });

  } else if (file.type.startsWith('image/')) {
    let imgEl = document.getElementById('user-dynamic-img');
    if (!imgEl) {
      imgEl = document.createElement('img');
      imgEl.id = 'user-dynamic-img';
      imgEl.setAttribute('crossorigin', 'anonymous');
      assetsContainer.appendChild(imgEl);
    }
    imgEl.src = fileURL;
    imgEl.onload = () => {
      targetEntity.setAttribute('media-texture', { src: '#user-dynamic-img' });
    };
  }
});
</script>
</body>
</html>
