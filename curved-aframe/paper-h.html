<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <!--script src="./../xr_st/landing-page.js"></script-->  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>

  <script>
     const onxrloaded = async () => {
       const res = await fetch('./ls-target.json')
       const json = await res.json()
       const res1 = await fetch('./costume.json')
       const json1 = await res1.json()
       const res2 = await fetch('./oregage.json')
       const json2 = await res2.json()
       const res3 = await fetch('./costume.json')
       const json3 = await res3.json()

       XR8.XrController.configure({
         imageTargetData: [json, json1, json2, json3],
       })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  </script>

</head>

<body>
<div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
  <img src="./assets/Media/scan-hand.svg" alt="스마트폰을 흔들어 스캔하세요" />
</div>

<a-scene
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true; physicallyBasedRendering: true;"
  xrweb="disableWorldTracking: true">
  
  <a-assets>
    <a-asset-item id="bean-glb" src="./assets/Models/lighthouse-rock-seagull.glb"></a-asset-item>
    <img id="haerangi" src="./assets/Media/haerangi.png">
    <img id="sanji-text" src="./assets/Media/sanji.jpeg">
    <video
      id="wine-label-video"
      preload="auto"
      muted
      autoplay
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/wave-square-ns.mp4">
    </video>
  </a-assets>
  
  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    position="0 1 1"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
  <a-light type="ambient" intensity="0.7"></a-light>
  
  <xrextras-named-image-target name="ls-target">
    <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>
    <a-entity 
        id="model" 
        gltf-model="#bean-glb" 
        scale="0.05 0.05 0.05" 
        position="0 0 0" 
        rotation="90 0 0"  
        shadow="receive: false" 
        animation-mixer
        visible="false"
    >
    </a-entity>

    <a-plane 
         height= "1" 
         width = "1"
         src="#sanji-text" 
         position="0.5 1 0" 
         rotation="90 0 0" 
         material="transparent: true;"         
        animation="property: rotation; from: 90 0 -45; to: 90 0 45; dir: alternate; dur: 3000; easing: easeInOutSine; loop: true">
    </a-plane>


    <a-plane 
         height= "1" 
         width = "1" 
         src="#haerangi" 
         position="-0.5 1 0" 
         rotation="90 0 0" 
         material="transparent: true;"     
         animation="property: rotation; from: 90 0 -45; to: 90 0 45; dir: alternate; dur: 3000; easing: easeInOutSine; loop: true">
    </a-plane>

  </xrextras-named-image-target>

  <a-plane
    id="ground"
    rotation="-90 0 0"
    width="1000"
    height="1000"
    material="shader: shadow"
    shadow>
  </a-plane>
</a-scene>

<script>
const overlay = document.getElementById('scanning-overlay');  //수정

document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
  if (event.detail.name === 'ls-target') {


//수정
  if (overlay) {
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }

    const entity = document.querySelector('#model');
    entity.setAttribute('visible', true);

    const mesh = entity.getObject3D('mesh');
    if (!mesh) return;

    // 모든 머티리얼을 투명하게 초기화
    mesh.traverse((node) => {
      if (node.material) {
        if (Array.isArray(node.material)) {
          node.material.forEach((mat) => {
            mat.transparent = true;
            mat.opacity = 0;
          });
        } else {
          node.material.transparent = true;
          node.material.opacity = 0;
        }
      }
    });

    // easeInOutQuad 함수 정의
    function easeInOutQuad(t) {
      return t < 0.5
        ? 2 * t * t
        : -1 + (4 - 2 * t) * t;
    }

    const duration = 1500; // 애니메이션 시간 (ms)
    const start = performance.now();

    function fade(now) {
      const elapsed = now - start;
      let progress = Math.min(elapsed / duration, 1); // 0 ~ 1
      let eased = easeInOutQuad(progress);

      mesh.traverse((node) => {
        if (node.material) {
          if (Array.isArray(node.material)) {
            node.material.forEach((mat) => {
              mat.opacity = eased;
            });
          } else {
            node.material.opacity = eased;
          }
        }
      });

      if (progress < 1) {
        requestAnimationFrame(fade);
      }
    }

    requestAnimationFrame(fade);
  }
});

//수정
// 이미지를 잃어버렸을 때 다시 표시
document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
  if (event.detail.name === 'ls-target') {
    if (overlay) {
      overlay.style.display = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity = '1';
    }
  }
});
</script>


</body>
</html>
