<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <!--script src="./../xr_st/landing-page.js"></script-->  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <!--script src="./aframe-hologram-shader.js"></script-->
  <script>
     const onxrloaded = async () => {
       const res = await fetch('./yellow-target.json')
       const json = await res.json()
       const res1 = await fetch('./ballentine-target.json')
       const json1 = await res1.json()

       XR8.XrController.configure({
         imageTargetData: [json, json1],
       })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)

  </script>

</head>

<body>
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
  <img src="./assets/Media/scan-hand.svg" alt="스마트폰을 흔들어 스캔하세요" />
</div>
<a-scene
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true; physicallyBasedRendering: true;"
  xrweb="disableWorldTracking: true">
  
  <a-assets>
    <a-asset-item id="bean-glb" src="./assets/Models/lighted_spheres_2.glb"></a-asset-item>
    <a-asset-item id="bean-glb1" src="./assets/Models/Sunshine_Pure.glb"></a-asset-item>
    <a-asset-item id="bean-glb2" src="./assets/Models/Crossing_Sign.glb"></a-asset-item>
    <a-asset-item id="blades-glb" src="./assets/Models/ring-cross-hollow.glb"></a-asset-item>
    <a-asset-item id="blades-glb1" src="./assets/Models/Steadfast_Ballentine.glb"></a-asset-item>
    <a-asset-item id="blades-glb2" src="./assets/Models/bond.glb"></a-asset-item>
    <a-asset-item id="words-glb" src="./assets/Models/error_text.glb"></a-asset-item>
    <img id="most-loved" src="./assets/Media/most-loved-barnd.jpg">
    <img id="kangaroo-alert" src="./assets/Media/kangaroo-alert.jpeg">
    <img id="ballentine-17" src="./assets/Media/ballentine-17.jpg">
    <img id="family-crest" src="./assets/Media/family-crest-ballentine.png">
    <video
      id="wine-label-video"
       muted
        autoplay
        playsinline
        webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/yellowtail-rvm.mp4">
    </video>
    <video
      id="ballen-label-video"
       muted
        autoplay
        playsinline
        webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/g-o-m.mp4">
    </video>
  </a-assets>
  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>
  <a-camera
    position="0 1 1"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
  <a-light type="ambient" intensity="1.5"></a-light>
  
<a-plane
    id="model-1" 
    smooth-follow="target: #anchor-1; speed: 0.05" 
    material="src: #most-loved;"
    frustumCulled="false"
    visible="false" 
    width="0.3"
    height="0.4">     
</a-plane>

<a-plane
    id="model-2" 
    smooth-follow="target: #anchor-2; speed: 0.05" 
    material="src: #kangaroo-alert;"
    frustumCulled="false"
    visible="false" 
    width="0.3" 
    height="0.4">     
</a-plane>

<a-entity
    id="model-3" 
    smooth-follow="target: #ballen-anchor-1; speed: 0.05" 
    gltf-model="#blades-glb1"
    visible="false">     
</a-entity>

<a-entity
    id="model-4" 
    smooth-follow="target: #ballen-anchor-2; speed: 0.05" 
    gltf-model="#blades-glb2"
    visible="false">     
</a-entity>

  <!-- WINE LABEL (Cylindrical): video fades in on label -->
  <xrextras-named-image-target name="yellow-target">
    <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>
    
    <a-entity
      id="anchor-1"
      position="-0.5 0.5 -1"
      animation="property: position; from: -1.5 0.5 -1; to: -0.5 0.5 -1; dur: 2000;"
      animation__1="property: rotation; from: 0 0 -15; to: 0 0 15; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">
    </a-entity>

    <a-entity
      id="anchor-2"
      position="0.5 0.5 -1"
      animation="property: position; from: 1.5 0.5 -1; to: 0.5 0.5 -1; dur: 2000; delay: 500;"
      animation__1="property: rotation; from: 0 0 -15; to: 0 0 15; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">
    </a-entity>
    
  </xrextras-named-image-target>

  <xrextras-named-image-target name="ballentine-target">
    <xrextras-target-video-fade video="#ballen-label-video"></xrextras-target-video-fade>

    <a-entity
      id="ballen-anchor-1"
      position="-0.5 0.5 -1"
      animation="property: position; from: -1.5 0.5 -1; to: -0.5 0.5 -1; dur: 2000;"
      animation__1="property: rotation; from: 0 0 -15; to: 0 0 15; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">
    </a-entity>

    <a-entity
      id="ballen-anchor-2"
      position="0.5 0.5 -1"
      animation="property: position; from: 1.5 0.5 -1; to: 0.5 0.5 -1; dur: 2000; delay: 500;"
      animation__1="property: rotation; from: 0 0 -15; to: 0 0 15; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">
    </a-entity>

    <a-entity gltf-model="#blades-glb" position="0 -0.45 0" scale="1.13 1.13 1.13" xrextras-spin="speed: 3000"></a-entity>
       
  </xrextras-named-image-target>
  
</a-scene>
<script>
const overlay = document.getElementById('scanning-overlay'); 

document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
  if (event.detail.name === 'yellow-target' || event.detail.name === 'ballentine-target') {
    
    if (overlay) {
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }
  }
})

// 이미지를 잃어버렸을 때 다시 표시
document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
  if (event.detail.name === 'yellow-target' || event.detail.name === 'ballentine-target') {
    if (overlay) {
      overlay.style.display = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity = '1';
    }
  }
});

// A-Frame 커스텀 컴포넌트 등록
  AFRAME.registerComponent('smooth-follow', {
    schema: {
      target: {type: 'selector'},     // 쫓아갈 대상 (앵커)
      speed: {type: 'number', default: 0.05} // 따라가는 속도 (낮을수록 떨림이 적고 부드러움)
    },
    init: function() {
      // 위치와 회전값을 담을 변수 미리 생성 (성능 최적화)
      this.targetPos = new THREE.Vector3();
      this.targetQuat = new THREE.Quaternion();
    },
    tick: function () {
      if (!this.data.target) return;

      const target3D = this.data.target.object3D;
      const my3D = this.el.object3D;

      // 타겟(마커)이 화면에서 사라지면, 이 오브젝트도 숨김 처리
      if (!target3D.parent.visible) {
        my3D.visible = false;
        return;
      }
      my3D.visible = true; // 마커가 보이면 표시

      // 앵커의 절대 좌표와 회전값을 가져옴
      target3D.getWorldPosition(this.targetPos);
      target3D.getWorldQuaternion(this.targetQuat);

      // Lerp(위치)와 Slerp(회전)를 사용하여 현재 위치에서 목표 위치로 'speed'만큼만 부드럽게 이동
      my3D.position.lerp(this.targetPos, this.data.speed);
      my3D.quaternion.slerp(this.targetQuat, this.data.speed);
    }
  });
</script>
</body>
</html>
