<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <!--script src="./../xr_st/landing-page.js"></script-->  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <!--script src="./aframe-hologram-shader.js"></script-->
  <script>
     const onxrloaded = async () => {
       const res = await fetch('./yellow-target.json')
       const json = await res.json()
       const res1 = await fetch('./ballentine-target.json')
       const json1 = await res1.json()

       XR8.XrController.configure({
         imageTargetData: [json, json1],
       })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)

  </script>

</head>

<body>
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
  <img src="./assets/Media/scan-hand.svg" alt="스마트폰을 흔들어 스캔하세요" />
</div>
<a-scene
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true; physicallyBasedRendering: true;"
  xrweb="disableWorldTracking: true">
  
  <a-assets>
    <a-asset-item id="bean-glb" src="./assets/Models/lighted_spheres_2.glb"></a-asset-item>
    <a-asset-item id="bean-glb1" src="./assets/Models/Sunshine_Pure.glb"></a-asset-item>
    <a-asset-item id="bean-glb2" src="./assets/Models/Crossing_Sign.glb"></a-asset-item>
    <a-asset-item id="blades-glb" src="./assets/Models/ring-cross-hollow.glb"></a-asset-item>
    <a-asset-item id="blades-glb1" src="./assets/Models/Steadfast_Ballentine.glb"></a-asset-item>
    <a-asset-item id="blades-glb2" src="./assets/Models/bond.glb"></a-asset-item>
    <a-asset-item id="words-glb" src="./assets/Models/error_text.glb"></a-asset-item>
    <img id="most-loved" src="./assets/Media/most-loved-barnd.jpg">
    <img id="kangaroo-alert" src="./assets/Media/kangaroo-alert.jpeg">
    <img id="ballentine-17" src="./assets/Media/ballentine-17.jpg">
    <img id="family-crest" src="./assets/Media/family-crest-ballentine.png">
    <video
      id="wine-label-video"
       muted
        autoplay
        playsinline
        webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/yellowtail-rvm.mp4">
    </video>
        <video
      id="wine-label-video1"
       muted
        autoplay
        playsinline
        webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/g-o-m.mp4">
    </video>
  </a-assets>
  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>
  <a-camera
    position="0 1 1"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
  <a-light type="ambient" intensity="1.5"></a-light>

  <!--a-plane
      id="model" 
      material="src: #most-loved; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="1.2 -0.5 0"
      visible="true"
      height="1"

      animation="property: position; from: 15.5 -10.5 0; to: 1.2 -0.5 0; dir: linear; delay: 6000; dur: 3000; loop: false"

  </a-plane-->
  <a-plane

      material="src: #most-loved; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="0 1 1"
      visible="true"
      height="3" 
      width="3"
  >     
  </a-plane>
  <!-- WINE LABEL (Cylindrical): video fades in on label -->
  <xrextras-named-image-target name="yellow-target">
    <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>

    <a-entity id="model" gltf-model="#bean-glb1" position="1.3 -0.5 0" rotation="0 0 0" scale="0.8 0.8 0.8"
      animation="property: position; from: 15.5 -10.5 0; to: 1.3 -0.5 0; dir: linear; delay: 6000; dur: 3000; loop: false"
      animation__1="property: rotation; from: 1.3 -0.5 -7.5; to: 1.2 -0.5 7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true"></a-entity>
    <a-entity gltf-model="#bean-glb2" position="-0.9 -0.5 0" rotation="0 0 0" scale="1 1 1"
      animation="property: position; from: -15.5 -10.5 0; to: -0.9 -0.5 0; dir: linear; delay: 6000; dur: 2000; loop: false"
      animation__1="property: rotation; from: -0.9 -0.5 7.5; to: -0.9 -0.5 -7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true"></a-entity>
    <a-entity gltf-model="#blades-glb" position="0 -0.45 0" scale="1.13 1.13 1.13" xrextras-spin="speed: 3000"></a-entity-->
    <!--a-plane
      id="model" 
      material="src: #most-loved; transparent: true; roughness: 0.8; metalness: 0"

      animation__1="property: rotation; from: 1.2 -0.5 -7.5; to: 1.2 -0.5 7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">     
    </a-plane-->
    <!---plane
      material="src: #kangaroo-alert; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="-0.9 -0.5 0"
      height="1.5" 
      width="1"
      animation="property: position; from: -15.5 -10.5 0; to: -0.9 -0.5 0; dir: linear; delay: 6000; dur: 2000; loop: false"
      animation__1="property: rotation; from: -0.9 -0.5 7.5; to: -0.9 -0.5 -7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">     
    </a-plane-->
  </xrextras-named-image-target>

  <xrextras-named-image-target name="ballentine-target">
    <xrextras-target-video-fade video="#wine-label-video1"></xrextras-target-video-fade>
    <xrextras-curved-target-container color="#000"></xrextras-curved-target-container>
    <a-entity gltf-model="#blades-glb" position="0 -0.45 0" scale="1.13 1.13 1.13" xrextras-spin="speed: 3000"></a-entity>
    <a-entity gltf-model="#blades-glb1" position="1.1 -0.5 0" rotation="0 0 0" scale="1 1 1"

    <a-entity gltf-model="#blades-glb2" position="-1.2 -0.5 0" rotation="0 30 0" scale="1 1 1"
      animation="property: position; from: -15.5 -10.5 0; to: -1.2 -0.5 0; dir: linear; delay: 6000; dur: 2000; loop: false"
      animation__1="property: rotation; from: -1.2 -0.5 7.5; to: -1.2 -0.5 -7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true"></a-entity>
    <!--a-entity gltf-model="#words-glb" position="0 -0.25 0" scale="0.2 0.2 0.2" xrextras-spin="speed: 5000; direction: reverse;"></a-entity-->
    <!--a-plane
      material="src: #ballentine-17; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="1.2 -0.5 0"
      height="1.5" 
      width="1"
      animation="property: position; from: 15.5 -10.5 0; to: 1.2 -0.5 0; dir: linear; delay: 6000; dur: 2000; loop: false"
      animation__1="property: rotation; from: 1.2 -0.5 -7.5; to: 1.2 -0.5 7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">     
    </a-plane>
    <a-plane
      material="src: #family-crest; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="-0.9 -0.5 0"
      height="1.5" 
      width="1"
      animation="property: position; from: -15.5 -10.5 0; to: -0.9 -0.5 0; dir: linear; delay: 6000; dur: 2000; loop: false"
      animation__1="property: rotation; from: -0.9 -0.5 7.5; to: -0.9 -0.5 -7.5; dir: alternate; dur: 500; easing: easeInOutSine; loop: true">     
    </a-plane-->
  </xrextras-named-image-target>
  
</a-scene>
<script>
const overlay = document.getElementById('scanning-overlay'); 
const entity = document.getElementById('#model');

document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
  if (event.detail.name === 'yellow-target') {
    //수정
    if (overlay) {
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }
    entity.setAttribute("visible", "true");
  }
})

// 이미지를 잃어버렸을 때 다시 표시
document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
  if (event.detail.name === 'yellow-target') {
    if (overlay) {
      overlay.style.display = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity = '1';
    }
    entity.setAttribute("visible", "false");
  }
});
</script>
</body>
</html>
