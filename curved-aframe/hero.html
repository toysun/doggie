<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script crossorigin="anonymous" src="./../xr_st/aframe-chromakey-material-1.1.4.min.js"></script>
  <script>
     const onxrloaded = async () => {
       const res = await fetch('./hero.json')
       const json = await res.json()
       const res1 = await fetch('./d-engine.json')
       const json1 = await res1.json()
       const res2 = await fetch('./w1-engine.json')
       const json2 = await res2.json()
       const res3 = await fetch('./d1-engine.json')
       const json3 = await res3.json()

       XR8.XrController.configure({
         imageTargetData: [json, json1, json2, json3],
       })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  </script>
</head>

<body>
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
    <img src="./assets/Media/scan-hand.svg" alt="스마트폰을 흔들어 스캔하세요" />
  </div>

  <a-scene
    landing-page
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; physicallyBasedRendering: true;"
    xrweb="disableWorldTracking: true">
    
    <a-assets>
      <a-asset-item id="bean-glb" src="./assets/Models/fantasy_compass.glb"></a-asset-item>
      <a-asset-item id="blades-glb" src="./assets/Models/oscillating_cylinder_motor_for_lego_3d_print.glb"></a-asset-item>
      <a-asset-item id="bean-glb-1" src="./assets/Models/3d_printable_air_balloon_engine_for_lego.glb"></a-asset-item>
      <a-asset-item id="blades-glb-1" src="./assets/Models/3d_printable_pneumatic-engined_toy_car.glb"></a-asset-item>
      <a-asset-item id="words-glb" src="./assets/Models/error_text.glb"></a-asset-item>

      <!-- loop 제거: 1회 재생 후 마지막 프레임 유지 -->
      <video
        id="wine-label-video"
        muted
        autoplay
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        src="./assets/Media/water-portal.mp4">
      </video>
      <video
        id="wine-label-video1"
        muted
        autoplay
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        src="./assets/Media/dark-bg-engine-1.mp4">
      </video>
    </a-assets>

    <xrextras-capture-button></xrextras-capture-button>
    <xrextras-capture-preview></xrextras-capture-preview>

    <a-camera
      position="0 1 1"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
    <a-light type="ambient" intensity="0.25"></a-light>

    <!-- hero_target: 비디오 종료 후 3D 모델 등장 -->
    <xrextras-named-image-target name="hero_target">
      <a-entity
        id="video-plane-hero"
        xrextras-play-video="video: #wine-label-video; canstop: true"
        material="shader: chromakey; src: #wine-label-video; color: 0 0 0; blending: additive; side: front"
        geometry="primitive: plane; height: 1.5; width: 1;">
      </a-entity>
      <!-- 초기 visible: false로 대기 -->
      <a-entity 
        id="model-hero"
        gltf-model="#bean-glb" 
        position="0 0.5 0.2" 
        rotation="90 0 0"
        scale="0.7 0.7 0.7"
        visible="false"
        shadow="receive: false"
        animation="property: rotation; from: 90 0 0; to: 90 360 0; loop: true; dur: 10000"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <!-- w1-engine -->
    <xrextras-named-image-target name="w1-engine">
      <a-entity
        id="video-plane-w1"
        xrextras-play-video="video: #wine-label-video; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity
        id="model-w1"
        gltf-model="#bean-glb-1"
        scale="1 1 1"
        position="0 0 1"
        visible="false"
        xrextras-spin="speed: 10000"
        shadow="receive: false"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <!-- d-engine -->
    <xrextras-named-image-target name="d-engine">
      <a-entity
        id="video-plane-d"
        xrextras-play-video="video: #wine-label-video1; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity
        id="model-d"
        gltf-model="#blades-glb"
        scale="0.01 0.01 0.01"
        position="0 0 1"
        visible="false"
        xrextras-spin="speed: 10000"
        shadow="receive: false"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <!-- d1-engine -->
    <xrextras-named-image-target name="d1-engine">
      <a-entity
        id="video-plane-d1"
        xrextras-play-video="video: #wine-label-video1; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity
        id="model-d1"
        gltf-model="#blades-glb-1"
        scale="0.3 0.3 0.3"
        position="0 0 1"
        visible="false"
        xrextras-spin="speed: 10000"
        shadow="receive: false"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <a-plane
      id="ground"
      rotation="-90 0 0"
      width="1000"
      height="1000"
      material="shader: shadow"
      shadow>
    </a-plane>
  </a-scene>

<script>
  const overlay = document.getElementById('scanning-overlay');

  // 타겟별 비디오/모델 매핑
  const targetMap = {
    'hero_target': {
      video: document.getElementById('wine-label-video'),
      modelId: 'model-hero'
    },
    'w1-engine': {
      video: document.getElementById('wine-label-video'),
      modelId: 'model-w1'
    },
    'd-engine': {
      video: document.getElementById('wine-label-video1'),
      modelId: 'model-d'
    },
    'd1-engine': {
      video: document.getElementById('wine-label-video1'),
      modelId: 'model-d1'
    }
  };

  // 모델 페이드인 함수
  function fadeInModel(modelEntity) {
    modelEntity.setAttribute('visible', true);

    // 모델 로드 완료 여부 확인 후 페이드인 실행
    function startFade() {
      const mesh = modelEntity.getObject3D('mesh');
      if (!mesh) {
        // mesh 아직 없으면 재시도
        setTimeout(startFade, 100);
        return;
      }

      // 머티리얼 투명도 0으로 초기화
      mesh.traverse((node) => {
        if (node.material) {
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((mat) => {
            mat.transparent = true;
            mat.opacity = 0;
          });
        }
      });

      function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      }

      const duration = 1500;
      const start = performance.now();

      function fade(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeInOutQuad(progress);

        mesh.traverse((node) => {
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => { mat.opacity = eased; });
          }
        });

        if (progress < 1) requestAnimationFrame(fade);
      }

      requestAnimationFrame(fade);
    }

    startFade();
  }

  // 비디오에 ended 이벤트 연결 (타겟별)
  function bindVideoEnded(targetName) {
    const { video, modelId } = targetMap[targetName];

    // 중복 바인딩 방지용 플래그
    if (video._boundTargets) {
      if (video._boundTargets.includes(targetName)) return;
      video._boundTargets.push(targetName);
    } else {
      video._boundTargets = [targetName];
    }

// 수정: 활성 타겟을 추적하는 변수로 현재 타겟만 처리
let activeTarget = null; // 상단에 선언

// xrimagefound에서 activeTarget 갱신
document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
  const name = event.detail.name;
  activeTarget = name;
  ...
});
// ended 핸들러에서 activeTarget 비교
video.addEventListener('ended', () => {
  if (activeTarget !== targetName) return; // 현재 활성 타겟만 처리
  const modelEntity = document.getElementById(modelId);
  if (modelEntity) fadeInModel(modelEntity);
}, { once: false });

  // xrimagefound: 이미지 인식 시
  document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
    const name = event.detail.name;
    if (!targetMap[name]) return;

    // 스캔 오버레이 숨김
    if (overlay) {
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => { overlay.style.display = 'none'; }, 500);
    }

    const { video, modelId } = targetMap[name];
    const modelEntity = document.getElementById(modelId);

    // 비디오 처음부터 재생 (재스캔 시에도 초기화)
    video.currentTime = 0;
    video.play();

    // 모델 숨김 상태로 초기화
    if (modelEntity) {
      modelEntity.setAttribute('visible', false);

      // 머티리얼 opacity 초기화
      const mesh = modelEntity.getObject3D('mesh');
      if (mesh) {
        mesh.traverse((node) => {
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => { mat.transparent = true; mat.opacity = 0; });
          }
        });
      }
    }

    // 비디오 종료 이벤트 바인딩
    bindVideoEnded(name);
  });

  // xrimagelost: 이미지 소실 시 오버레이 복구
  document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
    const name = event.detail.name;
    if (!targetMap[name]) return;

    if (overlay) {
      overlay.style.display = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity = '1';
    }
  });
</script>
</body>
</html>
