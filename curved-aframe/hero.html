<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script crossorigin="anonymous" src="./../xr_st/aframe-chromakey-material-1.1.4.min.js"></script>
  <script>
     const onxrloaded = async () => {
       const res  = await fetch('./hero.json');   const json  = await res.json()
       const res1 = await fetch('./hero1.json');  const json1 = await res1.json()
       const res2 = await fetch('./w1-engine.json'); const json2 = await res2.json()
       const res3 = await fetch('./d1-engine.json'); const json3 = await res3.json()
       XR8.XrController.configure({ imageTargetData: [json, json1, json2, json3] })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  </script>
  <style>
    #start_area {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ffffff; z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }
    #start_btn {
      padding: 15px 30px; font-size: 18px; font-weight: bold;
      background: #066265; color: white;
      border: none; border-radius: 10px; margin-top: 20px; cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- 시작 화면 -->
  <div id="start_area">
    <img src="./assets/Media/lh-hunt-t.png" alt="AR 등대 탐험대" width="200">
    <img src="./assets/Media/hunt-spot.png" alt="AR 등대 보물 찾기" width="400">
    <p style="color: #066265; font-weight:bold;">
      등대 주변에서 <br>위의 2개 장면에 숨겨진,<br>항해에 도움이 되는 아이템을 찾으세요.
    </p>
    <button id="start_btn" onclick="startNavigation()">찾기 시작</button>
  </div>

  <!-- 스캔 오버레이 -->
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
    <img src="./assets/Media/hero-illust-s.svg" alt="스마트폰을 흔들어 스캔하세요" />
  </div>

  <a-scene
    landing-page
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; physicallyBasedRendering: true;"
    xrweb="disableWorldTracking: true">

    <a-assets>
      <a-asset-item id="bean-glb"   src="./assets/Models/compass-blue.glb"></a-asset-item>
      <a-asset-item id="blades-glb" src="./assets/Models/blue-anchor.glb"></a-asset-item>
      <video id="wine-label-video"  muted autoplay playsinline webkit-playsinline crossorigin="anonymous" src="./assets/Media/portal-video-s.mp4"></video>
      <video id="wine-label-video1" muted autoplay playsinline webkit-playsinline crossorigin="anonymous" src="./assets/Media/portal-video-s.mp4"></video>
    </a-assets>

    <xrextras-capture-button></xrextras-capture-button>
    <xrextras-capture-preview></xrextras-capture-preview>

    <a-camera position="0 1 1" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>
    <a-light type="directional" intensity="0.5" position="0 1 0"></a-light>
    <a-light type="ambient" intensity="0.1"></a-light>

    <xrextras-named-image-target name="hero_target">
      <a-entity id="video-plane-hero"
        xrextras-play-video="video: #wine-label-video; canstop: true"
        material="shader: chromakey; src: #wine-label-video; color: 0 0 0; blending: additive; side: front"
        geometry="primitive: plane; height: 1; width: 1;"
        animation="property: scale; from: 0 0 0; to: 1 1 1; loop: false; dur: 5000">
      </a-entity>
      <a-entity id="model-hero" gltf-model="#bean-glb"
        position="0 0.5 0.2" rotation="0 0 0" scale="0.5 0.5 0.5"
        visible="false" shadow="receive: false"
        animation="property: position; from: 0 0.5 -10; to: 0 0.5 0.2; loop: false; dur: 10000"
        animation__1="property: rotation; from: 0 0 0; to: 0 0 360; loop: true; delay: 10000; dur: 10000"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <xrextras-named-image-target name="hero_target1">
      <a-entity id="video-plane-hero1"
        xrextras-play-video="video: #wine-label-video1; canstop: true"
        material="shader: chromakey; src: #wine-label-video1; color: 0 0 0; blending: additive; side: front"
        geometry="primitive: plane; height: 1; width: 1;"
        animation="property: scale; from: 0 0 0; to: 1 1 1; loop: false; dur: 5000">
      </a-entity>
      <a-entity id="model-hero1" gltf-model="#blades-glb"
        scale="0.5 0.5 0.5" rotation="0 0 0" position="0 0.5 0.2"
        visible="false" shadow="receive: false"
        animation="property: position; from: 0 0.5 -10; to: 0 0.5 0.2; loop: false; dur: 10000"
        animation__1="property: rotation; from: 0 0 0; to: 0 0 360; loop: true; delay: 10000; dur: 10000"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <a-plane id="ground" rotation="-90 0 0" width="1000" height="1000" material="shader: shadow" shadow></a-plane>
  </a-scene>

<script>
  // ✅ startNavigation: 시작 화면 제거 후 AR 씬 활성화
  async function startNavigation() {
    // iOS 13+ 기기 방향 센서 권한 요청
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') {
          alert("AR을 위해 기기 방향 센서 권한이 필요합니다.");
        }
      } catch (e) {
        console.error("방향 센서 권한 요청 에러:", e);
      }
    }

    // ✅ 시작 화면만 숨김 — ar-container/minimap 등 없는 요소 참조 제거
    document.getElementById('start_area').style.display = 'none';
  }

  // ── AR 로직 ──────────────────────────────────────────────
  const overlay = document.getElementById('scanning-overlay');
  let activeTarget = null;

  // ✅ targetOrder 선언 복구
  const targetOrder = ['hero_target', 'hero_target1'];

  const targetMap = {
    'hero_target': {
      video: document.getElementById('wine-label-video'),
      modelId: 'model-hero',
      overlayImg: './assets/Media/hero-illust-s.svg',
      overlayOpacity: '0.5'
    },
    'hero_target1': {
      video: document.getElementById('wine-label-video1'),
      modelId: 'model-hero1',
      overlayImg: './assets/Media/stone-illust-s.svg',
      overlayOpacity: '0.5'
    }
  };

  // ✅ 초기 투명도 적용
  overlay.style.opacity = targetMap['hero_target'].overlayOpacity;

  function fadeInModel(modelEntity) {
    modelEntity.setAttribute('visible', true);
    function startFade() {
      const mesh = modelEntity.getObject3D('mesh');
      if (!mesh) { setTimeout(startFade, 100); return; }
      mesh.traverse((node) => {
        if (node.material) {
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((mat) => { mat.transparent = true; mat.opacity = 0; });
        }
      });
      function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
      const duration = 1500, start = performance.now();
      function fade(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = easeInOutQuad(progress);
        mesh.traverse((node) => {
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => { mat.opacity = eased; });
          }
        });
        if (progress < 1) requestAnimationFrame(fade);
      }
      requestAnimationFrame(fade);
    }
    startFade();
  }

  function bindVideoEnded(targetName) {
    const { video, modelId } = targetMap[targetName];
    if (video._boundTargets && video._boundTargets.includes(targetName)) return;
    if (!video._boundTargets) video._boundTargets = [];
    video._boundTargets.push(targetName);
    video.addEventListener('ended', () => {
      if (activeTarget !== targetName) return;
      const modelEntity = document.getElementById(modelId);
      if (modelEntity) fadeInModel(modelEntity);
      video.loop = true;
      video.play();
    });
  }

  document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
    const name = event.detail.name;
    if (!targetMap[name]) return;
    activeTarget = name;
    if (overlay) {
      const overlayImgEl = overlay.querySelector('img');
      if (overlayImgEl) overlayImgEl.src = targetMap[name].overlayImg;
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => { overlay.style.display = 'none'; }, 500);
    }
    const { video, modelId } = targetMap[name];
    const modelEntity = document.getElementById(modelId);
    video.loop = false;
    video.currentTime = 0;
    video.play().catch(() => {
      document.addEventListener('click',      () => video.play(), { once: true });
      document.addEventListener('touchstart', () => video.play(), { once: true });
    });
    if (modelEntity) {
      modelEntity.setAttribute('visible', false);
      const mesh = modelEntity.getObject3D('mesh');
      if (mesh) {
        mesh.traverse((node) => {
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => { mat.transparent = true; mat.opacity = 0; });
          }
        });
      }
    }
    bindVideoEnded(name);
  });

  document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
    const name = event.detail.name;
    if (!targetMap[name]) return;
    if (overlay) {
      const currentIndex = targetOrder.indexOf(name);
      const nextTarget   = targetOrder[(currentIndex + 1) % targetOrder.length];
      const overlayImgEl = overlay.querySelector('img');
      if (overlayImgEl) overlayImgEl.src = targetMap[nextTarget].overlayImg;
      overlay.style.display   = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity   = targetMap[nextTarget].overlayOpacity || '1';
    }
  });
</script>
</body>
</html>
