<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  
  <!-- 🛠️ 수정 1: async 제거하여 xr.js 동기 로딩 보장 -->
  <script src="./../xr_st/xr.js" data-preload-chunks="slam"></script>

  <!-- 🛠️ 수정 2: 8th Wall 카메라 파이프라인 모듈을 통해 이미지 타겟 JSON 안전하게 설정 -->
  <script>
    const onxrloaded = () => {
      XR8.addCameraPipelineModule({
        name: 'custom-image-targets',
        onStart: async () => {
          try {
            const [json, json1, json2, json3] = await Promise.all([
              fetch('./bmw_target.json').then(r => r.json()),
              fetch('./d-engine.json').then(r => r.json()),
              fetch('./w1-engine.json').then(r => r.json()),
              fetch('./d1-engine.json').then(r => r.json())
            ]);

            XR8.XrController.configure({
              imageTargetData: [json, json1, json2, json3]
            });
            console.log("이미지 타겟 JSON 로드 및 설정 완료");
          } catch (err) {
            console.error("이미지 타겟 JSON 로드 실패:", err);
          }
        }
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
    <!-- 🛠️ 금속 재질 흑색 왜곡 방지 커스텀 컴포넌트 등록 -->
  <script>
    AFRAME.registerComponent('fix-metal-material', {
      init() {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              // 환경 반사맵이 없는 환경에서 금속(metalness 1.0)이 검게 반사되는 현상 보정
              node.material.metalness = 0.1;  // 금속성 비중 보정
              node.material.roughness = 0.35; // 거칠기 값 보정
              node.material.needsUpdate = true;
            }
          });
        });
      }
    });
  </script>
   <script>
    // 🌟 각진 로우폴리 모델을 둥글고 부드럽게 렌더링해주는 마법의 컴포넌트
    AFRAME.registerComponent('smooth-model', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.traverse((node) => {
              if (node.isMesh && node.material) {
                // 1. 각진 쉐이딩 끄고 표면 빛 반사를 부드럽게 조절
                node.material.flatShading = false;
                node.material.roughness = 0.7; // 너무 번쩍거리지 않게 매트하게
                node.material.needsUpdate = true;
                // 2. 모델의 각진 정점(Vertex)을 둥글게 재계산
                if (node.geometry) {
                  node.geometry.computeVertexNormals();
                }
              }
            });
          }
        });
      }
    });
  </script>
</head>

<body>
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
    <img src="./assets/Media/scan-hand.svg" alt="스마트폰을 흔들어 스캔하세요" />
  </div>

  <a-scene
    landing-page
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; physicallyBasedRendering: true;"
    xrweb="disableWorldTracking: true">
    
    <a-assets>
      <a-asset-item id="bean-glb" src="./assets/Models/bmw_15_cake_pbr_lowpoly.glb"></a-asset-item>
      <a-asset-item id="snow1" src="./assets/Models/gold-confetti-paper.glb"></a-asset-item>   
      <a-asset-item id="blades-glb" src="./assets/Models/oscillating_cylinder_motor_for_lego_3d_print.glb"></a-asset-item>
      <a-asset-item id="bean-glb-1" src="./assets/Models/3d_printable_air_balloon_engine_for_lego.glb"></a-asset-item>
      <a-asset-item id="blades-glb-1" src="./assets/Models/3d_printable_pneumatic-engined_toy_car.glb"></a-asset-item>
      <a-asset-item id="words-glb" src="./assets/Models/error_text.glb"></a-asset-item>

      <!-- 🛠️ 수정 3: autoplay 제거 (스캔 전 사전 재생 방지) -->
      <video
        id="wine-label-video"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        src="./assets/Media/bmw_sticker_mv.mp4">
      </video>
      <video
        id="wine-label-video1"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        src="./assets/Media/dark-bg-engine-1.mp4">
      </video>
    </a-assets>

    <xrextras-capture-button></xrextras-capture-button>
    <xrextras-capture-preview></xrextras-capture-preview>

    <a-camera
      position="0 1 1"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
    <a-light type="ambient" intensity="0.2"></a-light>

    <!-- bmw_target -->
    <xrextras-named-image-target name="bmw_target">
      <a-entity
        id="video-plane-telannas"
        xrextras-play-video="video: #wine-label-video; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity 
        id="model-telannas"
        gltf-model="#bean-glb" 
        position="0 0 0" 
        rotation="90 0 0"
        scale="1 1 1"
        visible="false"
        shadow="receive: false"
        smooth-model
        fix-metal-material
        animation-mixer>
        <a-entity
        id="confetti-model"
        gltf-model="#snow1"
        scale="1 1 1"
        position="0 0 0"
        rotation="0 0 0"
        smooth-model
        fix-metal-material
        metal-material="metalness: 1.0; roughness: 0.22; envMapIntensity: 1.8"
        animation-mixer="loop: repeat; timeScale: 1">
      </a-entity>
      </a-entity>
    </xrextras-named-image-target>

    <!-- w1-engine -->
    <xrextras-named-image-target name="w1-engine">
      <a-entity
        id="video-plane-w1"
        xrextras-play-video="video: #wine-label-video; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity
        id="model-w1"
        gltf-model="#bean-glb-1"
        scale="2 2 2"
        position="0 -1 1"
        visible="false"
        xrextras-spin="speed: 10000"
        shadow="receive: false"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <!-- d-engine -->
    <xrextras-named-image-target name="d-engine">
      <a-entity
        id="video-plane-d"
        xrextras-play-video="video: #wine-label-video1; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity
        id="model-d"
        gltf-model="#blades-glb"
        scale="0.01 0.01 0.01"
        position="0 0 1"
        visible="false"
        xrextras-spin="speed: 10000"
        shadow="receive: false"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <!-- d1-engine -->
    <xrextras-named-image-target name="d1-engine">
      <a-entity
        id="video-plane-d1"
        xrextras-play-video="video: #wine-label-video1; canstop: true"
        geometry="primitive: plane; height: 1; width: 1;">
      </a-entity>
      <a-entity
        id="model-d1"
        gltf-model="#blades-glb-1"
        scale="0.3 0.3 0.3"
        position="0 0 1"
        visible="false"
        xrextras-spin="speed: 10000"
        shadow="receive: false"
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <a-plane
      id="ground"
      rotation="-90 0 0"
      width="1000"
      height="1000"
      material="shader: shadow"
      shadow>
    </a-plane>
  </a-scene>

<script>
  const overlay = document.getElementById('scanning-overlay');

  const targetMap = {
    'bmw_target': {
      video: document.getElementById('wine-label-video'),
      modelId: 'model-telannas'
    },
    'w1-engine': {
      video: document.getElementById('wine-label-video'),
      modelId: 'model-w1'
    },
    'd-engine': {
      video: document.getElementById('wine-label-video1'),
      modelId: 'model-d'
    },
    'd1-engine': {
      video: document.getElementById('wine-label-video1'),
      modelId: 'model-d1'
    }
  };

  // 🛠️ 수정 4: Three.js 머티리얼 페이드인 안전 처리 (mat.needsUpdate 추가)
  function fadeInModel(modelEntity) {
    modelEntity.setAttribute('visible', true);

    function startFade() {
      const mesh = modelEntity.getObject3D('mesh');
      if (!mesh) {
        setTimeout(startFade, 100);
        return;
      }

      mesh.traverse((node) => {
        if (node.material) {
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((mat) => {
            mat.transparent = true;
            mat.opacity = 0;
            mat.needsUpdate = true; // 머티리얼 쉐이더 재작성 강제
          });
        }
      });

      function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      }

      const duration = 1500;
      const start = performance.now();

      function fade(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeInOutQuad(progress);

        mesh.traverse((node) => {
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => { mat.opacity = eased; });
          }
        });

        if (progress < 1) requestAnimationFrame(fade);
      }

      requestAnimationFrame(fade);
    }

    startFade();
  }

  function bindVideoEnded(targetName) {
    const targetObj = targetMap[targetName];
    if (!targetObj) return;

    const { video, modelId } = targetObj;

    if (video._boundTargets) {
      if (video._boundTargets.includes(targetName)) return;
      video._boundTargets.push(targetName);
    } else {
      video._boundTargets = [targetName];
    }

    video.addEventListener('ended', () => {
      const modelEntity = document.getElementById(modelId);
      if (modelEntity) {
        fadeInModel(modelEntity);
      }
    }, { once: false });
  }

  // 타겟 인식 시
  document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
    const name = event.detail.name;
    if (!targetMap[name]) return;

    if (overlay) {
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => { overlay.style.display = 'none'; }, 500);
    }

    const { video, modelId } = targetMap[name];
    const modelEntity = document.getElementById(modelId);

    // 비디오 시작
    video.currentTime = 0;
    video.play().catch(err => console.log("비디오 재생 터치 정책 보정:", err));

    if (modelEntity) {
      modelEntity.setAttribute('visible', false);

      const mesh = modelEntity.getObject3D('mesh');
      if (mesh) {
        mesh.traverse((node) => {
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => { mat.transparent = true; mat.opacity = 0; mat.needsUpdate = true; });
          }
        });
      }
    }

    bindVideoEnded(name);
  });

  // 타겟 이탈 시
  document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
    const name = event.detail.name;
    if (!targetMap[name]) return;

    if (overlay) {
      overlay.style.display = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity = '1';
    }
  });
</script>
</body>
</html>
