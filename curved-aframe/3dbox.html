<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>curved-aframe</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <!--script src="./../xr_st/landing-page.js"></script-->  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script src="./../xr_st/aframe-chromakey-material-1.1.4.min.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>

  <script>
     const onxrloaded = async () => {
       const res = await fetch('./3dbox-target.json')
       const json = await res.json()
       const res1 = await fetch('./costume.json')
       const json1 = await res1.json()
       const res2 = await fetch('./oregage.json')
       const json2 = await res2.json()
       const res3 = await fetch('./costume.json')
       const json3 = await res3.json()

       XR8.XrController.configure({
         imageTargetData: [json, json1, json2, json3],
       })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  </script>


</head>

<body>
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
  <img src="./assets/Media/scan-hand.svg" alt="스마트폰을 흔들어 스캔하세요" />
</div>
<a-scene
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true; physicallyBasedRendering: true;"
  xrweb="disableWorldTracking: true">
  
  <a-assets>
    <a-asset-item id="bean-glb" src="./assets/Models/3d-box-jungle.glb"></a-asset-item>
    <img id="macaw" src="./assets/Media/macaw.png">
    <img id="tropical" src="./assets/Media/tropical-leaves.png">
    <img id="jvt" src="./assets/Media/jungle-vertical-t.png">
    <video
      id="wine-label-video"
      preload="auto"
      muted
      autoplay
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/complete_video.mp4">
    </video>
        <video
      id="wine-label-video1"
      preload="auto"
      muted
      autoplay
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      loop="true"
      src="./assets/Media/jungle-video.mp4">
    </video>
  </a-assets>
  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>
  <a-camera
    position="0 1 1"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>
  
  <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
  <a-light type="ambient" intensity="0.7"></a-light>
  
  <xrextras-named-image-target name="3dbox-target">
           <!-- Hider walls -->
  <xrextras-opaque-background remove="true">
    <a-entity id="hider-walls">
      <a-plane scale="1.2 0.5 0.5" position="0 0.016 2.3" rotation="0 0 0" xrextras-hider-material></a-plane>
      <a-plane scale="1.4 0.5 0.5" position="0 0.016 -2.3" rotation="0 0 0" xrextras-hider-material></a-plane>
      <a-plane scale="0.5 1.9 0.5" position="-0.877 0.016 0.025" rotation="0 0 0" xrextras-hider-material></a-plane>
      <a-plane scale="0.5 1.9 0.5" position="0.777 0.016 0.025" rotation="0 0 0" xrextras-hider-material></a-plane>
      <!--a-box scale="1 10 10" position="30 50 50" xrextras-hider-material></a-box-->
    </a-entity>
  </xrextras-opaque-background>
    <xrextras-target-video-fade video="#wine-label-video1"
      position="0 0 -0.1"></xrextras-target-video-fade>
      <!--a-entity
        xrextras-play-video="video: #wine-label-video; canstop: true"
        material="shader: chromakey;
                src: #wine-label-video;
                color: 0.1 0.9 0.2;
                threshold: 0.35;
                smoothness: 0.08;
                spill: 1.0;
                opacity: 1"
        geometry="primitive: plane; height: 1.7; width: 1.2;"
        position="0 0 -0.1" 
      ></a-entity-->
    <a-entity 
        id="model" 
        gltf-model="#bean-glb" 
        scale="0.68 1 1" 
        position="0 0 0" 
        rotation="90 0 0"  
        shadow="receive: false" 
        animation-mixer
        visible="false">
    </a-entity>
        <!--a-plane
      material="src: #jvt; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="0 0 0"
      height="1.7" 
      width="1.2">     
    </a-plane-->
        <a-plane
      material="src: #macaw; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="-0.2 0 -0.05"
      height="1.4" 
      width="0.9"
      animation="property: position; from: 0.5 -5.5 -10; to: 0 0 -0.05; dir: linear; delay: 2000; dur: 2000; loop: false"
      animation__1="property: rotation; from: 0 0 -5.5; to: 0 0 5.5; dir: alternate; dur: 1000; easing: easeInOutCubic; loop: true">     
    </a-plane>
    <a-plane
      material="src: #tropical; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="0 0 0"
      height="1.8" 
      width="1.3">     
    </a-plane>
  </xrextras-named-image-target>

  <a-plane
    id="ground"
    rotation="-90 0 0"
    width="1000"
    height="1000"
    material="shader: shadow"
    shadow>
  </a-plane>
</a-scene>

<script>
const overlay = document.getElementById('scanning-overlay');  //수정
  
document.querySelector('a-scene').addEventListener('xrimagefound', (event) => {
  if (event.detail.name === '3dbox-target') {
    //수정
  if (overlay) {
      overlay.style.animation = 'fadeOut 0.5s forwards';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }

    const entity = document.querySelector('#model');
    entity.setAttribute('visible', true);

    const mesh = entity.getObject3D('mesh');
    if (!mesh) return;

    // 모든 머티리얼을 투명하게 초기화
    mesh.traverse((node) => {
      if (node.material) {
        if (Array.isArray(node.material)) {
          node.material.forEach((mat) => {
            mat.transparent = true;
            mat.opacity = 0;
          });
        } else {
          node.material.transparent = true;
          node.material.opacity = 0;
        }
      }
    });

    // easeInOutQuad 함수 정의
    function easeInOutQuad(t) {
      return t < 0.5
        ? 2 * t * t
        : -1 + (4 - 2 * t) * t;
    }

    const duration = 1500; // 애니메이션 시간 (ms)
    const start = performance.now();

    function fade(now) {
      const elapsed = now - start;
      let progress = Math.min(elapsed / duration, 1); // 0 ~ 1
      let eased = easeInOutQuad(progress);

      mesh.traverse((node) => {
        if (node.material) {
          if (Array.isArray(node.material)) {
            node.material.forEach((mat) => {
              mat.opacity = eased;
            });
          } else {
            node.material.opacity = eased;
          }
        }
      });

      if (progress < 1) {
        requestAnimationFrame(fade);
      }
    }

    requestAnimationFrame(fade);
  }
});

  //수정
// 이미지를 잃어버렸을 때 다시 표시
document.querySelector('a-scene').addEventListener('xrimagelost', (event) => {
  if (event.detail.name === 'ls-target') {
    if (overlay) {
      overlay.style.display = 'flex';
      overlay.style.animation = 'none';
      overlay.style.opacity = '1';
    }
  }
});
</script>


</body>
</html>
