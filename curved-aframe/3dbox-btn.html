<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>3D box button</title>

  <script src="./../xr_st/8frame-1.5.0.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <!--script src="./../xr_st/landing-page.js"></script-->  
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script src="./../xr_st/aframe-chromakey-material-1.1.4.min.js"></script>
  <script src="./howler.min.js"></script>

  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>

  <script>
     const onxrloaded = async () => {
       const res = await fetch('./macaw-target.json')
       const json = await res.json()
       const res1 = await fetch('./costume.json')
       const json1 = await res1.json()
       const res2 = await fetch('./oregage.json')
       const json2 = await res2.json()
       const res3 = await fetch('./costume.json')
       const json3 = await res3.json()

       XR8.XrController.configure({
         imageTargetData: [json, json1, json2, json3],
       })
     }
     window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  </script>


</head>

<body>
  <div id="scanning-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; opacity: 0.3">
  <img src="./assets/Media/macaw-vertical.png" alt="스마트폰을 흔들어 스캔하세요" />
</div>
<a-scene
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true; physicallyBasedRendering: true;"
  xrweb="disableWorldTracking: true">
  
  <a-assets>
    <img id="macaw" src="./assets/Media/macaw.png">
    <img id="tropical" src="./assets/Media/tropical-leaves.png">
    <img id="jvt" src="./assets/Media/jungle-vertical-t.png">
    <img id="garden" src="./assets/Media/garden_transparent.png">
    <img id="rooftop" src="./assets/Media/rooftop_transparent.png">
  </a-assets>
  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>
  <a-camera
    position="0 1 1"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>
  
  <a-light type="directional" intensity="1.5" position="0 1 0"></a-light>
  <a-light type="ambient" intensity="0.7"></a-light>
  
  <xrextras-named-image-target name="macaw-target">
    <a-plane
      material="src: #macaw; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 0"
      position="-0.2 0 -0.04"
      height="1.4" 
      width="0.9"
      animation="property: position; from: 0.5 -5.5 -10; to: 0 0 -0.05; dir: linear; delay: 2000; dur: 2000; loop: false"
      animation__1="property: rotation; from: 0 0 -5.5; to: 0 0 5.5; dir: alternate; dur: 1000; easing: easeInOutCubic; loop: true">     
    </a-plane>
    <a-plane
      id="explain-img"
      visible="false"
      material="src: #tropical; transparent: true; roughness: 0.8; metalness: 0"
      rotation="0 0 -0.04"
      position="0 0 0"
      height="1.8" 
      width="1.3">     
    </a-plane>
    <a-sphere
        id="sound-btn"
        position="-0.2 -0.5 -0.04" 
        radius="0.1" 
        color="#EF2D5E"
        class="cantap">
    </a-sphere>
    <a-sphere
        id="ani-btn"
        position="0 -0.5 -0.04" 
        radius="0.1" 
        color="#7BC8A4"
        class="cantap">
    </a-sphere>

  </xrextras-named-image-target>

  <a-plane
    id="ground"
    rotation="-90 0 0"
    width="1000"
    height="1000"
    material="shader: shadow"
    shadow>
  </a-plane>
</a-scene>
<script>
document.addEventListener('DOMContentLoaded', () => {

  const scene = document.querySelector('a-scene')
  const overlay = document.getElementById('scanning-overlay')

  let soundBtn, aniBtn, exPlane

  scene.addEventListener('loaded', () => {

    soundBtn = document.getElementById('sound-btn')
    aniBtn = document.getElementById('ani-btn')
    exPlane = document.getElementById('explain-img')

    init()
  })

  function init() {

    let isSoundPressed = false
    let isAniPressed = false

    const imageList = ['#tropical', '#garden', '#rooftop']
    let currentImgIdx = -1

    const sound = new Howl({
      src: ['./assets/Media/birds-song.mp3'],
      html5: true,
      loop: true
    })

    const setAnim = (el, name, props) => {
      el.removeAttribute(name)
      requestAnimationFrame(() => {
        el.setAttribute(name, props)
      })
    }

    // 🔵 XR 인식
    scene.addEventListener('xrimagefound', (event) => {
      if (event.detail.name === 'macaw-target') {
        if (overlay) overlay.style.display = 'none'
      }
    })

    // 🔵 XR 상실
    scene.addEventListener('xrimagelost', (event) => {
      if (event.detail.name === 'macaw-target') {

        if (overlay) overlay.style.display = 'block'

        sound.pause()
        exPlane.setAttribute('visible', false)
        currentImgIdx = -1
      }
    })

    // 🔵 사운드 버튼
    soundBtn.addEventListener('click', () => {
      if (isSoundPressed) return
      isSoundPressed = true

      if (sound.playing()) {
        sound.pause()
      } else {
        sound.play()
      }

      soundBtn.object3D.scale.set(1.15, 0.65, 1.15)

      setTimeout(() => {
        setAnim(soundBtn, 'animation__unsquish', {
          property: 'scale',
          from: '1.15 0.65 1.15',
          to: '1 1 1',
          easing: 'easeOutElastic',
          dur: 600,
        })
        isSoundPressed = false
      }, 150)
    })

    // 🔵 이미지 순환 버튼
    aniBtn.addEventListener('click', () => {
      if (isAniPressed) return
      isAniPressed = true

      currentImgIdx++

      if (currentImgIdx >= imageList.length) {
        exPlane.setAttribute('visible', false)
        currentImgIdx = -1
      } else {
        exPlane.setAttribute('src', imageList[currentImgIdx])
        exPlane.setAttribute('visible', true)
      }

      aniBtn.object3D.scale.set(1.15, 0.65, 1.15)

      setTimeout(() => {
        setAnim(aniBtn, 'animation__unsquish', {
          property: 'scale',
          from: '1.15 0.65 1.15',
          to: '1 1 1',
          easing: 'easeOutElastic',
          dur: 600,
        })
        isAniPressed = false
      }, 150)
    })
  }

})
</script>
