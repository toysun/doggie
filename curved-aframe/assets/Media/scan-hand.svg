<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="150" height="150">
  <style>
    /* 선 스타일 정의: 카메라 화면 위에서 잘 보이도록 흰색 선과 검은색 그림자 사용 */
    .ar-icon {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
    }
    .ar-arrow {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
    }
    
    /* 스마트폰과 손이 좌우로 흔들리는 애니메이션 */
    @keyframes scan-motion {
      0%, 100% { transform: rotate(-25deg); }
      50% { transform: rotate(25deg); }
    }
    
    /* 화살표 깜빡임 효과 */
    @keyframes arrow-fade {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* 애니메이션 적용 대상 */
    .hand-phone-group {
      transform-origin: 50% 85%; /* 손목 부분을 회전 축으로 설정 */
      animation: scan-motion 2s ease-in-out infinite;
    }
    .left-arrow { animation: arrow-fade 2s ease-in-out infinite alternate; }
    .right-arrow { animation: arrow-fade 2s ease-in-out infinite alternate-reverse; }
  </style>

  <g class="left-arrow">
    <path d="M 28 40 C 12 35 12 20 28 15" class="ar-arrow"/>
    <polyline points="20 10 28 15 25 24" class="ar-arrow"/>
  </g>
  
  <g class="right-arrow">
    <path d="M 72 40 C 88 35 88 20 72 15" class="ar-arrow"/>
    <polyline points="80 10 72 15 75 24" class="ar-arrow"/>
  </g>

  <g class="hand-phone-group">
    
    <rect x="30" y="10" width="40" height="75" rx="6" class="ar-icon"/>
    
    <rect x="35" y="16" width="30" height="55" rx="3" class="ar-icon" stroke-width="2" opacity="0.6"/>
    <line x1="47" y1="13" x2="53" y2="13" class="ar-icon" stroke-width="2"/>

    <path d="M 30 55 C 15 55 15 70 30 75 L 30 90" class="ar-icon"/>
    
    <path d="M 70 48 C 84 48 84 58 70 60" class="ar-icon"/>
    <path d="M 70 60 C 84 60 84 70 70 72" class="ar-icon"/>
    <path d="M 70 72 C 84 72 84 82 70 84" class="ar-icon"/>
    
    <path d="M 30 90 C 45 95 55 95 70 84" class="ar-icon"/>
  </g>
</svg>
