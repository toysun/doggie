<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>keypad-confetti</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="./../xr_st/coaching-overlay.js"></script>
  <script src="./CSS2DRenderer.js"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
  <script>var vConsole = new window.VConsole();</script>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
<div id="container"></div>

<a-scene
  responsive-immersive
  coaching-overlay
  landing-page
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
  renderer="colorManagement: true"
  xrweb="allowedDevices: any; defaultEnvironmentFogIntensity: 0.5; defaultEnvironmentFloorTexture: #groundTex; defaultEnvironmentFloorColor: #FFF; defaultEnvironmentSkyBottomColor: #B4C4CC; defaultEnvironmentSkyTopColor: #5ac8fa; defaultEnvironmentSkyGradientStrength: 0.5; scale: absolute">

  <a-assets>
    <a-asset-item id="btn4-asset"      src="./assets/click-4-buttons.glb"></a-asset-item>
    <a-asset-item id="confetti1-asset" src="./assets/heart-balloons-pastel-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti2-asset" src="./assets/heart-balloon-color-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti3-asset" src="./assets/star-balloon-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti4-asset" src="./assets/flower-confetti.glb"></a-asset-item>
    <img id="groundTex" src="assets/textures/concrete.jpg">
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    id="camera"
    position="0 1.75 12"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-entity
    xr-light
    light="type: directional; castShadow: true; shadowMapHeight: 2048; shadowMapWidth:  2048; shadowCameraTop: 20; shadowCameraBottom: -20; shadowCameraLeft: -20; shadowCameraRight: 20; target: #keypad; shadowRadius: 3"
    xrextras-attach="target: keypad; offset: 0 15 0;"
    shadow>
  </a-entity>

  <a-light xr-light="max: 1" type="ambient"></a-light>

  <a-entity
    id="keypad"
    gltf-model="#btn4-asset"
    rotation="0 70 0"
    scale="1 1 1"
    keypad-controller
    xrextras-hold-drag="rise-height: 0"
    xrextras-two-finger-rotate
    absolute-pinch-scale
    proximity
    shadow="receive: false">

<a-box class="cantap" keypad-button="idx: 0" 
      position="-0.5 0.5 -0.2" 
      width="1" height="1" depth="1" 
      material="opacity: 0.4; color: #ff4d4d; transparent: true; shader: flat">
    </a-box>

    <a-box class="cantap" keypad-button="idx: 1" 
      position="0.25 0.25 0.05" 
      width="0.4" height="0.4" depth="0.2" 
      material="opacity: 0.4; color: #4dff88; transparent: true; shader: flat">
    </a-box>

    <a-box class="cantap" keypad-button="idx: 2" 
      position="-0.25 -0.25 0.05" 
      width="0.4" height="0.4" depth="0.2" 
      material="opacity: 0.4; color: #4d88ff; transparent: true; shader: flat">
    </a-box>

    <a-box class="cantap" keypad-button="idx: 3" 
      position="0.25 -0.25 0.05" 
      width="0.4" height="0.4" depth="0.2" 
      material="opacity: 0.4; color: #ffd24d; transparent: true; shader: flat">
    </a-box>

  </a-entity>

  <a-entity id="confetti1-el" gltf-model="#confetti1-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>
  <a-entity id="confetti2-el" gltf-model="#confetti2-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>
  <a-entity id="confetti3-el" gltf-model="#confetti3-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>
  <a-entity id="confetti4-el" gltf-model="#confetti4-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-plane id="ground" rotation="-90 0 0" width="100" height="100" material="shader: shadow; opacity: 0.5;" shadow></a-plane>

</a-scene>

<script>
(function () {
  function registerComponents () {

    // 1. 컨페티 1회 재생 및 자동 숨김 컴포넌트
    AFRAME.registerComponent('confetti-once', {
      init () {
        this.mixer   = null;
        this._action = null;

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          if (!model.animations || model.animations.length === 0) return;

          this.mixer = new THREE.AnimationMixer(model);
          const action = this.mixer.clipAction(model.animations[0]);
          action.setLoop(THREE.LoopOnce, 1);
          action.clampWhenFinished = true;
          this._action = action;
          
          this.mixer.addEventListener('finished', () => {
            this.el.setAttribute('visible', false);
          });
        });
      },
      playOnce () {
        this.el.setAttribute('visible', true);
        if (this._action) this._action.reset().play();
      },
      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // 2. 키패드 모델 제어 컴포넌트 (애니메이션 버그 수정판)
    AFRAME.registerComponent('keypad-controller', {
      init () {
        this.mixer   = null;
        this.actions = {}; // Action 자체를 캐싱

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          this.mixer = new THREE.AnimationMixer(model);
          
          // 모델 로드 시점에 애니메이션 Action 생성 및 캐싱
          (model.animations || []).forEach(c => {
            const action = this.mixer.clipAction(c);
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            this.actions[c.name] = action;
          });
        });
      },

      _resolveAction (n) {
        const keys = Object.keys(this.actions);
        if (keys.length === 0) return null;

        const candidates = [`take0${n}`, `take${n}`];
        let found = keys.find(k => candidates.includes(k.toLowerCase().replace(/[\s_]/g, '')));
        if (found) return this.actions[found];

        const numPattern = new RegExp(`(^|[^0-9])0?${n}([^0-9]|$)`);
        found = keys.find(k => numPattern.test(k));
        if (found) return this.actions[found];
        if (keys.length === 4) return this.actions[keys[n - 1]];

        return null;
      },

      playTake (n) {
        if (!this.mixer) return;
        const action = this._resolveAction(n);
        if (!action) return;

        // 다른 애니메이션이 재생 중이라면 강제로 정지 (가중치 꼬임 방지)
        Object.values(this.actions).forEach(a => a.stop());
        
        action.reset();
        action.weight = 1; 
        action.play();
      },

      triggerConfetti (idx) {
        const ids  = ['confetti1-el', 'confetti2-el', 'confetti3-el', 'confetti4-el'];
        const el   = document.getElementById(ids[idx]);
        if (!el) return;
        const comp = el.components['confetti-once'];
        if (comp) comp.playOnce();
      },

      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // 3. 개별 버튼 히트박스 클릭 이벤트 컴포넌트
    AFRAME.registerComponent('keypad-button', {
      schema: { idx: { type: 'int', default: 0 } },
      init () {
        this.el.addEventListener('click', () => {
          const keypadEl = this.el.parentEl;
          const ctrl = keypadEl && keypadEl.components['keypad-controller'];
          if (!ctrl) return;
          
          ctrl.playTake(this.data.idx + 1);    // 버튼 애니메이션 실행
          ctrl.triggerConfetti(this.data.idx); // 해당 위치 컨페티 실행
        });
      }
    });
  }

  // 8th Wall 환경 로드 확인 후 컴포넌트 등록
  window.XR8
    ? registerComponents()
    : window.addEventListener('xrloaded', registerComponents);
})();
</script>
</body>
</html>
