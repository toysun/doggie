<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>keypad-confetti</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="./../xr_st/coaching-overlay.js"></script>
  <script src="./CSS2DRenderer.js"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
<div id="container"></div>

<a-scene
  responsive-immersive
  coaching-overlay
  landing-page
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
  renderer="colorManagement: true"
  xrweb="allowedDevices: any;
    defaultEnvironmentFogIntensity: 0.5;
    defaultEnvironmentFloorTexture: #groundTex;
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC;
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;
    scale: absolute">

  <a-assets>
    <a-asset-item id="btn4-asset"      src="./assets/click-4-buttons.glb"></a-asset-item>
    <a-asset-item id="confetti1-asset" src="./assets/heart-balloons-pastel-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti2-asset" src="./assets/heart-balloon-color-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti3-asset" src="./assets/star-balloon-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti4-asset" src="./assets/flower-confetti.glb"></a-asset-item>
    <img id="groundTex" src="assets/textures/concrete.jpg">
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    id="camera"
    position="0 1.75 12"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-entity
    xr-light
    light="type: directional;
      castShadow: true;
      shadowMapHeight: 2048;
      shadowMapWidth:  2048;
      shadowCameraTop: 20;
      shadowCameraBottom: -20;
      shadowCameraLeft: -20;
      shadowCameraRight: 20;
      target: #keypad;
      shadowRadius: 3"
    xrextras-attach="target: keypad; offset: 0 15 0;"
    shadow>
  </a-entity>

  <a-light xr-light="max: 1" type="ambient"></a-light>

  <!-- ============================================================
       키패드 모델 (btn4)
       - keypad-controller: 애니메이션 믹서/클립 관리 + playTake/triggerConfetti 실행만 담당
       - class="cantap" 을 더 이상 여기에 두지 않음. 모델 표면(merge된
         하나의 메시)을 직접 클릭해도 "어느 버튼인지" A-Frame이 구분할
         방법이 없기 때문에, 클릭 감지는 아래 4개의 개별 히트박스로 분리.
       ============================================================ -->
  <a-entity
    id="keypad"
    gltf-model="#btn4-asset"
    rotation="0 70 0"
    scale="1 1 1"
    keypad-controller
    xrextras-hold-drag="rise-height: 0"
    xrextras-two-finger-rotate
    absolute-pinch-scale
    proximity
    shadow="receive: false">

    <!-- ==========================================================
         버튼별 개별 클릭 히트박스 (4개)
         - keypad의 자식 엔티티이므로 keypad가 회전/이동/스케일 되어도
           항상 같은 상대 위치를 유지합니다.
         - keypad-button 컴포넌트가 idx(0~3)를 받아서 keypad-controller의
           playTake()/triggerConfetti() 를 직접 호출합니다.

         ★★★ 위치/크기 조정 필요 ★★★
         아래 position/width/height/depth 값은 예시(2x2 격자) 입니다.
         실제 버튼 위치에 맞게 직접 조정해야 합니다.

         [조정 방법]
         1. 아래 material의 opacity를 0.35 정도로 올리고 색을 다르게 둔 채
            브라우저(또는 8th Wall 미리보기)에서 실제로 확인합니다.
         2. 4개의 반투명 박스가 실제 버튼 4개 위치에 겹쳐 보이도록
            position(x y z) / width / height / depth 값을 하나씩 바꿔가며 맞춥니다.
            (keypad 자체의 rotation="0 70 0" 때문에, 로컬 좌표축이
             화면상의 좌/우와 정확히 일치하지 않을 수 있으니 천천히 조정하세요.)
         3. 정렬이 끝나면 opacity를 0으로 다시 낮춰 완전히 안 보이게 합니다.
            (opacity: 0 이어도 raycaster 클릭 감지는 정상 동작합니다.)
       ========================================================== -->
    <a-box class="cantap"
      keypad-button="idx: 0"
      position="-0.2 0.05 0.05"
      width="1.2" height="1.2" depth="0.8"
      material="opacity: 0.35; color: #ff4d4d; transparent: true; shader: flat">
    </a-box>

    <a-box class="cantap"
      keypad-button="idx: 1"
      position="0.2 0.05 0.05"
      width="1.2" height="1.2" depth="0.8"
      material="opacity: 0.35; color: #4dff88; transparent: true; shader: flat">
    </a-box>

    <a-box class="cantap"
      keypad-button="idx: 2"
      position="-0.2 -0.15 0.05"
      width="1.2" height="1.2" depth="0.8"
      material="opacity: 0.35; color: #4d88ff; transparent: true; shader: flat">
    </a-box>

    <a-box class="cantap"
      keypad-button="idx: 3"
      position="0.2 -0.15 0.05"
      width="1.2" height="1.2" depth="0.8"
      material="opacity: 0.35; color: #ffd24d; transparent: true; shader: flat">
    </a-box>

  </a-entity>

  <!-- 컨페티 엔티티 4개 (초기 숨김 / 버튼 클릭 시 1회 재생 후 자동 숨김) -->
  <a-entity id="confetti1-el" gltf-model="#confetti1-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-entity id="confetti2-el" gltf-model="#confetti2-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-entity id="confetti3-el" gltf-model="#confetti3-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-entity id="confetti4-el" gltf-model="#confetti4-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-plane
    id="ground"
    rotation="-90 0 0"
    width="100"
    height="100"
    material="shader: shadow; opacity: 0.5;"
    shadow>
  </a-plane>

</a-scene>

<!-- ================================================================
  컴포넌트 등록 스크립트 (</a-scene> 뒤, </body> 앞에 위치해야 함 — 8th Wall 의
  xrloaded 패턴, 이전 수정사항 참고)
================================================================ -->
<script>
(function () {
  function registerComponents () {

    // ============================================================
    // [컴포넌트 1] confetti-once
    // 역할: GLB 모델의 첫 번째 애니메이션을 1회 재생 후 자동 숨김.
    // ============================================================
    AFRAME.registerComponent('confetti-once', {
      init () {
        this.mixer   = null;
        this._action = null;

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          if (!model.animations || model.animations.length === 0) {
            console.warn('[confetti-once] 애니메이션 없음:', this.el.id);
            return;
          }

          this.mixer = new THREE.AnimationMixer(model);

          const action = this.mixer.clipAction(model.animations[0]);
          action.setLoop(THREE.LoopOnce, 1);
          action.clampWhenFinished = true;
          this._action = action;

          this.mixer.addEventListener('finished', () => {
            this.el.setAttribute('visible', false);
          });
        });
      },

      playOnce () {
        this.el.setAttribute('visible', true);
        if (this._action) this._action.reset().play();
      },

      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // ============================================================
    // [컴포넌트 2] keypad-controller
    // 역할: btn4 모델의 애니메이션 믹서/클립을 관리하고,
    //       playTake(n) / triggerConfetti(idx) 를 외부(keypad-button)
    //       에서 호출할 수 있도록 공개 메서드로 제공.
    //       ※ 더 이상 자체적으로 클릭을 감지하지 않습니다.
    //         (클릭 감지는 자식 히트박스의 keypad-button 컴포넌트가 담당)
    // ============================================================
    AFRAME.registerComponent('keypad-controller', {
      init () {
        this.mixer     = null;
        this.clips     = {};
        this.isPlaying = false;

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          this.mixer = new THREE.AnimationMixer(model);
          (model.animations || []).forEach(c => { this.clips[c.name] = c; });

          console.log('[keypad] 애니메이션 클립:', Object.keys(this.clips));
          model.traverse(n => { if (n.isMesh) console.log('[keypad] mesh :', n.name); });
        });
      },

      // -----------------------------------------------------------
      // 버튼 인덱스(1~4) → 실제 애니메이션 클립 찾기
      // Take01/Take 01/Take_01/take1 등 표기 차이를 흡수합니다.
      // -----------------------------------------------------------
      _resolveClip (n) {
        const keys = Object.keys(this.clips);
        if (keys.length === 0) return null;

        const candidates = [`take0${n}`, `take${n}`];
        let found = keys.find(k => candidates.includes(k.toLowerCase().replace(/[\s_]/g, '')));
        if (found) return this.clips[found];

        const numPattern = new RegExp(`(^|[^0-9])0?${n}([^0-9]|$)`);
        found = keys.find(k => numPattern.test(k));
        if (found) return this.clips[found];

        if (keys.length === 4) return this.clips[keys[n - 1]];

        return null;
      },

      // 외부(keypad-button)에서 호출하는 공개 메서드
      playTake (n) {
        if (!this.mixer || this.isPlaying) return;

        const clip = this._resolveClip(n);
        if (!clip) {
          console.warn(
            `[keypad] Take0${n}에 대응하는 클립을 찾지 못했습니다.`,
            '실제 클립명:', Object.keys(this.clips)
          );
          return;
        }
        this.isPlaying = true;
        const action = this.mixer.clipAction(clip);
        action.setLoop(AFRAME.THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
        action.reset().play();

        const onFinished = () => {
          this.isPlaying = false;
          this.mixer.removeEventListener('finished', onFinished);
        };
        this.mixer.addEventListener('finished', onFinished);
      },

      // 외부(keypad-button)에서 호출하는 공개 메서드
      triggerConfetti (idx) {
        const ids  = ['confetti1-el', 'confetti2-el', 'confetti3-el', 'confetti4-el'];
        const el   = document.getElementById(ids[idx]);
        if (!el) return;
        const comp = el.components['confetti-once'];
        if (comp) {
          comp.playOnce();
        } else {
          console.warn('[keypad] confetti-once 없음:', ids[idx]);
        }
      },

      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // ============================================================
    // [컴포넌트 3] keypad-button  (신규)
    // 역할: 버튼별 개별 히트박스에 부착. 자신의 idx 를 알고 있으며,
    //       클릭되면 부모(#keypad)의 keypad-controller를 찾아
    //       해당 idx에 맞는 playTake()/triggerConfetti() 를 호출합니다.
    //       모델 내부의 mesh 이름/구조와 완전히 무관하게 동작합니다.
    // ============================================================
    AFRAME.registerComponent('keypad-button', {
      schema: { idx: { type: 'int', default: 0 } },

      init () {
        this.el.addEventListener('click', () => {
          const keypadEl = this.el.parentEl;
          const ctrl = keypadEl && keypadEl.components['keypad-controller'];
          if (!ctrl) {
            console.warn('[keypad-button] 부모에서 keypad-controller를 찾지 못했습니다.');
            return;
          }
          ctrl.playTake(this.data.idx + 1);   // Take01~04
          ctrl.triggerConfetti(this.data.idx); // confetti1-el~4-el
        });
      }
    });
  }

  window.XR8
    ? registerComponents()
    : window.addEventListener('xrloaded', registerComponents);
})();
</script>
</body>
</html>
