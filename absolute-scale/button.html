<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>keypad-confetti</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="./../xr_st/coaching-overlay.js"></script>
  <script src="./CSS2DRenderer.js"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
<div id="container"></div>

<a-scene
  responsive-immersive
  coaching-overlay
  landing-page
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
  renderer="colorManagement: true"
  xrweb="allowedDevices: any;
    defaultEnvironmentFogIntensity: 0.5;
    defaultEnvironmentFloorTexture: #groundTex;
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC;
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;
    scale: absolute">

  <a-assets>
    <a-asset-item id="btn4-asset"      src="./assets/click-4-buttons.glb"></a-asset-item>
    <a-asset-item id="confetti1-asset" src="./assets/heart-balloons-pastel-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti2-asset" src="./assets/heart-balloon-color-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti3-asset" src="./assets/star-balloon-confetti.glb"></a-asset-item>
    <a-asset-item id="confetti4-asset" src="./assets/flower-confetti.glb"></a-asset-item>
    <img id="groundTex" src="assets/textures/concrete.jpg">
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    id="camera"
    position="0 1.75 12"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-entity
    xr-light
    light="type: directional;
      castShadow: true;
      shadowMapHeight: 2048;
      shadowMapWidth:  2048;
      shadowCameraTop: 20;
      shadowCameraBottom: -20;
      shadowCameraLeft: -20;
      shadowCameraRight: 20;
      target: #keypad;
      shadowRadius: 3"
    xrextras-attach="target: keypad; offset: 0 15 0;"
    shadow>
  </a-entity>

  <a-light xr-light="max: 1" type="ambient"></a-light>

  <!-- 키패드 모델: keypad-controller 가 버튼 클릭 감지 및 Take01~04 재생 -->
  <a-entity
    id="keypad"
    class="cantap"
    gltf-model="#btn4-asset"
    rotation="0 70 0"
    scale="1 1 1"
    keypad-controller
    xrextras-hold-drag="rise-height: 0"
    xrextras-two-finger-rotate
    absolute-pinch-scale
    proximity
    shadow="receive: false">
  </a-entity>

  <!-- 컨페티 엔티티 4개 (초기 숨김 / 버튼 클릭 시 1회 재생 후 자동 숨김) -->
  <a-entity id="confetti1-el" gltf-model="#confetti1-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-entity id="confetti2-el" gltf-model="#confetti2-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-entity id="confetti3-el" gltf-model="#confetti3-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-entity id="confetti4-el" gltf-model="#confetti4-asset"
    position="0 0 0" scale="1 1 1" visible="false" confetti-once></a-entity>

  <a-plane
    id="ground"
    rotation="-90 0 0"
    width="100"
    height="100"
    material="shader: shadow; opacity: 0.5;"
    shadow>
  </a-plane>

</a-scene>

<!-- ================================================================
  컴포넌트 등록 스크립트
  ----------------------------------------------------------------
  ★ 위치: </a-scene> 뒤, </body> 앞
  ★ 이유: 8th Wall 은 xr.js 가 async 로드된 뒤 'xrloaded' 이벤트를
          발생시키고, 그 시점까지 A-Frame 씬 초기화를 지연시킵니다.
          따라서 xrloaded 콜백 안에서 컴포넌트를 등록해도
          <a-scene> 파싱 전에 등록이 완료됩니다.
          반대로 <head> 안 인라인 스크립트는 xr.js 가 아직 로드되지
          않아 AFRAME 자체가 정의되지 않은 상태일 수 있어 에러가 납니다.
  ----------------------------------------------------------------
  window.XR8 이미 있으면 즉시 등록,
  없으면 xrloaded 이벤트 때 등록 — 8th Wall 공식 권장 패턴.
================================================================ -->
<script>
(function () {
  function registerComponents () {

    // ============================================================
    // [컴포넌트 1] confetti-once
    // 역할: GLB 모델의 첫 번째 애니메이션을 1회 재생 후 자동 숨김.
    //       keypad-controller 가 comp.playOnce() 로 직접 호출.
    // ============================================================
    AFRAME.registerComponent('confetti-once', {
      init () {
        this.mixer   = null;
        this._action = null;

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          if (!model.animations || model.animations.length === 0) {
            console.warn('[confetti-once] 애니메이션 없음:', this.el.id);
            return;
          }

          this.mixer = new THREE.AnimationMixer(model);

          const action = this.mixer.clipAction(model.animations[0]);
          action.setLoop(THREE.LoopOnce, 1);
          action.clampWhenFinished = true;
          this._action = action;

          // 재생 완료 → 숨김
          this.mixer.addEventListener('finished', () => {
            this.el.setAttribute('visible', false);
          });
        });
      },

      // keypad-controller 에서 호출
      playOnce () {
        this.el.setAttribute('visible', true);
        if (this._action) this._action.reset().play();
      },

      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // ============================================================
    // [컴포넌트 2] keypad-controller
    // 역할: btn4 모델의 버튼 클릭 → Take0N 재생 + 해당 컨페티 호출.
    //
    // [버튼 감지]
    //  클릭된 Three.js 메시와 부모 계층을 순회하며
    //  이름 안의 숫자(1~4)로 버튼 인덱스를 자동 결정합니다.
    //
    //  ★ 자동 감지가 안 될 때:
    //    콘솔의 "[keypad] mesh :" 로그에서 실제 메시명을 확인 후
    //    아래 BUTTON_NAME_MAP 에 직접 매핑하세요.
    //    예) BUTTON_NAME_MAP: { 'Btn_A': 0, 'Btn_B': 1, ... }
    // ============================================================
    AFRAME.registerComponent('keypad-controller', {

      // 직접 매핑 테이블 (자동 감지 성공 시 미사용)
      BUTTON_NAME_MAP: {
        // 'MeshName': 0,  // Take01 + confetti1
        // 'MeshName': 1,  // Take02 + confetti2
        // 'MeshName': 2,  // Take03 + confetti3
        // 'MeshName': 3,  // Take04 + confetti4
      },

      init () {
        this.mixer     = null;
        this.clips     = {};
        this.isPlaying = false;
        this._fallback = -1;

        this.el.classList.add('cantap');

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          this.mixer = new THREE.AnimationMixer(model);
          (model.animations || []).forEach(c => { this.clips[c.name] = c; });

          console.log('[keypad] 애니메이션 클립:', Object.keys(this.clips));
          model.traverse(n => { if (n.isMesh) console.log('[keypad] mesh :', n.name); });
        });

        this.el.addEventListener('click', (evt) => {
          const obj = evt.detail.intersection && evt.detail.intersection.object;
          if (!obj) return;
          const idx = this._detectButtonIndex(obj);
          this._playTake(idx + 1);
          this._triggerConfetti(idx);
        });
      },

      _detectButtonIndex (obj) {
        let cur = obj;
        while (cur) {
          const name = cur.name || '';
          if (name in this.BUTTON_NAME_MAP) return this.BUTTON_NAME_MAP[name];
          const m = name.match(/([1-4])\D*$/);
          if (m) return parseInt(m[1]) - 1;
          cur = cur.parent;
        }
        // 자동 감지 실패 시 순환 폴백
        console.warn('[keypad] 버튼 메시 감지 실패. 콘솔의 "mesh :" 로그를 보고 BUTTON_NAME_MAP 을 채워주세요.');
        this._fallback = (this._fallback + 1) % 4;
        return this._fallback;
      },

      _playTake (n) {
        if (!this.mixer || this.isPlaying) return;
        const clipName = `Take0${n}`;
        const clip     = this.clips[clipName];
        if (!clip) {
          console.warn(`[keypad] 클립 없음: "${clipName}". 실제 클립명을 콘솔에서 확인하세요.`);
          return;
        }
        this.isPlaying = true;
        const action = this.mixer.clipAction(clip);
        action.setLoop(AFRAME.THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
        action.reset().play();

        const onFinished = () => {
          this.isPlaying = false;
          this.mixer.removeEventListener('finished', onFinished);
        };
        this.mixer.addEventListener('finished', onFinished);
      },

      _triggerConfetti (idx) {
        const ids  = ['confetti1-el', 'confetti2-el', 'confetti3-el', 'confetti4-el'];
        const el   = document.getElementById(ids[idx]);
        if (!el) return;
        const comp = el.components['confetti-once'];
        if (comp) {
          comp.playOnce();
        } else {
          console.warn('[keypad] confetti-once 없음:', ids[idx]);
        }
      },

      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });
  }

  // 8th Wall 공식 패턴: XR8 이미 로드됐으면 즉시, 아니면 xrloaded 때 실행
  window.XR8
    ? registerComponents()
    : window.addEventListener('xrloaded', registerComponents);
})();
</script>
</body>
</html>
