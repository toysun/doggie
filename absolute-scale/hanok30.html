<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>car-absolute-scale</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>  
  
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="./../xr_st/coaching-overlay.js"></script>
  <script src="./CSS2DRenderer.js"></script>

  <script type="module" src="./app1.js" defer></script>
  <link rel="stylesheet" href="./index.css">
   <!-- 인트로 애니메이션 컴포넌트 -->
  <script>
    // A-Frame 로드 후 컴포넌트 등록
    window.addEventListener('load', () => {
      AFRAME.registerComponent('intro-animation', {
        init: function () {
          const wrapper = document.querySelector('#car-wrapper');
          const car = document.querySelector('#car');

          function runAnimation() {
            const duration = 2000;
            const startY = -3;
            const endY = 0;
            const startRot = 70;
            const endRot = 430;
            let startTime = null;

            function ease(t) {
              return 1 - Math.pow(1 - t, 3);
            }

            function animate(timestamp) {
              if (!startTime) startTime = timestamp;
              const elapsed = timestamp - startTime;
              const t = Math.min(elapsed / duration, 1);
              const e = ease(t);

              wrapper.object3D.position.y = startY + (endY - startY) * e;
              car.object3D.rotation.y = THREE.MathUtils.degToRad(
                startRot + (endRot - startRot) * e
              );

              if (t < 1) {
                requestAnimationFrame(animate);
              } else {
                wrapper.object3D.position.y = endY;
                car.object3D.rotation.y = THREE.MathUtils.degToRad(startRot);
              }
            }

            requestAnimationFrame(animate);
          }

          // model-loaded 이벤트 우선, 타임아웃 폴백
          car.addEventListener('model-loaded', () => {
            setTimeout(runAnimation, 300); // 렌더링 안정화 대기
          });

          // 혹시 이벤트를 이미 놓쳤을 경우 폴백
          setTimeout(() => {
            if (wrapper.object3D.position.y === -3) {
              runAnimation();
            }
          }, 3000);
        }
      });
    });
  </script>
</head>

<body>
<div id="container"></div>

<a-scene
  responsive-immersive
  coaching-overlay
  landing-page
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
  renderer="colorManagement: true"
  xrweb="allowedDevices: any;
    defaultEnvironmentFogIntensity: 0.5; 
    defaultEnvironmentFloorTexture: #groundTex; 
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC; 
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;
    scale: absolute">

  <a-assets>
    <!--a-asset-item id="carModel" src="./assets/car.glb"></a-asset-item-->
    <a-asset-item id="carModel" src="https://guide3.ivyro.net/etc/korea_traditional_house__folk__education__hall.glb"></a-asset-item>
    <img id="groundTex" src="assets/textures/concrete.jpg">
  </a-assets>

  <a-camera
    id="camera"
    position="0 1.75 4"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>
  
  <a-entity
    xr-light
    light="type: directional;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 20;
      shadowCameraBottom: -20;
      shadowCameraLeft: -20;
      shadowCameraRight: 20;
      target: #car;
      shadowRadius: 3"
    xrextras-attach="target: car; offset: 0 15 0;"
    shadow>
  </a-entity>
  
  <a-light
    xr-light="max: 0.5"
    type="ambient">
  </a-light>
<!-- 인트로 애니메이션 컴포넌트 엔티티 -->
  <a-entity intro-animation></a-entity>

  <!-- 래퍼: 위치 애니메이션 담당 -->
  <a-entity id="car-wrapper" position="0 -3 0">
    <!-- 모델: 회전·드래그 인터랙션 담당 -->
  <a-entity
    id="car"
    gltf-model="#carModel"
    rotation="0 0 0"
    scale="0.3 0.3 0.3"
    xrextras-hold-drag="rise-height: 0"
    xrextras-two-finger-rotate
    xrextras-pinch-scale
    proximity
    animation__rise="property: position;
        from: 0 -3 0;
        to: 0 0 0;
        dur: 2000;
        easing: easeOutCubic;
        startEvents: model-loaded"
    animation__spin="property: rotation;
        from: 0 70 0;
        to: 0 430 0;
        dur: 2000;
        easing: easeOutCubic;
        startEvents: model-loaded"
    shadow="receive: false">
  </a-entity>

  <a-plane
    id="ground"
    rotation="-90 0 0"
    width="100"
    height="100"
    material="shader: shadow; opacity: 0.5;"
    shadow
  ></a-plane>
</a-scene>
</body>
</html>
