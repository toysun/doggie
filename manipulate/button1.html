<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>8th Wall Web: Manipulate</title>

    <script src="./../xr_st/8frame-1.3.0.min.js"></script>
    <script src="./../xr_st/xrextras.js"></script>
    <script src='./../xr_st/landing-page.js'></script>
    <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
    <script src="./../xr_st/coaching-overlay.js"></script>
    <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    </head>

  <body>
    <a-scene
      xrextras-gesture-detector 
      landing-page
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb="allowedDevices: any">

      <a-assets>
        <a-asset-item id="btn4-asset"      src="./click-4-buttons.glb"></a-asset-item>
        <a-asset-item id="confetti1-asset" src="./heart-balloons-pastel-confetti.glb"></a-asset-item>
        <a-asset-item id="confetti2-asset" src="./heart-balloon-color-confetti.glb"></a-asset-item>
        <a-asset-item id="confetti3-asset" src="./star-balloon-confetti.glb"></a-asset-item>
        <a-asset-item id="confetti4-asset" src="./flower-confetti.glb"></a-asset-item>
      </a-assets>

      <xrextras-capture-button></xrextras-capture-button>
      <xrextras-capture-preview></xrextras-capture-preview>

      <a-camera
        id="camera"
        position="0 16 24"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-entity
        light="
          type: directional;
          intensity: 0.8;
          castShadow: true;
          shadowMapHeight:2048;
          shadowMapWidth:2048;
          shadowCameraTop: 10;
          target: #keypad;"
        xrextras-attach="target: keypad; offset: 1 15 3;"
        shadow>
      </a-entity>

      <a-light type="ambient" intensity="0.7"></a-light>

      <a-entity
        id="keypad"
        gltf-model="#btn4-asset"
        keypad-controller
        xrextras-hold-drag
        xrextras-two-finger-rotate
        xrextras-pinch-scale
        scale="5 5 5"
        rotation="0 -70 0"
        shadow="receive: false">
        
        <a-box class="cantap" keypad-button="idx: 0" position="-0.48 0.4 -0.48" width="0.8" height="0.8" depth="0.8" material="opacity: 0.4; color: #ff4d4d; transparent: true; shader: flat"></a-box>
        <a-box class="cantap" keypad-button="idx: 1" position="0.48 0.4 -0.48" width="0.8" height="0.8" depth="0.8" material="opacity: 0.4; color: #4dff88; transparent: true; shader: flat"></a-box>
        <a-box class="cantap" keypad-button="idx: 2" position="-0.48 0.4 0.48" width="0.8" height="0.8" depth="0.8" material="opacity: 0.4; color: #4d88ff; transparent: true; shader: flat"></a-box>
        <a-box class="cantap" keypad-button="idx: 3" position="0.48 0.4 0.48" width="0.8" height="0.8" depth="0.8" material="opacity: 0.4; color: #ffd24d; transparent: true; shader: flat"></a-box>
      </a-entity>

      <a-entity id="confetti1-el" gltf-model="#confetti1-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once fix-metal-material></a-entity>
      <a-entity id="confetti2-el" gltf-model="#confetti2-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once fix-metal-material></a-entity>
      <a-entity id="confetti3-el" gltf-model="#confetti3-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once fix-metal-material></a-entity>
      <a-entity id="confetti4-el" gltf-model="#confetti4-asset" position="0 0 0" scale="1 1 1" visible="false" confetti-once fix-metal-material></a-entity>

      <a-plane id="ground" rotation="-90 0 0" width="1000" height="1000" material="shader: shadow" shadow></a-plane>
    </a-scene>

<script>
(function () {
  function registerComponents () {

    // 0. 금속 재질 픽스 컴포넌트 (위치 이동)
    AFRAME.registerComponent('fix-metal-material', {
      init: function () {
        this.el.addEventListener('model-loaded', (evt) => {
          const model = evt.detail.model;
          model.traverse((node) => {
            if (node.isMesh && node.material) {
              node.material.metalness = 0.3;
              node.material.roughness = 0.5;
              node.material.needsUpdate = true;
            }
          });
        });
      }
    });

    // 1. 컨페티 1회 재생 및 자동 숨김 컴포넌트
    AFRAME.registerComponent('confetti-once', {
      init () {
        this.mixer   = null;
        this._action = null;

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          if (!model.animations || model.animations.length === 0) return;

          this.mixer = new THREE.AnimationMixer(model);
          const action = this.mixer.clipAction(model.animations[0]);
          action.setLoop(THREE.LoopOnce, 1);
          action.clampWhenFinished = true;
          this._action = action;
          
          this.mixer.addEventListener('finished', () => {
            this.el.setAttribute('visible', false);
          });
        });
      },
      playOnce () {
        this.el.setAttribute('visible', true);
        if (this._action) this._action.reset().play();
      },
      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // 2. 키패드 모델 제어 컴포넌트
    AFRAME.registerComponent('keypad-controller', {
      init () {
        this.mixer   = null;
        this.actions = {};

        this.el.addEventListener('model-loaded', (evt) => {
          const THREE = AFRAME.THREE;
          const model = evt.detail.model;

          this.mixer = new THREE.AnimationMixer(model);
          
          (model.animations || []).forEach(c => {
            const action = this.mixer.clipAction(c);
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            this.actions[c.name] = action;
          });
        });
      },

      _resolveAction (n) {
        const keys = Object.keys(this.actions);
        if (keys.length === 0) return null;

        const candidates = [`take0${n}`, `take${n}`];
        let found = keys.find(k => candidates.includes(k.toLowerCase().replace(/[\s_]/g, '')));
        if (found) return this.actions[found];

        const numPattern = new RegExp(`(^|[^0-9])0?${n}([^0-9]|$)`);
        found = keys.find(k => numPattern.test(k));
        if (found) return this.actions[found];
        if (keys.length === 4) return this.actions[keys[n - 1]];

        return null;
      },

      playTake (n) {
        if (!this.mixer) return;
        const action = this._resolveAction(n);
        if (!action) return;

        Object.values(this.actions).forEach(a => a.stop());
        action.reset();
        action.weight = 1; 
        action.play();
      },

      triggerConfetti (idx) {
        const ids  = ['confetti1-el', 'confetti2-el', 'confetti3-el', 'confetti4-el'];
        const el   = document.getElementById(ids[idx]);
        if (!el) return;
        const comp = el.components['confetti-once'];
        if (comp) comp.playOnce();
      },

      tick (t, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });

    // 3. 개별 버튼 히트박스 클릭 이벤트 컴포넌트
    AFRAME.registerComponent('keypad-button', {
      schema: { idx: { type: 'int', default: 0 } },
      init () {
        this.el.addEventListener('click', () => {
          const keypadEl = this.el.parentEl;
          const ctrl = keypadEl && keypadEl.components['keypad-controller'];
          if (!ctrl) {
            console.warn('키패드 컨트롤러를 찾을 수 없습니다.');
            return;
          }
          
          ctrl.playTake(this.data.idx + 1);
          ctrl.triggerConfetti(this.data.idx);
        });
      }
    });
  }

  window.XR8
    ? registerComponents()
    : window.addEventListener('xrloaded', registerComponents);
})();
</script>
  </body>
</html>
