<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Mobile Game Popup Template</title>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

    /* 임시 배경 (게임 화면 가정) */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pretendard Variable", sans-serif;
    }

    /* 셈플 테스트용 버튼 */
    .test-trigger-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #3ca89e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ── 팝업창 메인 스타일 시작 ── */
    
    /* 1. 백드롭 오버레이 (배경 어둡게) */
    .game-popup-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(0, 0, 0, 0.75) !important; /* 게임 몰입도를 위해 조금 더 어둡게 처리 */
      z-index: 100000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      
      /* 초기 상태 숨김 및 애니메이션 준비 */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    /* 팝업 활성화 상태 클래스 */
    .game-popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* 2. 팝업 컨테이너 바디 */
    .game-popup-container {
      width: 88% !important;
      max-width: 360px !important;
      background: #2c3e50 !important; /* 게임 UI용 딥블루 차콜 톤 */
      border: 4px solid #f1c40f !important; /* 골드 하이라이트 테두리 */
      border-radius: 16px !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0,0,0,0.4) !important;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      
      /* 기본 크기 축소 상태에서 활성화 시 커지도록 세팅 */
      transform: scale(0.85);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 바운스 효과 */
    }

    .game-popup-overlay.active .game-popup-container {
      transform: scale(1);
    }

    /* 3. 팝업 헤더 (타이틀 바) */
    .game-popup-header {
      background: #1a252f !important;
      padding: 14px 16px !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      border-bottom: 3px solid #34495e !important;
    }

    .game-popup-title {
      color: #f1c40f !important; /* 골드 타이틀 컬러 */
      font-size: 18px !important;
      font-weight: 800 !important;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8) !important; /* 가독성을 위한 강한 그림자 */
      letter-spacing: -0.5px;
    }

    .game-popup-close {
      background: none !important;
      border: none !important;
      color: #bdc3c7 !important;
      font-size: 26px !important;
      line-height: 1 !important;
      cursor: pointer !important;
      padding: 0 4px !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    .game-popup-close:active {
      color: #ffffff !important;
      transform: scale(0.9);
    }

    /* 4. 팝업 콘텐츠 바디 */
    .game-popup-body {
      padding: 24px 20px !important;
      color: #ecf0f1 !important;
      font-size: 15px !important;
      line-height: 1.6 !important;
      text-align: center !important;
      font-weight: 500 !important;
      word-break: keep-all !important;
      
      /* 텍스트가 아주 길어질 경우를 대비한 모바일 스크롤 안전장치 */
      max-height: 45vh !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    /* 5. 팝업 푸터 (하단 버튼 영역) */
    .game-popup-footer {
      background: #1a252f !important;
      padding: 12px 16px !important;
      display: flex !important;
      gap: 12px !important;
      justify-content: center !important;
      border-top: 2px solid #34495e !important;
    }

    /* 6. 게임 스타일 공통 버튼 */
    .popup-btn {
      flex: 1 !important;
      height: 46px !important; /* 모바일 터치 최적화 높이 */
      border-radius: 23px !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      border: none !important;
      cursor: pointer !important;
      box-shadow: 0 4px 0px rgba(0, 0, 0, 0.3) !important; /* 입체감 주는 하단 섀도우 */
      transition: transform 0.05s ease, box-shadow 0.05s ease !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* 버튼을 누르고 있을 때 들어가는 모션 효과 */
    .popup-btn:active {
      transform: translateY(3px) !important;
      box-shadow: 0 1px 0px rgba(0, 0, 0, 0.3) !important;
    }

    /* 긍정/확인 버튼 (그린/민트 계열) */
    .popup-btn.btn-primary {
      background: linear-gradient(to bottom, #5cb85c, #4cae4c) !important;
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5) !important;
    }

    /* 부정/취소/닫기 버튼 (다크그레이 계열) */
    .popup-btn.btn-secondary {
      background: linear-gradient(to bottom, #7f8c8d, #95a5a6) !important;
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5) !important;
    }
  </style>
</head>
<body>

  <button class="test-trigger-btn" onclick="openPopup()">팝업 열기 테스트</button>

  <div id="game_popup" class="game-popup-overlay">
    <div class="game-popup-container">
      
      <div class="game-popup-header">
        <span class="game-popup-title">🎁 특별 보상 획득</span>
        <button class="game-popup-close" onclick="closePopup()">&times;</button>
      </div>
      
      <div class="game-popup-body">
        스탬프 투어 미션을 완벽하게 완수하셨습니다!<br>
        모험가님을 위한 한정판 칭호와 <br>
        축하 폭죽 아이템이 인벤토리로 지급되었습니다.
      </div>
      
      <div class="game-popup-footer">
        <button class="popup-btn btn-secondary" onclick="closePopup()">닫기</button>
        <button class="popup-btn btn-primary" onclick="confirmAction()">보상 확인</button>
      </div>
      
    </div>
  </div>

  <script>
    // 팝업 열기 함수
    function openPopup() {
      const popup = document.getElementById('game_popup');
      if (popup) {
        popup.classList.add('active');
      }
    }

    // 팝업 닫기 함수
    function closePopup() {
      const popup = document.getElementById('game_popup');
      if (popup) {
        popup.classList.remove('active');
      }
    }

    // 확인 버튼 액션
    function confirmAction() {
      alert('보상 창으로 이동합니다!');
      closePopup();
    }

    // 오버레이 어두운 영역 터치 시에도 닫히게 설정 (선택 사항)
    document.getElementById('game_popup').addEventListener('click', function(e) {
      if (e.target === this) {
        closePopup();
      }
    });
  </script>
</body>
</html>
