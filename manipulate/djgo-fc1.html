<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>도깨비의 행운쿠키 — 단종GO</title>

  <script src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0;
      font-family:"Pretendard Variable",Pretendard,sans-serif; }
    html, body { margin:0; padding:0; width:100%; height:100%; }

    /* ── 시작화면 ────────────────────── */
    #container {
      position:fixed; inset:0; background:#edf6f5; z-index:999999;
      display:flex; flex-direction:column; align-items:center;
      justify-content:flex-start; overflow-y:auto;
      -webkit-overflow-scrolling:touch; padding:20px 15px 80px;
      transition:opacity 0.4s ease, visibility 0.4s ease;
    }
    #start_area {
      width:100%; max-width:450px; background:#fff; border-radius:20px;
      padding:35px 25px; margin:10px auto;
      box-shadow:0 10px 30px rgba(65,156,146,.06);
      border:1px solid #d3eae7; text-align:center;
    }
    .fortune-preview { font-size:4rem; margin-bottom:10px;
      animation:floatBounce 2s ease-in-out infinite; }
    @keyframes floatBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .guide-text { color:#245752; font-weight:700; font-size:15px;
      line-height:1.6; margin-bottom:25px; word-break:keep-all; }
    .photozone-container { display:flex; flex-direction:column; gap:20px; margin-top:15px; }
    .photozone-card {
      background:#fafdfd; border:1px solid #e1f0ee; border-radius:16px; padding:20px;
      display:flex; flex-direction:column; align-items:center;
      transition:transform .2s, border-color .2s;
    }
    .photozone-card:active { transform:scale(.98); border-color:#419c92; }
    .photozone-title { font-size:16px; font-weight:700; color:#35877e; margin-bottom:12px; }
    .cookie-preview-row { font-size:2.2rem; margin-bottom:16px; letter-spacing:2px; }
    .start-zone-btn {
      width:100%; max-width:220px; height:44px;
      background:linear-gradient(to right,#79cb83,#3ca89e);
      color:#fff; border:none; border-radius:22px;
      font-size:15px; font-weight:700; cursor:pointer;
      box-shadow:0 4px 10px rgba(60,168,158,.2); transition:opacity .2s;
    }
    .start-zone-btn:hover { opacity:.95; }

    /* ── 고정 버튼 ───────────────────── */
    #audio-toggle-btn, #ar-reset-btn {
      position:fixed; left:16px; width:54px; height:54px;
      border-radius:50%; border:3px solid #fff; background:#fff;
      font-size:20px; display:none; justify-content:center; align-items:center;
      cursor:pointer; z-index:9990; box-shadow:0 4px 12px rgba(0,0,0,.3);
      transition:transform .1s, background-color .2s; padding:0;
    }
    #audio-toggle-btn { bottom:95px; }
    #ar-reset-btn     { bottom:25px; }
    #audio-toggle-btn:active, #ar-reset-btn:active { transform:scale(.92); }

    /* ── 말풍선 ──────────────────────── */
    #dialogue-bubble {
      position:fixed; top:60px; left:0; right:0;
      display:none; justify-content:center; padding:0 16px;
      z-index:500; pointer-events:none;
    }
    .bubble-wrap { display:flex; align-items:flex-start; gap:10px; max-width:340px; }
    .g-face { font-size:2.8rem; flex-shrink:0; }
    .bubble {
      background:rgba(255,255,255,.96); border-radius:18px 18px 18px 4px;
      padding:12px 16px; box-shadow:0 4px 14px rgba(0,0,0,.25);
    }
    .bubble p { font-size:.9rem; line-height:1.65; color:#1a0533;
      font-weight:600; white-space:pre-line; }

    /* ── 선택 힌트 ───────────────────── */
    #select-hint {
      position:fixed; bottom:110px; left:0; right:0;
      display:none; justify-content:center; z-index:500; pointer-events:none;
    }
    .hint-box {
      background:rgba(255,215,0,.18); border:2px solid rgba(255,215,0,.7);
      border-radius:50px; padding:12px 28px; color:#c8900a;
      font-weight:800; font-size:1rem; backdrop-filter:blur(4px);
      animation:glowPulse 1.8s ease-in-out infinite;
    }
    @keyframes glowPulse { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 18px rgba(255,215,0,.45)} }

    /* ── 스파클 ──────────────────────── */
    #sparkle-overlay { position:fixed; inset:0; pointer-events:none; z-index:600; }
    .sparkle { position:absolute; font-size:1.8rem;
      animation:sparkleOut .9s ease-out forwards; }
    @keyframes sparkleOut {
      0%  { transform:translate(0,0) scale(.2); opacity:1; }
      100%{ transform:translate(var(--tx),var(--ty)) scale(1.2); opacity:0; }
    }

    /* ── 포춘 카드 ───────────────────── */
    #fortune-card {
      position:fixed; inset:0; z-index:700;
      background:rgba(0,0,0,.55); display:none;
      align-items:center; justify-content:center;
    }
    .card {
      background:linear-gradient(160deg,#fffef0,#fff8d6);
      border:3px solid #D4A017; border-radius:24px; width:300px;
      padding:28px 24px 22px; text-align:center;
      box-shadow:0 0 40px rgba(255,215,0,.35), 0 8px 30px rgba(0,0,0,.35);
      animation:cardReveal .45s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes cardReveal {
      from { transform:scale(.5) translateY(50px); opacity:0; }
      to   { transform:scale(1)  translateY(0);    opacity:1; }
    }
    .card-header { font-size:.78rem; color:#888; font-weight:700;
      letter-spacing:2px; margin-bottom:4px; }
    .card-title  { font-size:1rem; color:#D4A017; font-weight:900; margin-bottom:10px; }
    .card-grade  {
      display:inline-block; padding:5px 18px; border-radius:20px;
      font-size:1.1rem; font-weight:900; margin-bottom:14px; letter-spacing:1px;
    }
    .g-normal   { background:#e8f0e8; color:#2d6a2d; }
    .g-travel   { background:#e8f0ff; color:#1a4a9a; }
    .g-complete { background:#fff0e8; color:#9a4a1a; }
    .g-daegil   { background:linear-gradient(135deg,#FFD700,#FF8C00); color:#fff;
      box-shadow:0 0 18px rgba(255,200,0,.55); }
    .card-msg   { font-size:.98rem; line-height:1.72; color:#333;
      font-weight:600; margin-bottom:16px; }
    .card-kw    { display:inline-block; background:#f5f0d0; border:1px solid #D4A017;
      border-radius:20px; padding:4px 14px; font-size:.82rem; color:#9a7a00;
      font-weight:700; margin-bottom:16px; }
    .card-stars { font-size:1.1rem; color:#D4A017; margin-bottom:18px; }
    .card-btns  { display:flex; gap:10px; }
    .btn-photo  { flex:1; background:linear-gradient(135deg,#FFD700,#FF8C00); color:#1a0533;
      border:none; border-radius:12px; padding:12px; font-size:.9rem;
      font-weight:800; cursor:pointer; }
    .btn-close  { flex:1; background:#f0f0f0; color:#555; border:none;
      border-radius:12px; padding:12px; font-size:.9rem; font-weight:700; cursor:pointer; }

    /* ── 포토존 ──────────────────────── */
    #photo-ui {
      position:fixed; bottom:30px; left:0; right:0;
      display:none; justify-content:center; align-items:center; gap:16px; z-index:500;
    }
    .btn-shoot {
      width:70px; height:70px; border-radius:50%;
      background:#fff; border:4px solid #D4A017; font-size:1.9rem;
      cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3);
      display:flex; align-items:center; justify-content:center;
    }

    /* ── 대길 ────────────────────────── */
    #daegil-effect {
      position:fixed; inset:0; pointer-events:none; z-index:590;
      display:none; overflow:hidden;
    }
    #daegil-effect.on { display:block; }
    #daegil-effect .ray {
      position:absolute; top:50%; left:50%;
      width:180vmax; height:3px;
      background:linear-gradient(90deg,transparent,rgba(255,215,0,.5),transparent);
      transform-origin:left center; animation:rayRot 4s linear infinite;
    }
    @keyframes rayRot { to { transform:rotate(calc(var(--a)*1deg + 360deg)); } }
  </style>

  <!-- 금속 재질 보정 컴포넌트 (원본 소스와 동일) -->
  <script>
    AFRAME.registerComponent('fix-metal-material', {
      init() {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse(n => {
            if (n.isMesh && n.material) {
              n.material.metalness = 0.1;
              n.material.roughness = 0.35;
              n.material.needsUpdate = true;
            }
          });
        });
      }
    });
  </script>
</head>
<body>

<audio id="bgm" src="./Candy_Cart_Pursuit.mp3" loop></audio>
<button id="audio-toggle-btn" aria-label="음악 켜기/끄기">🎵</button>
<button id="ar-reset-btn" aria-label="처음으로">🔄</button>

<!-- 시작화면 -->
<div id="container">
  <div id="start_area">
    <div class="fortune-preview">🥠</div>
    <p class="guide-text">
      단종GO의 모든 여정을 완주한 당신에게<br>
      도깨비가 특별한 선물을 준비했습니다.<br><br>
      👹 포춘쿠키를 골라 오늘의 운세를 확인하세요!
    </p>
    <div class="photozone-container">
      <div class="photozone-card">
        <div class="photozone-title">✨ 도깨비의 행운쿠키</div>
        <div class="cookie-preview-row">👹 🥠🥠🥠🥠🥠</div>
        <button class="start-zone-btn" onclick="App.start()">🌟 운세 뽑기 시작</button>
      </div>
    </div>
  </div>
</div>

<!-- AR 오버레이 UI -->
<div id="dialogue-bubble">
  <div class="bubble-wrap">
    <div class="g-face">👹</div>
    <div class="bubble"><p id="dialogue-text"></p></div>
  </div>
</div>
<div id="select-hint"><div class="hint-box">🥠 포춘쿠키를 하나 터치하세요!</div></div>
<div id="sparkle-overlay"></div>
<div id="daegil-effect">
  <div class="ray" style="--a:0"></div><div class="ray" style="--a:40"></div>
  <div class="ray" style="--a:80"></div><div class="ray" style="--a:120"></div>
  <div class="ray" style="--a:160"></div><div class="ray" style="--a:200"></div>
</div>
<div id="fortune-card">
  <div class="card">
    <div class="card-header">🥠 오늘의 운세</div>
    <div class="card-title"  id="fc-title">도깨비의 행운쿠키</div>
    <div class="card-grade"  id="fc-grade">행운</div>
    <div class="card-msg"    id="fc-msg">메시지</div>

    <div class="card-stars"  id="fc-stars">★★★★☆</div>

      <button class="btn-photo" onclick="App.goPhoto()">📸 포토존</button>

</div>

<!-- ============================================================
  A-Frame 씬 — 원본 photozone 소스 구조 그대로 유지
  ============================================================ -->
<a-scene
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true"
  xrweb="allowedDevices: any"
  postprocessing="bloomStrength: 0.2"
  xrextras-capture-config="requestMic: none">

  <a-assets>
    <a-asset-item id="goblin-glb" src="./kkebi-cave-lowpoly.glb"></a-asset-item>
    <!-- fortune_cookie.glb 가 있으면 쿠키 엔티티의 gltf-model 주석을 해제하세요 -->
    <a-asset-item id="cookie-glb" src="./fortune_cookie.glb"></a-asset-item>
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    id="camera"
    position="0 4 8"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-entity
    light="type: directional; intensity: 1.2; castShadow: true;
      shadowMapHeight:2048; shadowMapWidth:2048; shadowCameraTop:10; target:#goblin-entity;"
    xrextras-attach="target: goblin-entity; offset: 1 15 3;" shadow>
  </a-entity>
  <a-light type="ambient" intensity="0.9"></a-light>

  <!-- ============================================================
    AR 콘텐츠 그룹 — position 컨테이너만 담당
    ============================================================ -->
  <a-entity id="ar-group" visible="false" position="0 0 -2">

    <!-- ── 도깨비 ─────────────────────────────────────────────
      ★ 원본 photozone(button.txt) 과 완전히 동일한 구조:
        gltf-model + xrextras-hold-drag 가 동일 엔티티에 위치
      ★ scale="1 1 1" 로 시작 (0 이면 xrextras-pinch-scale 오작동)
      ★ visible="false" → start() 에서 visible=true 로만 전환
    ─────────────────────────────────────────────────────────── -->
    <a-entity
      id="goblin-entity"
      visible="false"
      gltf-model="#goblin-glb"
      scale="1 1 1"
      rotation="0 0 0"
      animation-mixer="clip: Idle; loop: repeat"
      xrextras-hold-drag
      xrextras-two-finger-rotate
      xrextras-pinch-scale
      proximity
      shadow="receive: false"
      fix-metal-material
      animation__idle="property:position; from:0 0 0; to:0 0.08 0;
        dur:2200; direction:alternate; loop:true; easing:easeInOutSine">
    </a-entity>

    <!-- ── 포춘쿠키 5개 ────────────────────────────────────────
      ★ 위치 변경 포인트:
        - Z 양수(+) = 카메라 방향 = 도깨비 앞쪽에 배치
        - 반원 반경 3m (기존 0.65m의 약 5배)
        - radius 1.2m (기존 0.22m의 약 5.5배)
        - 높이(y) 1.5~2m — 눈높이 부근에 크게 배치
    ─────────────────────────────────────────────────────────── -->
    <!-- 왼쪽 끝 -->
    <a-sphere id="cookie-0" class="cantap" cookie-tap="idx:0"
      visible="false" scale="0 0 0"
      position="-3.0 1.5 0.5"
      radius="1.2" color="#D4A017"
      metalness="0.2" roughness="0.55" shadow>
    </a-sphere>

    <!-- 왼쪽 -->
    <a-sphere id="cookie-1" class="cantap" cookie-tap="idx:1"
      visible="false" scale="0 0 0"
      position="-1.8 1.8 2.5"
      radius="1.2" color="#C8960C"
      metalness="0.2" roughness="0.55" shadow>
    </a-sphere>

    <!-- 중앙 (카메라와 가장 가까운 위치) -->
    <a-sphere id="cookie-2" class="cantap" cookie-tap="idx:2"
      visible="false" scale="0 0 0"
      position="0 2.0 3.2"
      radius="1.2" color="#E8B420"
      metalness="0.2" roughness="0.55" shadow>
    </a-sphere>

    <!-- 오른쪽 -->
    <a-sphere id="cookie-3" class="cantap" cookie-tap="idx:3"
      visible="false" scale="0 0 0"
      position="1.8 1.8 2.5"
      radius="1.2" color="#B8820A"
      metalness="0.2" roughness="0.55" shadow>
    </a-sphere>

    <!-- 오른쪽 끝 -->
    <a-sphere id="cookie-4" class="cantap" cookie-tap="idx:4"
      visible="false" scale="0 0 0"
      position="3.0 1.5 0.5"
      radius="1.2" color="#F0C030"
      metalness="0.2" roughness="0.55" shadow>
    </a-sphere>

  </a-entity><!-- /ar-group -->

  <a-plane id="ground" rotation="-90 0 0" width="1000" height="1000"
    material="shader: shadow; opacity: 0.5" shadow></a-plane>

</a-scene>

const GRADE_W   = {normal:.45, travel:.75, complete:.92, daegil:1.0};
const GRADE_CSS = {normal:'g-normal', travel:'g-travel', complete:'g-complete', daegil:'g-daegil'};
const GRADE_LBL = {normal:'행운', travel:'여행운', complete:'완주운', daegil:'大吉'};
const LINES = [
  '오호! 여기까지 왔구나!\n단종GO의 모든 여정을 완주한 걸 축하한다!',
  '그냥 보내줄 순 없지!\n내가 특별한 선물을 준비했어.',
  '이 중 하나를 골라봐.\n너의 앞날을 살짝 보여줄 테니까!',
  '흐음~ 너무 고민하면 복이 달아난다구!',
];
const COOKIE_IDS = ['cookie-0','cookie-1','cookie-2','cookie-3','cookie-4'];

// ════════════════════════════════════════
//  [2] 앱 제어
// ════════════════════════════════════════
const App = {
  state:'idle', cookieFortunes:[], picked:null, _dt:null, _ht:null,
  $: id => document.getElementById(id),
  flex: id => { const e=document.getElementById(id); if(e) e.style.display='flex'; },
  none: id => { const e=document.getElementById(id); if(e) e.style.display='none'; },

  // ── 시작 (원본 photozone 패턴 동일) ──────────────────────────
  start() {
    const container = this.$('container');
    container.style.opacity = '0';
    setTimeout(() => {
      container.style.visibility = 'hidden';
      container.style.display    = 'none';
      this.$('audio-toggle-btn').style.display = 'flex';
      this.$('ar-reset-btn').style.display     = 'flex';

      // ar-group visible
      this.$('ar-group').setAttribute('visible','true');

      // 도깨비 등장 — visible=true + pop-in 스케일 애니메이션
      const goblin = this.$('goblin-entity');
      goblin.setAttribute('visible','true');
      goblin.setAttribute('scale','0 0 0');          // 잠깐 0으로 리셋
      goblin.setAttribute('animation__appear', {
        property:'scale', from:'0 0 0', to:'1 1 1',
        dur:600, easing:'easeOutBack'
      });
      goblin.emit('ar-start');

      setTimeout(() => this._say(0), 800);
      setTimeout(() => { this._say(1); setTimeout(()=>this._spawnCookies(),900); }, 3000);

    }, 400);
    const bgm = this.$('bgm');
    if (bgm) bgm.play().catch(()=>{});
    this.state = 'goblin_appear';
  },

  _say(idx, dur=2800) {
    clearTimeout(this._dt);
    this.$('dialogue-text').textContent = LINES[idx];
    this.flex('dialogue-bubble');
    if (idx < 2) this._dt = setTimeout(()=>this.none('dialogue-bubble'), dur);
  },

  // ── 쿠키 소환 ─────────────────────────────────────────────────
  // ★ a-sphere 에 직접 visible+animation → 단순하고 확실
  _spawnCookies() {
    this.state = 'cookie_appear';
    this.cookieFortunes = Array.from({length:5}, () => {
      const r = Math.random();
      let grade = 'normal';
      for (const [g,w] of Object.entries(GRADE_W)) { if(r<=w){grade=g;break;} }
      const pool = FORTUNE_DATA.filter(f=>f.grade===grade);
      return pool[Math.floor(Math.random()*pool.length)];
    });

    COOKIE_IDS.forEach((id, i) => {
      setTimeout(() => {
        const el = this.$(id);
        if (!el) return;
        // 1. visible 먼저 true (scale=0 이므로 보이지 않음)
        el.setAttribute('visible','true');
        // 2. scale 0→1 애니메이션 — 각 쿠키마다 고유 이름 사용
        el.setAttribute('animation__spawn', {
          property:'scale', from:'0 0 0', to:'1 1 1',
          dur:420, easing:'easeOutBack'
        });
        // 3. idle 떠오르기 — 쿠키 크기(반경 1.2m)에 맞춰 float 폭 0.35m
        const pos = el.getAttribute('position');
        el.setAttribute('animation__idle', {
          property:'position',
          from:`${pos.x} ${pos.y} ${pos.z}`,
          to:  `${pos.x} ${pos.y+0.35} ${pos.z}`,
          dur:1600 + i*120, direction:'alternate', loop:true, easing:'easeInOutSine'
        });
      }, i * 260);
    });

    setTimeout(() => {
      this._say(2);
      this.flex('select-hint');
      this.state = 'waiting';
      this._ht = setTimeout(()=>this._say(3), 10000);
    }, 1600);
  },

  // ── 쿠키 선택 (cookie-tap 컴포넌트에서 호출) ──────────────────
  onPick(idx) {
    if (this.state !== 'waiting') return;
    this.state = 'selected';
    clearTimeout(this._ht);
    this.none('select-hint');
    this.none('dialogue-bubble');
    this.picked = this.cookieFortunes[idx];

    // 선택 안 된 쿠키 사라지기
    COOKIE_IDS.forEach((id,i) => {
      if (i===idx) return;
      const el = this.$(id);
      el.removeAttribute('animation__idle');
      el.setAttribute('animation__out', {
        property:'scale', to:'0 0 0', dur:350, easing:'easeInBack'
      });
      setTimeout(() => el.setAttribute('visible','false'), 360);
    });

    // 선택된 쿠키 흔들기 → 위로 → 사라지기
    const chosen = this.$(COOKIE_IDS[idx]);
    chosen.removeAttribute('animation__idle');
    chosen.setAttribute('animation__shake', {
      property:'rotation', from:'0 0 -18', to:'0 0 18',
      dur:110, direction:'alternate', loop:7, easing:'linear'
    });
    const cpos = chosen.getAttribute('position');
    setTimeout(() => {
      chosen.setAttribute('animation__rise', {
        property:'position', from:`${cpos.x} ${cpos.y} ${cpos.z}`,
        to:`${cpos.x} ${cpos.y+0.7} ${cpos.z}`, dur:520, easing:'easeOutCubic'
      });
    }, 820);

    setTimeout(() => {
      this._sparkle();
      chosen.setAttribute('animation__vanish', {
        property:'scale', to:'0 0 0', dur:280, easing:'easeInBack'
      });
    }, 1380);

    setTimeout(() => this._revealFortune(), 2100);
  },

  _sparkle() {
    const con = this.$('sparkle-overlay');
    const cx=window.innerWidth/2, cy=window.innerHeight/2;
    const emojis = '✨⭐🌟💫🌠🎊🎉'.split('');
    for(let i=0;i<20;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const ang=Math.random()*360, dist=70+Math.random()*140;
      s.style.cssText=`left:${cx}px;top:${cy}px;
        --tx:${Math.cos(ang*Math.PI/180)*dist}px;
        --ty:${Math.sin(ang*Math.PI/180)*dist-100}px;
        animation-delay:${Math.random()*.2}s;
        font-size:${1.1+Math.random()*.9}rem`;
      con.appendChild(s);
    }
    setTimeout(()=>{con.innerHTML='';},1100);
  },

  _revealFortune() {
    this.state = 'fortune';
    const f = this.picked;
    this.$('fc-title').textContent = `🥠 ${f.title}`;
    this.$('fc-grade').textContent = GRADE_LBL[f.grade];
    this.$('fc-grade').className   = `card-grade ${GRADE_CSS[f.grade]}`;
    this.$('fc-msg').textContent   = f.msg;
    this.$('fc-kw').textContent    = `#${f.kw}`;
    this.$('fc-stars').textContent = f.stars;
    if (f.grade==='daegil') {
      this.$('daegil-effect').classList.add('on');
      setTimeout(()=>this.$('daegil-effect').classList.remove('on'), 7000);
    }
    this.flex('fortune-card');
  },

  closeCard() { this.none('fortune-card'); this.goPhoto(); },

  goPhoto() {
    this.state = 'photo';
    this.none('fortune-card');
    this.$('goblin-entity').emit('celebrate');
    this.flex('photo-ui');
  },

  // ── 리셋 ─────────────────────────────────────────────────────
  reset() {
    const bgm = this.$('bgm');
    if(bgm){ bgm.pause(); bgm.currentTime=0; }
    const aBtn = this.$('audio-toggle-btn');
    if(aBtn){ aBtn.innerText='🎵'; aBtn.style.backgroundColor='#fff'; aBtn.style.display='none'; }
    this.$('ar-reset-btn').style.display='none';

    this.$('ar-group').setAttribute('visible','false');
    const goblin = this.$('goblin-entity');
    goblin.setAttribute('visible','false');
    goblin.setAttribute('scale','0 0 0');

    COOKIE_IDS.forEach(id => {
      const el=this.$(id);
      if(!el) return;
      el.setAttribute('visible','false');
      el.setAttribute('scale','0 0 0');
      ['animation__idle','animation__spawn','animation__out',
       'animation__shake','animation__rise','animation__vanish'].forEach(a=>{
        if(el.hasAttribute(a)) el.removeAttribute(a);
      });
    });

    ['dialogue-bubble','select-hint','fortune-card','photo-ui'].forEach(id=>this.none(id));
    this.$('daegil-effect').classList.remove('on');
    this.$('sparkle-overlay').innerHTML='';

    const c=this.$('container');
    c.style.display='flex'; c.style.visibility='visible';
    setTimeout(()=>{ c.style.opacity='1'; },15);
    this.state='idle'; this.cookieFortunes=[]; this.picked=null;
  }
};

// ════════════════════════════════════════
//  [3] 컴포넌트 등록 (xrloaded 패턴)
// ════════════════════════════════════════
(function(){
  function registerComponents() {
    // cookie-tap: a-sphere 에 직접 부착 → click 이벤트가 sphere 에 발생 → 즉시 실행
    AFRAME.registerComponent('cookie-tap', {
      schema: { idx: {type:'int', default:0} },
      init() {
        this.el.addEventListener('click', () => App.onPick(this.data.idx));
      }
    });
  }
  window.XR8 ? registerComponents() : window.addEventListener('xrloaded', registerComponents);
})();

// ════════════════════════════════════════
//  [4] 버튼 이벤트 (원본 소스 패턴 동일)
// ════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const audioBtn = document.getElementById('audio-toggle-btn');
  const resetBtn = document.getElementById('ar-reset-btn');
  const bgm      = document.getElementById('bgm');

  if(audioBtn && bgm){
    ['click','touchstart'].forEach(ev=>{
      audioBtn.addEventListener(ev, e=>{
        e.preventDefault(); e.stopPropagation();
        if(bgm.paused){ bgm.play().catch(()=>{}); audioBtn.innerText='🎵'; audioBtn.style.backgroundColor='#fff'; }
        else           { bgm.pause();              audioBtn.innerText='🔇'; audioBtn.style.backgroundColor='#f1f3f2'; }
      },{passive:false});
    });
  }
  if(resetBtn){
    ['click','touchstart'].forEach(ev=>{
      resetBtn.addEventListener(ev, e=>{
        e.preventDefault(); e.stopPropagation();
        App.reset();
      },{passive:false});
    });
  }
  document.getElementById('shoot-btn').addEventListener('click',()=>{
    const cb=document.querySelector('xrextras-capture-button');
    if(cb) cb.click();
  });
});
</script>
