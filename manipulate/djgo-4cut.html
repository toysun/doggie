<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>인생네컷 AR 포토존</title>

  <script src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0;
      font-family: "Pretendard Variable", Pretendard, sans-serif; }
    html { height: -webkit-fill-available; overflow: hidden !important; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important;
      height: 100vh !important; height: 100dvh !important;
      min-height: -webkit-fill-available; display: block !important;
      position: fixed !important; top: 0 !important; left: 0 !important;
      overflow: hidden !important; -webkit-user-select: none;
      -webkit-touch-callout: none; }
    a-scene, canvas { width: 100% !important; height: 100% !important;
      height: 100dvh !important; height: -webkit-fill-available !important; }

    /* ── 시작화면 ─────────────────────────────────── */
    #container {
      position: fixed !important; top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important; height: 100dvh !important;
      background-color: #edf6f5 !important; z-index: 999999 !important;
      display: flex !important; flex-direction: column !important;
      align-items: center !important; justify-content: flex-start !important;
      overflow-y: auto !important; -webkit-overflow-scrolling: touch !important;
      padding: 20px 15px 80px !important;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #start_area {
      width: 100%; max-width: 450px; text-align: center;
      background: #ffffff; padding: 35px 25px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(65,156,146,.06);
      border: 1px solid #d3eae7; margin: 10px auto !important;
    }
    .guide-img { margin-bottom: 15px; max-width: 60%; height: auto; }
    .guide-text { color: #245752; font-weight: 700; font-size: 15px;
      line-height: 1.6; margin-bottom: 20px; word-break: keep-all; }
    .frame-preview { width: 100%; max-width: 280px;
      border-radius: 12px; margin: 0 auto 20px; display: block;
      box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    .start-btn {
      width: 100%; max-width: 240px; height: 50px;
      background: linear-gradient(to right, #ff6bb5, #a855f7);
      color: #fff; border: none; border-radius: 25px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 20px rgba(168,85,247,.35);
      transition: opacity .2s, transform .1s; letter-spacing: .5px;
    }
    .start-btn:active { opacity: .9; transform: scale(.97); }

    /* ── 셀카 촬영 패널 ──────────────────────────── */
    #selfie-panel {
      position: fixed; inset: 0; z-index: 9999998;
      display: none; flex-direction: column;
      background: #000; overflow: hidden;
    }
    #selfie-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    .selfie-top {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 54px 20px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10;
    }
    .shot-info { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .shot-dots { display: flex; gap: 6px; }
    .sdot { width: 11px; height: 11px; border-radius: 50%;
      background: rgba(255,255,255,.3); border: 2px solid rgba(255,255,255,.5);
      transition: background .2s; }
    .sdot.done  { background: #ff6bb5; border-color: #ff6bb5; }
    .sdot.active{ background: #fff;    border-color: #fff; box-shadow: 0 0 8px #fff; }

    .countdown-overlay {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s; z-index: 10; pointer-events: none;
    }
    .countdown-overlay.show { opacity: 1; }
    .cd-ring {
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
      border: 3px solid rgba(255,255,255,.25);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .cd-num  { font-size: 5.5rem; font-weight: 900; color: #fff; line-height: 1;
      animation: cdPop .35s cubic-bezier(.34,1.56,.64,1); }
    .cd-lbl  { font-size: .7rem; color: rgba(255,255,255,.75); font-weight: 600;
      letter-spacing: 2px; margin-top: 4px; }
    @keyframes cdPop { from { transform: scale(1.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .flash-fx { position: absolute; inset: 0; background: #fff;
      opacity: 0; pointer-events: none; transition: opacity .07s; z-index: 11; }
    .flash-fx.on { opacity: .9; }

    .thumb-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 16px 36px;
      background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
      display: flex; gap: 10px; justify-content: center; z-index: 10;
    }
    .tslot {
      width: 68px; height: 68px; border-radius: 10px;
      border: 2px solid rgba(255,255,255,.2); overflow: hidden;
      background: rgba(255,255,255,.08); flex-shrink: 0; position: relative;
    }
    .tslot img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .tslot .tick { position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; font-size: 1.5rem;
      opacity: 0; transition: opacity .2s; }
    .tslot.ok .tick { opacity: 1; }

    .selfie-action {
      position: absolute; bottom: 120px; left: 0; right: 0;
      display: flex; justify-content: center; z-index: 10;
    }
    #shoot-start-btn {
      background: linear-gradient(135deg, #ff6bb5, #a855f7);
      border-radius: 50px; padding: 14px 40px;
      font-size: 1rem; font-weight: 800; color: #fff; border: none;
      cursor: pointer; box-shadow: 0 6px 24px rgba(168,85,247,.4);
    }
    #ar-go-btn {
      display: none;
      background: linear-gradient(135deg, #22c55e, #0ea5e9);
      border-radius: 50px; padding: 16px 44px;
      font-size: 1.05rem; font-weight: 800; color: #fff; border: none;
      cursor: pointer; box-shadow: 0 6px 28px rgba(14,165,233,.45);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{box-shadow:0 6px 28px rgba(14,165,233,.45)}
      50%{box-shadow:0 6px 36px rgba(14,165,233,.7)} }

    /* ── 고정 버튼 ─────────────────────────────── */
    #audio-toggle-btn, #ar-reset-btn {
      position: fixed !important; left: 16px !important;
      width: 54px !important; height: 54px !important;
      border-radius: 50% !important; border: 3px solid #fff !important;
      background-color: #fff !important; font-size: 20px !important;
      display: none; justify-content: center !important;
      align-items: center !important; cursor: pointer !important;
      box-shadow: 0 4px 12px rgba(0,0,0,.3) !important; z-index: 9990 !important;
      transition: transform .1s ease, background-color .2s ease !important; padding: 0 !important;
    }
    #audio-toggle-btn { bottom: 95px !important; }
    #ar-reset-btn     { bottom: 25px !important; }
    #audio-toggle-btn:active, #ar-reset-btn:active { transform: scale(.92) !important; }
  </style>

  <script>
    /* ==== 원본 소스 컴포넌트 ====================================== */
    AFRAME.registerComponent('auto-play-animation', {
      schema: { preferredClip: { type: 'string', default: '' } },
      init() {
        const play = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !mesh.animations || !mesh.animations.length) return;
          const names = mesh.animations.map(a => a.name);
          let clip = this.data.preferredClip
            ? names.find(n => n.toLowerCase().includes(this.data.preferredClip.toLowerCase()))
            : null;
          if (!clip) clip = names[0];
          if (clip) this.el.setAttribute('animation-mixer', { clip, loop: 'repeat', timeScale: 1 });
        };
        this.el.getObject3D('mesh') ? play() : this.el.addEventListener('model-loaded', play);
      }
    });

    AFRAME.registerComponent('fix-metal-material', {
      init() {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse(node => {
            if (node.isMesh && node.material) {
              node.material.metalness = 0.1;
              node.material.roughness = 0.35;
              node.material.needsUpdate = true;
            }
          });
        });
      }
    });

    AFRAME.registerComponent('enable-drag-raycast', {
      init() {
        const bind = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) { mesh.traverse(n => { if (n.isMesh) n.el = this.el; }); refreshRaycaster(); }
        };
        this.el.getObject3D('mesh') ? bind() : this.el.addEventListener('model-loaded', bind);
      }
    });

    AFRAME.registerComponent('hit-proxy', {
      schema: { padding:{default:.12}, interval:{default:500}, debug:{default:false} },
      init() {
        this._v=new THREE.Vector3(); this._box=new THREE.Box3();
        this._size=new THREE.Vector3(); this._center=new THREE.Vector3();
        this._scale=new THREE.Vector3(); this._acc=0;
        const mat = new THREE.MeshBasicMaterial({
          color:0x00ff88, transparent:true,
          opacity: this.data.debug ? .25 : 0,
          depthWrite:false, depthTest:!this.data.debug, side:THREE.DoubleSide
        });
        this.mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
        this.mesh.name='hit-proxy'; this.mesh.renderOrder=-1;
        this.mesh.castShadow=false; this.mesh.receiveShadow=false;
        this.el.setObject3D('hitproxy', this.mesh);
        this.fit = this.fit.bind(this);
        this.el.addEventListener('model-loaded', () => { this.fit(); refreshRaycaster(); });
        this.el.addEventListener('ar-start', this.fit);
        this.fit(); refreshRaycaster();
      },
      fit() {
        const obj = this.el.object3D; if (!obj) return;
        obj.updateMatrixWorld(true);
        const box = this._box; box.makeEmpty();
        let bones = 0;
        obj.traverse(n => {
          if (n === this.mesh) return;
          if (n.isBone) { n.getWorldPosition(this._v); box.expandByPoint(this._v); bones++; }
          else if (n.isMesh && !n.isSkinnedMesh) box.expandByObject(n);
        });
        if (bones===0 || box.isEmpty()) { this.mesh.visible=false; box.setFromObject(obj); this.mesh.visible=true; }
        if (box.isEmpty()) return;
        box.getSize(this._size); box.getCenter(this._center);
        const pad = Math.max(this._size.x,this._size.y,this._size.z)*this.data.padding;
        this._size.addScalar(pad*2);
        obj.getWorldScale(this._scale);
        this.mesh.scale.set(
          this._size.x/(this._scale.x||1), this._size.y/(this._scale.y||1), this._size.z/(this._scale.z||1)
        );
        obj.worldToLocal(this._center); this.mesh.position.copy(this._center);
      },
      tick(time,dt) {
        this._acc+=dt||0;
        if (this._acc<this.data.interval) return;
        this._acc=0;
        if (this.el.object3D && this.el.object3D.visible) this.fit();
      },
      remove() { this.el.removeObject3D('hitproxy'); }
    });

    /* ==== 신규: 포토 텍스처 적용 컴포넌트 ========================
       GLB 내 cut_01 ~ cut_04 메시에 selfie 사진을 texture 로 적용.
       ① model-loaded 이벤트
       ② photos-ready 커스텀 이벤트
       두 조건 모두 충족되면 실행. 먼저 충족된 쪽이 대기하다가
       나머지 조건이 채워지는 순간 즉시 반영.
       ============================================================ */
    AFRAME.registerComponent('apply-photos', {
      init() {
        this._modelReady  = false;
        this._photosReady = false;

        this.el.addEventListener('model-loaded', () => {
          this._modelReady = true;
          console.log('[apply-photos] 모델 로드 완료');
          if (this._photosReady) this._apply();
        });

        window.addEventListener('photos-ready', () => {
          this._photosReady = true;
          console.log('[apply-photos] 사진 준비 완료');
          if (this._modelReady) this._apply();
          else if (this.el.getObject3D('mesh')) {
            // 이미 model-loaded 이벤트를 놓쳤을 경우
            this._modelReady = true; this._apply();
          }
        });

        // 이미 두 조건이 준비된 경우 (리셋 후 재시작)
        if (this.el.getObject3D('mesh') && window.photosReady) {
          this._modelReady=true; this._photosReady=true; this._apply();
        }
      },

      _apply() {
        const photos = window.capturedPhotos;
        if (!photos || photos.length < 4) {
          console.warn('[apply-photos] 사진 4장 부족:', photos ? photos.length : 0); return;
        }
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) { console.warn('[apply-photos] mesh 없음'); return; }

        // cut_01 ~ cut_04 노드 수집
        const targets = {};
        mesh.traverse(node => {
          if (node.isMesh && /^cut_0[1-4]$/.test(node.name)) {
            targets[node.name] = node;
          }
        });
        console.log('[apply-photos] 발견된 슬롯:', Object.keys(targets));

        const THREE = AFRAME.THREE;
        ['cut_01','cut_02','cut_03','cut_04'].forEach((name, i) => {
          const node = targets[name];
          if (!node || !photos[i]) return;

          const img = new Image();
          img.onload = () => {
            // 캔버스로 텍스처 생성
            const canvas = document.createElement('canvas');
            canvas.width  = img.naturalWidth  || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const tex = new THREE.CanvasTexture(canvas);
            // GLTF UV 좌표계 = Y 아래→위, 일반 이미지는 Y 위→아래
            // flipY=false 로 GLTF 관례에 맞춤
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;

            // 기존 material 의 map 만 교체해 조명/roughness 등 유지
            const existingMat = node.material;
            if (existingMat) {
              if (Array.isArray(existingMat)) {
                existingMat.forEach(m => { m.map=tex; m.color.set(0xffffff); m.needsUpdate=true; });
              } else {
                existingMat.map = tex;
                existingMat.color.set(0xffffff);
                existingMat.needsUpdate = true;
              }
            } else {
              node.material = new THREE.MeshStandardMaterial({
                map: tex, roughness: 0.6, metalness: 0.0
              });
            }
            console.log(`[apply-photos] ${name} 텍스처 적용 완료`);
          };
          img.onerror = () => console.error('[apply-photos] 이미지 로드 실패:', name);
          img.src = photos[i];
        });
      }
    });

    /* ==== 유틸 함수 ============================================= */
    function refreshRaycaster() {
      const cam = document.getElementById('camera');
      if (cam && cam.components && cam.components.raycaster) cam.components.raycaster.refreshObjects();
    }

    function triggerLandscapeFullscreen() {
      if (!window.matchMedia('(orientation: landscape)').matches) return;
      const d = document.documentElement;
      (d.requestFullscreen || d.webkitRequestFullscreen || function(){}).call(d);
      setTimeout(() => { window.scrollTo(0,1); window.dispatchEvent(new Event('resize')); refreshRaycaster(); }, 100);
    }

    window.matchMedia('(orientation: landscape)').addEventListener('change', e => { if (e.matches) triggerLandscapeFullscreen(); });
    window.addEventListener('orientationchange', () => setTimeout(triggerLandscapeFullscreen, 200));
    document.addEventListener('touchstart', triggerLandscapeFullscreen, {passive:true});
  </script>
</head>
<body>

<audio id="bgm" src="./Chasing_the_Morning_Sun.mp3" loop></audio>
<button id="audio-toggle-btn" aria-label="음악 켜기/끄기">🎵</button>
<button id="ar-reset-btn"     aria-label="처음으로">🔄</button>

<!-- ════════════════ 시작 화면 ════════════════ -->
<div id="container">
  <div id="start_area">
    <img src="./djgo-photo-auth.png" alt="인생네컷 AR 포토존" width="200" class="guide-img">
    <p class="guide-text">
      셀카 4장을 찍으면<br>
      AR 빨래줄 포토프레임에<br>
      사진이 걸립니다! 📸
    </p>
    <button class="start-btn" onclick="Selfie.open()">📷 인생네컷 시작하기</button>
  </div>
</div>

<!-- ════════════════ 셀카 촬영 패널 ════════════════ -->
<div id="selfie-panel">
  <video id="selfie-video" autoplay playsinline muted></video>

  <!-- 상단 정보 바 -->
  <div class="selfie-top">
    <span class="shot-info" id="shot-info">1 / 4</span>
    <div class="shot-dots">
      <div class="sdot active" id="d0"></div>
      <div class="sdot"        id="d1"></div>
      <div class="sdot"        id="d2"></div>
      <div class="sdot"        id="d3"></div>
    </div>
  </div>

  <!-- 카운트다운 -->
  <div class="countdown-overlay" id="cd-overlay">
    <div class="cd-ring">
      <div class="cd-num" id="cd-num">3</div>
      <div class="cd-lbl" id="cd-lbl">SMILE!</div>
    </div>
  </div>

  <!-- 플래시 효과 -->
  <div class="flash-fx" id="flash-fx"></div>

  <!-- 하단 썸네일 -->
  <div class="thumb-bar">
    <div class="tslot" id="t0"><span class="tick">✅</span></div>
    <div class="tslot" id="t1"><span class="tick">✅</span></div>
    <div class="tslot" id="t2"><span class="tick">✅</span></div>
    <div class="tslot" id="t3"><span class="tick">✅</span></div>
  </div>

  <!-- 액션 버튼 -->
  <div class="selfie-action">
    <button id="shoot-start-btn" onclick="Selfie.startShooting()">🎬 촬영 시작</button>
    <button id="ar-go-btn"       onclick="Selfie.launchAR()">🌟 AR 포토프레임 보기</button>
  </div>
</div>

<!-- ════════════════ A-Frame AR 씬 ════════════════ -->
<a-scene
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true"
  xrweb="allowedDevices: any"
  postprocessing="bloomStrength: 0.2"
  xrextras-capture-config="requestMic: none">

  <a-assets>
    <!-- 인생네컷 3D 포토프레임 (빨래줄 + 폴라로이드 4장) -->
    <a-asset-item id="frame-glb" src="./4-photo-frame-x90.glb"></a-asset-item>
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    id="camera"
    position="0 4 8"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-entity
    light="type: directional; intensity: 1.2; castShadow: true;
      shadowMapHeight:2048; shadowMapWidth:2048; shadowCameraTop:10;
      target: #photo-frame;"
    xrextras-attach="target: photo-frame; offset: 1 15 3;"
    shadow>
  </a-entity>
  <a-light type="ambient" intensity="0.9"></a-light>

  <!--
    ★ 인생네컷 3D 포토프레임
    GLB 내 메시 구조:
      Clothesline   - 빨래줄
      Clothespin_01~04 - 집게 4개
      cut_01~04     - 사진 영역 (→ selfie 사진 적용)
      PolaroidCard_01~04 - 폴라로이드 프레임
  -->
  <a-entity
    id="photo-frame"
    class="cantap"
    visible="false"
    gltf-model="#frame-glb"
    position="0 0 0"
    rotation="0 0 0"
    scale="3 3 3"
    xrextras-hold-drag
    xrextras-two-finger-rotate
    xrextras-pinch-scale
    proximity
    fix-metal-material
    enable-drag-raycast
    hit-proxy="padding: 0.15; debug: false"
    shadow="receive: false">
  </a-entity>

  <a-plane id="ground" rotation="-90 0 0" width="1000" height="1000"
    material="shader: shadow" shadow>
  </a-plane>
</a-scene>

<script>
/* ════════════════════════════════════════════════════
   전역 상태
════════════════════════════════════════════════════ */
window.capturedPhotos = [];
window.photosReady    = false;

/* ════════════════════════════════════════════════════
   Selfie 모듈 — 셀카 4장 촬영 관리
════════════════════════════════════════════════════ */
const Selfie = {
  stream:    null,
  shotIdx:   0,
  shooting:  false,

  // ── 1) 패널 열기 + 전면 카메라 시작 ─────────────
  async open() {
    // ★ 8th Wall 카메라 파이프라인 일시 정지 (front camera 충돌 방지)
    //   iOS/Android 는 카메라를 하나만 점유할 수 있어 XR8 를 먼저 해제해야 함
    if (window.XR8) {
      try { XR8.pause(); } catch(e) { console.warn('[XR8.pause]', e); }
      await new Promise(r => setTimeout(r, 400));
    }

    document.getElementById('container').style.opacity = '0';
    await new Promise(r => setTimeout(r, 350));
    document.getElementById('container').style.display = 'none';
    document.getElementById('selfie-panel').style.display = 'flex';

    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width:{ideal:1280}, height:{ideal:720} },
        audio: false
      });
      document.getElementById('selfie-video').srcObject = this.stream;
    } catch (e) {
      alert('카메라 권한이 필요합니다.\n브라우저 설정에서 카메라를 허용해 주세요.');
      // 카메라 획득 실패 시 XR8 재개
      if (window.XR8) { try { XR8.resume(); } catch(e2) {} }
    }
  },

  // ── 2) 카운트다운 시작 ────────────────────────────
  startShooting() {
    if (this.shooting) return;
    this.shooting = true;
    document.getElementById('shoot-start-btn').style.display = 'none';
    this._countdown(3);
  },

  _countdown(n) {
    const numEl   = document.getElementById('cd-num');
    const lblEl   = document.getElementById('cd-lbl');
    const overlay = document.getElementById('cd-overlay');
    const LABELS  = {3:'READY~', 2:'SET~', 1:'SMILE!'};

    overlay.classList.add('show');
    let cur = n;

    const tick = () => {
      if (cur > 0) {
        numEl.textContent = cur;
        lblEl.textContent = LABELS[cur] || '';
        // 숫자 교체 시 애니메이션 재실행
        numEl.style.animation = 'none';
        numEl.offsetHeight;           // reflow
        numEl.style.animation = '';
        cur--;
        setTimeout(tick, 900);
      } else {
        numEl.textContent = '📸';
        lblEl.textContent = '촬영!';
        overlay.classList.remove('show');
        this._capture();
      }
    };
    tick();
  },

  // ── 3) 사진 캡처 ─────────────────────────────────
  _capture() {
    const video  = document.getElementById('selfie-video');
    const canvas = document.createElement('canvas');
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    // 미러 반전 (selfie 자연스럽게)
    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    ctx.restore();
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

    // 플래시 효과
    const flash = document.getElementById('flash-fx');
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 200);

    const idx = this.shotIdx;
    window.capturedPhotos.push(dataUrl);

    // 썸네일 업데이트
    const slot = document.getElementById(`t${idx}`);
    const img  = document.createElement('img');
    img.src    = dataUrl;
    slot.appendChild(img);
    slot.classList.add('ok');

    // 도트 업데이트
    document.getElementById(`d${idx}`).classList.replace('active', 'done');
    this.shotIdx++;

    // 도트 상태
    document.querySelectorAll('.sdot').forEach((d, i) => {
      d.classList.remove('active');
      if (i === this.shotIdx) d.classList.add('active');
    });
    document.getElementById('shot-info').textContent = `${Math.min(this.shotIdx+1,4)} / 4`;

    if (this.shotIdx < 4) {
      // 다음 촬영 준비 (1.5초 대기)
      setTimeout(() => this._countdown(3), 1500);
    } else {
      // 4장 완료
      document.getElementById('ar-go-btn').style.display = 'block';
    }
  },

  // ── 4) AR 씬 시작 ─────────────────────────────────
  async launchAR() {
    // ★ iOS 13+ 모션·방향 센서 권한 요청
    //   반드시 사용자 제스처(버튼 클릭) 컨텍스트에서 호출해야 함.
    //   8th Wall 이 자체적으로 요청하기 전에 먼저 처리해야
    //   셀카 패널이 열려있어도 권한 팝업이 정상 동작함.
    const requestMotion = async () => {
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm !== 'granted') {
            alert('AR 실행을 위해 동작 센서 권한이 필요합니다.\n설정 > Safari > 동작 및 방향 접근을 허용해 주세요.');
            return false;
          }
        } catch (e) { console.warn('[motion permission]', e); }
      }
      return true;
    };

    const requestOrientation = async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm !== 'granted') {
            alert('AR 실행을 위해 방향 센서 권한이 필요합니다.');
            return false;
          }
        } catch (e) { console.warn('[orientation permission]', e); }
      }
      return true;
    };

    // 권한 요청 — 실패 시 AR 전환 중단
    const motionOk      = await requestMotion();
    if (!motionOk) return;
    const orientationOk = await requestOrientation();
    if (!orientationOk) return;

    // 전면 카메라 스트림 종료 + video 엘리먼트 초기화
    if (this.stream) {
      this.stream.getTracks().forEach(t => t.stop());
      this.stream = null;
    }
    const vid = document.getElementById('selfie-video');
    if (vid) { vid.pause(); vid.srcObject = null; }

    // photos-ready 이벤트 발행
    window.photosReady = true;
    window.dispatchEvent(new CustomEvent('photos-ready', { detail: { photos: window.capturedPhotos } }));

    // ★ 카메라 완전 해제 대기 후 XR8 재개 (후면 카메라 복원)
    await new Promise(r => setTimeout(r, 600));
    if (window.XR8) {
      try { XR8.resume(); } catch(e) { console.warn('[XR8.resume]', e); }
      await new Promise(r => setTimeout(r, 400));
    }

    // AR 씬 전환
    startNavigation();
  }
};

/* ════════════════════════════════════════════════════
   포토 텍스처 직접 적용 함수
   cut_01~04 메시에 selfie 사진을 MeshBasicMaterial 로 적용.
   MeshBasicMaterial: 조명 영향 없음 → 어떤 환경에서도 사진이 선명하게 표시됨.
   flipY=false: GLTF UV 좌표계(V=0이 상단) 기준
════════════════════════════════════════════════════ */
function applyPhotosToModel() {
  const el     = document.getElementById('photo-frame');
  const photos = window.capturedPhotos;
  if (!el || !photos || photos.length < 4) {
    console.warn('[applyPhotos] 조건 미충족 — el:', !!el, 'photos:', photos ? photos.length : 0);
    return;
  }

  const tryApply = (attempt) => {
    const mesh = el.getObject3D('mesh');
    if (!mesh) {
      if (attempt < 30) { setTimeout(() => tryApply(attempt + 1), 400); }
      else { console.error('[applyPhotos] mesh 취득 실패 (최대 재시도 초과)'); }
      return;
    }

    // cut_01 ~ cut_04 노드 수집
    const targets = {};
    mesh.traverse(node => {
      if (node.isMesh && /^cut_0[1-4]$/.test(node.name)) {
        targets[node.name] = node;
      }
    });
    console.log('[applyPhotos] 발견 슬롯:', Object.keys(targets), '/ 사진 수:', photos.length);

    const THREE = AFRAME.THREE;
    ['cut_01','cut_02','cut_03','cut_04'].forEach((name, i) => {
      const node = targets[name];
      if (!node) { console.warn('[applyPhotos] 슬롯 없음:', name); return; }
      if (!photos[i]) { console.warn('[applyPhotos] 사진 없음 idx:', i); return; }

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth  || 512;
        canvas.height = img.naturalHeight || 512;
        canvas.getContext('2d').drawImage(img, 0, 0);

        const tex = new THREE.CanvasTexture(canvas);
        tex.flipY       = false;           // GLTF UV 좌표계
        tex.colorSpace  = THREE.SRGBColorSpace;
        tex.needsUpdate = true;

        // 조명 독립적인 MeshBasicMaterial 로 교체 → 항상 선명하게 표시
        node.material = new THREE.MeshBasicMaterial({
          map:         tex,
          side:        THREE.DoubleSide,
          transparent: false,
          toneMapped:  false
        });
        node.material.needsUpdate = true;
        console.log(`[applyPhotos] ${name} 적용 완료 (${canvas.width}×${canvas.height})`);
      };
      img.onerror = () => console.error('[applyPhotos] 이미지 로드 실패:', name, i);
      img.src = photos[i];
    });
  };

  tryApply(0);
}

/* ════════════════════════════════════════════════════
   AR 씬 제어 (원본 소스 패턴 유지)
════════════════════════════════════════════════════ */
const frameId       = 'photo-frame';
let   initialTransform = null;

function captureInitial() {
  const el = document.getElementById(frameId);
  if (!el || !el.object3D) return;
  initialTransform = {
    position: el.object3D.position.clone(),
    scale:    el.object3D.scale.clone(),
    rotation: el.object3D.rotation.clone()
  };
}

function restoreTransform() {
  const el = document.getElementById(frameId);
  const t  = initialTransform;
  if (!el || !t) return;
  el.object3D.position.copy(t.position);
  el.object3D.scale.copy(t.scale);
  el.object3D.rotation.copy(t.rotation);
}

function startNavigation() {
  triggerLandscapeFullscreen();

  const panel = document.getElementById('selfie-panel');
  panel.style.opacity = '0';
  panel.style.transition = 'opacity .4s ease';

  setTimeout(() => {
    panel.style.display = 'none';

    document.getElementById('audio-toggle-btn').style.display = 'flex';
    document.getElementById('ar-reset-btn').style.display     = 'flex';

    // 포토프레임 표시
    const el = document.getElementById(frameId);
    restoreTransform();
    el.setAttribute('visible', 'true');
    el.emit('ar-start');

    // 히트 프록시 갱신
    setTimeout(() => {
      if (el.components && el.components['hit-proxy']) el.components['hit-proxy'].fit();
      refreshRaycaster();

      // ★ 포토 텍스처 적용 — model 로드 완료 확인 후 즉시 실행
      applyPhotosToModel();
    }, 200);

  }, 400);

  // BGM
  const bgm = document.getElementById('bgm');
  if (bgm) bgm.play().catch(() => {});
}

/* ════════════════════════════════════════════════════
   버튼 이벤트 (DOMContentLoaded)
════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  const scene = document.querySelector('a-scene');
  (scene.hasLoaded ? Promise.resolve() : new Promise(r => scene.addEventListener('loaded', r)))
    .then(captureInitial);

  /* 오디오 토글 */
  const audioBtn = document.getElementById('audio-toggle-btn');
  const bgm      = document.getElementById('bgm');
  if (audioBtn && bgm) {
    ['click','touchstart'].forEach(ev => {
      audioBtn.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation();
        if (bgm.paused) {
          bgm.play().catch(() => {});
          audioBtn.innerText = '🎵'; audioBtn.style.backgroundColor = '#fff';
        } else {
          bgm.pause();
          audioBtn.innerText = '🔇'; audioBtn.style.backgroundColor = '#f1f3f2';
        }
      }, { passive: false });
    });
  }

  /* 리셋 버튼 */
  const resetBtn = document.getElementById('ar-reset-btn');
  if (resetBtn) {
    ['click','touchstart'].forEach(ev => {
      resetBtn.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation();

        // BGM 정지
        if (bgm) { bgm.pause(); bgm.currentTime = 0; }
        if (audioBtn) { audioBtn.innerText = '🎵'; audioBtn.style.backgroundColor = '#fff'; }
        audioBtn.style.display = 'none'; resetBtn.style.display = 'none';

        // 포토프레임 숨기기 & 위치 복원
        const el = document.getElementById(frameId);
        if (el) { el.setAttribute('visible','false'); restoreTransform(); }

        // 상태 초기화
        window.capturedPhotos = [];
        window.photosReady    = false;
        Selfie.shotIdx  = 0;
        Selfie.shooting = false;
        Selfie.stream   = null;

        // 썸네일·도트 초기화
        [0,1,2,3].forEach(i => {
          const t = document.getElementById(`t${i}`);
          if (t) { t.querySelectorAll('img').forEach(im=>im.remove()); t.classList.remove('ok'); }
          const d = document.getElementById(`d${i}`);
          if (d) { d.className = 'sdot' + (i===0 ? ' active' : ''); }
        });
        document.getElementById('shot-info').textContent = '1 / 4';
        document.getElementById('shoot-start-btn').style.display = '';
        document.getElementById('ar-go-btn').style.display        = 'none';

        // 시작화면 복귀
        const container = document.getElementById('container');
        container.style.display   = 'flex';
        container.style.visibility= 'visible';
        setTimeout(() => { container.style.opacity = '1'; }, 15);

      }, { passive: false });
    });
  }
});
</script>
