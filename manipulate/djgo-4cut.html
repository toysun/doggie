<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>인생네컷 AR 포토존</title>

  <script src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script src="./../xr_st/landing-page.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0;
      font-family:"Pretendard Variable",Pretendard,sans-serif; }
    html { height:-webkit-fill-available; overflow:hidden !important; }
    body { margin:0 !important; padding:0 !important; width:100% !important;
      height:100vh !important; height:100dvh !important;
      min-height:-webkit-fill-available; display:block !important;
      position:fixed !important; top:0 !important; left:0 !important;
      overflow:hidden !important; -webkit-user-select:none; -webkit-touch-callout:none; }
    a-scene, canvas { width:100% !important; height:100% !important;
      height:100dvh !important; height:-webkit-fill-available !important; }

    /* ── 시작 화면 ──────────────────────────────── */
    #container {
      position:fixed !important; top:0 !important; left:0 !important;
      width:100vw !important; height:100vh !important; height:100dvh !important;
      background:#edf6f5 !important; z-index:999999 !important;
      display:flex !important; flex-direction:column !important;
      align-items:center !important; justify-content:flex-start !important;
      overflow-y:auto !important; -webkit-overflow-scrolling:touch !important;
      padding:20px 15px 80px !important;
      transition:opacity .4s ease, visibility .4s ease;
    }
    #start_area {
      width:100%; max-width:450px; text-align:center; background:#fff;
      padding:35px 25px; border-radius:20px;
      box-shadow:0 10px 30px rgba(65,156,146,.06);
      border:1px solid #d3eae7; margin:10px auto !important;
    }
    .guide-img  { margin-bottom:15px; max-width:60%; height:auto; }
    .guide-text { color:#245752; font-weight:700; font-size:15px;
      line-height:1.6; margin-bottom:20px; word-break:keep-all; }
    .start-btn  {
      width:100%; max-width:240px; height:50px;
      background:linear-gradient(to right,#ff6bb5,#a855f7);
      color:#fff; border:none; border-radius:25px;
      font-size:16px; font-weight:700; cursor:pointer;
      box-shadow:0 6px 20px rgba(168,85,247,.35);
      transition:opacity .2s, transform .1s; letter-spacing:.5px;
    }
    .start-btn:active { opacity:.9; transform:scale(.97); }

    /* ── 셀카 촬영 패널 ─────────────────────────────
       ★ getUserMedia 대신 <input capture="user"> 사용
         → XR8 카메라와 충돌 없음, AR 화면 정지 없음, 조작 정상
    ──────────────────────────────────────────────── */
    #selfie-panel {
      position:fixed; inset:0; z-index:9999998;
      display:none; flex-direction:column; align-items:center;
      justify-content:center; overflow:hidden;
      background:linear-gradient(145deg,#0d0021 0%,#1a0033 50%,#0d1a33 100%);
    }
    .selfie-inner {
      width:100%; max-width:440px; padding:54px 24px 40px;
      display:flex; flex-direction:column; align-items:center; gap:22px;
    }
    .selfie-title { font-size:1.35rem; font-weight:900; color:#fff;
      text-align:center; line-height:1.4; }
    .selfie-title span { display:block; font-size:.82rem; font-weight:500;
      color:rgba(255,255,255,.5); margin-top:6px; }
    .shot-dots { display:flex; gap:8px; }
    .sdot { width:12px; height:12px; border-radius:50%;
      background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.35);
      transition:all .2s; }
    .sdot.done   { background:#ff6bb5; border-color:#ff6bb5; }
    .sdot.active { background:#fff;    border-color:#fff; box-shadow:0 0 10px #fff; }
    .thumb-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;
    }
    .tslot {
      aspect-ratio:3/4; border-radius:14px;
      border:2px dashed rgba(255,255,255,.22); overflow:hidden;
      background:rgba(255,255,255,.05); position:relative;
      display:flex; align-items:center; justify-content:center;
    }
    .tslot .num { font-size:2.2rem; color:rgba(255,255,255,.18); font-weight:900; }
    .tslot img  { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .tslot.ok   { border-color:#ff6bb5; border-style:solid; }
    #take-photo-btn {
      width:100%; max-width:280px; height:56px;
      background:linear-gradient(135deg,#ff6bb5,#a855f7);
      border-radius:50px; font-size:1.05rem; font-weight:800; color:#fff;
      border:none; cursor:pointer;
      box-shadow:0 8px 28px rgba(168,85,247,.45);
      transition:transform .1s, opacity .15s; letter-spacing:.5px;
    }
    #take-photo-btn:active   { transform:scale(.97); opacity:.9; }
    #take-photo-btn:disabled { opacity:.4; pointer-events:none; }
    #ar-go-btn {
      display:none; width:100%; max-width:280px; height:56px;
      background:linear-gradient(135deg,#22c55e,#0ea5e9);
      border-radius:50px; font-size:1.05rem; font-weight:800; color:#fff;
      border:none; cursor:pointer;
      box-shadow:0 8px 28px rgba(14,165,233,.45);
      animation:arPulse 1.8s ease-in-out infinite;
    }
    @keyframes arPulse {
      0%,100%{box-shadow:0 8px 28px rgba(14,165,233,.45)}
      50%    {box-shadow:0 8px 40px rgba(14,165,233,.75)}
    }

    /* ── 고정 버튼 ──────────────────────────────── */
    #audio-toggle-btn, #ar-reset-btn {
      position:fixed !important; left:16px !important;
      width:54px !important; height:54px !important;
      border-radius:50% !important; border:3px solid #fff !important;
      background:#fff !important; font-size:20px !important;
      display:none; justify-content:center !important; align-items:center !important;
      cursor:pointer !important; box-shadow:0 4px 12px rgba(0,0,0,.3) !important;
      z-index:9990 !important;
      transition:transform .1s ease, background-color .2s ease !important; padding:0 !important;
    }
    #audio-toggle-btn { bottom:95px !important; }
    #ar-reset-btn     { bottom:25px !important; }
    #audio-toggle-btn:active, #ar-reset-btn:active { transform:scale(.92) !important; }
  </style>

  <script>
    /* =========================================================
     *  원본 소스 컴포넌트 (제공된 소스 그대로)
     * ========================================================= */
    AFRAME.registerComponent('auto-play-animation', {
      schema: { preferredClip: { type:'string', default:'' } },
      init() {
        const play = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !mesh.animations || !mesh.animations.length) return;
          const names = mesh.animations.map(a => a.name);
          let clip = this.data.preferredClip
            ? names.find(n => n.toLowerCase().includes(this.data.preferredClip.toLowerCase()))
            : null;
          if (!clip) clip = names[0];
          if (clip) this.el.setAttribute('animation-mixer', { clip, loop:'repeat', timeScale:1 });
        };
        this.el.getObject3D('mesh') ? play() : this.el.addEventListener('model-loaded', play);
      }
    });

    AFRAME.registerComponent('fix-metal-material', {
      init() {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse(node => {
            if (node.isMesh && node.material) {
              node.material.metalness = 0.1;
              node.material.roughness = 0.35;
              node.material.needsUpdate = true;
            }
          });
        });
      }
    });

    AFRAME.registerComponent('enable-drag-raycast', {
      init() {
        const bind = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.traverse(n => { if (n.isMesh) n.el = this.el; });
            refreshRaycaster();
          }
        };
        this.el.getObject3D('mesh') ? bind() : this.el.addEventListener('model-loaded', bind);
      }
    });

    AFRAME.registerComponent('hit-proxy', {
      schema: { padding:{default:.12}, interval:{default:500}, debug:{default:false} },
      init() {
        this._v=new THREE.Vector3(); this._box=new THREE.Box3();
        this._size=new THREE.Vector3(); this._center=new THREE.Vector3();
        this._scale=new THREE.Vector3(); this._acc=0;
        const mat = new THREE.MeshBasicMaterial({
          color:0x00ff88, transparent:true,
          opacity: this.data.debug ? .25 : 0,
          depthWrite:false, depthTest:!this.data.debug, side:THREE.DoubleSide
        });
        this.mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
        this.mesh.name='hit-proxy'; this.mesh.renderOrder=-1;
        this.mesh.castShadow=false; this.mesh.receiveShadow=false;
        this.el.setObject3D('hitproxy', this.mesh);
        this.fit = this.fit.bind(this);
        this.el.addEventListener('model-loaded', () => { this.fit(); refreshRaycaster(); });
        this.el.addEventListener('ar-start', this.fit);
        this.fit(); refreshRaycaster();
      },
      fit() {
        const obj = this.el.object3D; if (!obj) return;
        obj.updateMatrixWorld(true);
        const box = this._box; box.makeEmpty();
        let bones = 0;
        obj.traverse(n => {
          if (n === this.mesh) return;
          if (n.isBone) { n.getWorldPosition(this._v); box.expandByPoint(this._v); bones++; }
          else if (n.isMesh && !n.isSkinnedMesh) box.expandByObject(n);
        });
        if (bones===0||box.isEmpty()) { this.mesh.visible=false; box.setFromObject(obj); this.mesh.visible=true; }
        if (box.isEmpty()) return;
        box.getSize(this._size); box.getCenter(this._center);
        const pad = Math.max(this._size.x,this._size.y,this._size.z)*this.data.padding;
        this._size.addScalar(pad*2);
        obj.getWorldScale(this._scale);
        this.mesh.scale.set(
          this._size.x/(this._scale.x||1),
          this._size.y/(this._scale.y||1),
          this._size.z/(this._scale.z||1)
        );
        obj.worldToLocal(this._center); this.mesh.position.copy(this._center);
      },
      tick(time,dt) {
        this._acc+=dt||0;
        if (this._acc<this.data.interval) return;
        this._acc=0;
        if (this.el.object3D&&this.el.object3D.visible) this.fit();
      },
      remove() { this.el.removeObject3D('hitproxy'); }
    });

    /* =========================================================
     *  유틸 함수
     * ========================================================= */
    function refreshRaycaster() {
      const cam = document.getElementById('camera');
      if (cam && cam.components && cam.components.raycaster)
        cam.components.raycaster.refreshObjects();
    }
    function triggerLandscapeFullscreen() {
      if (!window.matchMedia('(orientation: landscape)').matches) return;
      const d = document.documentElement;
      (d.requestFullscreen || d.webkitRequestFullscreen || function(){}).call(d);
      setTimeout(() => { window.scrollTo(0,1); window.dispatchEvent(new Event('resize')); refreshRaycaster(); }, 100);
    }
    window.matchMedia('(orientation: landscape)').addEventListener('change', e => { if (e.matches) triggerLandscapeFullscreen(); });
    window.addEventListener('orientationchange', () => setTimeout(triggerLandscapeFullscreen, 200));
    document.addEventListener('touchstart', triggerLandscapeFullscreen, {passive:true});
  </script>
</head>
<body>

<audio id="bgm" src="./Chasing_the_Morning_Sun.mp3" loop></audio>
<button id="audio-toggle-btn" aria-label="음악 켜기/끄기">🎵</button>
<button id="ar-reset-btn"     aria-label="처음으로">🔄</button>

<!-- ══════════════════════ 시작 화면 ══════════════════════ -->
<div id="container">
  <div id="start_area">
    <img src="./djgo-photo-auth.png" alt="인생네컷 AR 포토존" width="200" class="guide-img">
    <p class="guide-text">
      셀카 4장을 찍으면<br>
      AR 빨래줄 포토프레임에<br>
      사진이 걸립니다! 📸
    </p>
    <button class="start-btn" onclick="Selfie.open()">📷 인생네컷 시작하기</button>
  </div>
</div>

<!-- ══════════════════════ 셀카 촬영 패널 ══════════════════════
  ★ getUserMedia 완전 제거 — <input capture="user"> 방식 사용
    → 8th Wall XR 카메라와 충돌 없음
    → AR 화면 정지·조작 불가 문제 해결
═══════════════════════════════════════════════════════════════ -->
<div id="selfie-panel">
  <div class="selfie-inner">

    <div class="selfie-title">
      인생네컷 셀카 촬영 📸
      <span>버튼을 누르면 카메라가 열립니다.<br>4장을 모두 찍어주세요!</span>
    </div>

    <div class="shot-dots">
      <div class="sdot active" id="d0"></div>
      <div class="sdot"        id="d1"></div>
      <div class="sdot"        id="d2"></div>
      <div class="sdot"        id="d3"></div>
    </div>

    <!-- 2 × 2 썸네일 그리드 -->
    <div class="thumb-grid">
      <div class="tslot" id="t0"><span class="num">1</span></div>
      <div class="tslot" id="t1"><span class="num">2</span></div>
      <div class="tslot" id="t2"><span class="num">3</span></div>
      <div class="tslot" id="t3"><span class="num">4</span></div>
    </div>

    <button id="take-photo-btn" onclick="Selfie.takePhoto()">📸 1번째 사진 찍기</button>
    <button id="ar-go-btn"      onclick="Selfie.launchAR()">🌟 AR 포토프레임 보기</button>
  </div>

  <!-- OS 네이티브 전면 카메라 (invisible) -->
  <input type="file" accept="image/*" capture="user"
         id="file-capture" style="position:absolute;opacity:0;pointer-events:none;">
</div>

<!-- ══════════════════════ A-Frame AR 씬 ══════════════════════ -->
<a-scene
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true"
  xrweb="allowedDevices: any"
  postprocessing="bloomStrength: 0.2"
  xrextras-capture-config="requestMic: none">

  <a-assets>
    <!-- 인생네컷 3D 포토프레임 (빨래줄 + 폴라로이드 4장) -->
    <a-asset-item id="frame-glb" src="./4-photo-frame-x90.glb"></a-asset-item>
  </a-assets>

  <xrextras-capture-button></xrextras-capture-button>
  <xrextras-capture-preview></xrextras-capture-preview>

  <a-camera
    id="camera"
    position="0 4 8"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-entity
    light="type: directional; intensity: 1.2; castShadow: true;
      shadowMapHeight:2048; shadowMapWidth:2048; shadowCameraTop:10;
      target: #photo-frame;"
    xrextras-attach="target: photo-frame; offset: 1 15 3;" shadow>
  </a-entity>
  <a-light type="ambient" intensity="0.9"></a-light>

  <!--
    GLB 메시 구조:
      Clothesline        빨래줄
      Clothespin_01~04   집게 4개
      cut_01~04          ← selfie 사진 텍스처 적용
      PolaroidCard_01~04 폴라로이드 프레임
  -->
  <a-entity
    id="photo-frame"
    class="cantap"
    visible="false"
    gltf-model="#frame-glb"
    position="0 0 0"
    rotation="0 0 0"
    scale="3 3 3"
    xrextras-hold-drag
    xrextras-two-finger-rotate
    xrextras-pinch-scale
    proximity
    fix-metal-material
    enable-drag-raycast
    hit-proxy="padding: 0.15; debug: false"
    shadow="receive: false">
  </a-entity>

  <a-plane id="ground" rotation="-90 0 0" width="1000" height="1000"
    material="shader: shadow" shadow></a-plane>
</a-scene>

<script>
/* ═══════════════════════════════════════════════════════════
   전역 상태
═══════════════════════════════════════════════════════════ */
window.capturedPhotos = [];
window.photosReady    = false;

/* ═══════════════════════════════════════════════════════════
   Selfie 모듈 — 네이티브 카메라(<input capture>) 방식
   ★ getUserMedia 완전 미사용 → XR8 카메라 충돌 없음
   ★ XR8.pause()/resume() 불필요
═══════════════════════════════════════════════════════════ */
const Selfie = {
  shotIdx: 0,

  /* 1) 패널 열기 */
  async open() {
    document.getElementById('container').style.opacity = '0';
    await new Promise(r => setTimeout(r, 350));
    document.getElementById('container').style.display   = 'none';
    document.getElementById('selfie-panel').style.display = 'flex';
    // XR8 건드리지 않음 — 후면 카메라는 AR 씬에서만 사용
  },

  /* 2) 네이티브 카메라로 사진 1장 촬영 */
  takePhoto() {
    const idx = this.shotIdx;
    if (idx >= 4) return;

    const btn   = document.getElementById('take-photo-btn');
    const input = document.getElementById('file-capture');
    btn.disabled = true;

    const handleChange = (e) => {
      cleanup();
      const file = e.target.files && e.target.files[0];
      if (!file) { btn.disabled = false; return; }

      const reader = new FileReader();
      reader.onload = (re) => {
        window.capturedPhotos.push(re.target.result);
        this._showThumb(idx, re.target.result);
        input.value = '';
        btn.disabled = false;
        this._advance();
      };
      reader.onerror = () => { console.error('FileReader 오류'); btn.disabled = false; };
      reader.readAsDataURL(file);
    };
    const handleCancel = () => { cleanup(); btn.disabled = false; };
    const cleanup = () => {
      input.removeEventListener('change', handleChange);
      input.removeEventListener('cancel', handleCancel);
    };

    input.addEventListener('change', handleChange);
    input.addEventListener('cancel', handleCancel);
    input.click();
  },

  _showThumb(idx, dataUrl) {
    const slot = document.getElementById(`t${idx}`);
    const num  = slot.querySelector('.num');
    if (num) num.style.display = 'none';
    const img = document.createElement('img');
    img.src = dataUrl;
    slot.appendChild(img);
    slot.classList.add('ok');
    const dot = document.getElementById(`d${idx}`);
    if (dot) dot.classList.replace('active', 'done');
  },

  _advance() {
    this.shotIdx++;
    if (this.shotIdx < 4) {
      const d = document.getElementById(`d${this.shotIdx}`);
      if (d) d.classList.add('active');
      document.getElementById('take-photo-btn').textContent =
        `📸 ${this.shotIdx + 1}번째 사진 찍기`;
    } else {
      document.getElementById('take-photo-btn').style.display = 'none';
      document.getElementById('ar-go-btn').style.display      = 'block';
    }
  },

  /* 3) AR 씬 시작 */
  async launchAR() {
    /* iOS 13+ 모션·방향 센서 권한 (사용자 제스처 컨텍스트 필수) */
    const reqPerm = async (EventClass) => {
      if (typeof EventClass !== 'undefined' && typeof EventClass.requestPermission === 'function') {
        try { return await EventClass.requestPermission() === 'granted'; } catch { return true; }
      }
      return true;
    };
    if (!await reqPerm(DeviceMotionEvent)) {
      alert('AR 실행을 위해 동작 센서 권한이 필요합니다.\n설정 > Safari > 동작 및 방향 접근을 허용해 주세요.'); return;
    }
    if (!await reqPerm(DeviceOrientationEvent)) {
      alert('방향 센서 권한이 필요합니다.'); return;
    }

    window.photosReady = true;
    startNavigation();
  }
};

/* ═══════════════════════════════════════════════════════════
   포토 텍스처 직접 적용 (retry 내장)
   GLB cut_01~04 메시에 MeshBasicMaterial 로 사진 텍스처 입힘.
   MeshBasicMaterial: 조명 독립적 → 어두운 AR 환경에서도 선명하게 표시.
   flipY=false: GLTF UV 좌표계 기준 (V=0 이 이미지 상단)
═══════════════════════════════════════════════════════════ */
function applyPhotosToModel() {
  const el     = document.getElementById('photo-frame');
  const photos = window.capturedPhotos;
  if (!el || !photos || photos.length < 4) {
    console.warn('[applyPhotos] 조건 미충족:', el ? 'el ok' : 'no el', photos ? photos.length+'장' : 'no photos');
    return;
  }

  const tryApply = (attempt) => {
    const mesh = el.getObject3D('mesh');
    if (!mesh) {
      if (attempt < 40) setTimeout(() => tryApply(attempt + 1), 300);
      else console.error('[applyPhotos] mesh 취득 실패 (최대 재시도 초과)');
      return;
    }

    /* cut_01 ~ cut_04 노드 수집 */
    const targets = {};
    mesh.traverse(node => {
      if (node.isMesh && /^cut_0[1-4]$/.test(node.name)) targets[node.name] = node;
    });
    console.log('[applyPhotos] 슬롯 발견:', Object.keys(targets), '사진 수:', photos.length);

    if (Object.keys(targets).length === 0) {
      /* 이름 매칭 실패 시 콘솔에 전체 목록 출력 */
      const allNames = [];
      mesh.traverse(n => { if (n.isMesh) allNames.push(n.name); });
      console.warn('[applyPhotos] 슬롯 없음. 전체 메시:', allNames);
      return;
    }

    const THREE = AFRAME.THREE;
    ['cut_01','cut_02','cut_03','cut_04'].forEach((name, i) => {
      const node = targets[name];
      if (!node || !photos[i]) { console.warn('[applyPhotos] 없음:', name, i); return; }

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth  || 512;
        canvas.height = img.naturalHeight || 512;
        canvas.getContext('2d').drawImage(img, 0, 0);

        const tex = new THREE.CanvasTexture(canvas);
        tex.flipY      = false;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;

        /* 기존 material 완전 교체 → 조명 영향 없이 항상 선명 */
        if (Array.isArray(node.material)) {
          node.material.forEach(m => m.dispose());
        } else if (node.material) {
          node.material.dispose();
        }
        node.material = new THREE.MeshBasicMaterial({
          map: tex, side: THREE.DoubleSide,
          transparent: false, toneMapped: false
        });
        console.log(`[applyPhotos] ${name} 완료 (${canvas.width}×${canvas.height})`);
      };
      img.onerror = () => console.error('[applyPhotos] 이미지 로드 실패:', name, i);
      img.src = photos[i];
    });
  };

  tryApply(0);
}

/* ═══════════════════════════════════════════════════════════
   AR 씬 제어 (원본 소스 패턴 유지)
═══════════════════════════════════════════════════════════ */
const frameId = 'photo-frame';
let initialTransform = null;

function captureInitial() {
  const el = document.getElementById(frameId);
  if (!el || !el.object3D) return;
  initialTransform = {
    position: el.object3D.position.clone(),
    scale:    el.object3D.scale.clone(),
    rotation: el.object3D.rotation.clone()
  };
}

function restoreTransform() {
  const el = document.getElementById(frameId);
  const t  = initialTransform;
  if (!el || !t) return;
  el.object3D.position.copy(t.position);
  el.object3D.scale.copy(t.scale);
  el.object3D.rotation.copy(t.rotation);
}

function startNavigation() {
  triggerLandscapeFullscreen();

  const panel = document.getElementById('selfie-panel');
  panel.style.opacity    = '0';
  panel.style.transition = 'opacity .4s ease';

  setTimeout(() => {
    panel.style.display = 'none';

    document.getElementById('audio-toggle-btn').style.display = 'flex';
    document.getElementById('ar-reset-btn').style.display     = 'flex';

    const el = document.getElementById(frameId);
    restoreTransform();
    el.setAttribute('visible', 'true');
    el.emit('ar-start');

    /* hit-proxy + raycaster 다중 갱신
       ★ 모델 로드 타이밍 불확실성 대응 — 여러 시점에서 반복 갱신 */
    [100, 500, 1200, 2500].forEach(d => {
      setTimeout(() => {
        if (el.components && el.components['hit-proxy']) el.components['hit-proxy'].fit();
        refreshRaycaster();
      }, d);
    });

    /* ★ 포토 텍스처 적용 — 모델 확정 후 실행 (내부 retry 최대 12초) */
    setTimeout(() => applyPhotosToModel(), 800);

  }, 400);

  const bgm = document.getElementById('bgm');
  if (bgm) bgm.play().catch(() => {});
}

/* ═══════════════════════════════════════════════════════════
   버튼 이벤트
═══════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  const scene = document.querySelector('a-scene');
  (scene.hasLoaded
    ? Promise.resolve()
    : new Promise(r => scene.addEventListener('loaded', r))
  ).then(captureInitial);

  /* 오디오 토글 */
  const audioBtn = document.getElementById('audio-toggle-btn');
  const bgm      = document.getElementById('bgm');
  if (audioBtn && bgm) {
    ['click','touchstart'].forEach(ev => {
      audioBtn.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation();
        if (bgm.paused) {
          bgm.play().catch(() => {});
          audioBtn.innerText = '🎵'; audioBtn.style.backgroundColor = '#fff';
        } else {
          bgm.pause();
          audioBtn.innerText = '🔇'; audioBtn.style.backgroundColor = '#f1f3f2';
        }
      }, { passive: false });
    });
  }

  /* 리셋 버튼 */
  const resetBtn = document.getElementById('ar-reset-btn');
  if (resetBtn) {
    ['click','touchstart'].forEach(ev => {
      resetBtn.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation();
        if (bgm) { bgm.pause(); bgm.currentTime = 0; }
        if (audioBtn) { audioBtn.innerText = '🎵'; audioBtn.style.backgroundColor = '#fff'; }
        audioBtn.style.display = 'none';
        resetBtn.style.display = 'none';

        /* 포토프레임 숨기기 & 위치 복원 */
        const el = document.getElementById(frameId);
        if (el) { el.setAttribute('visible','false'); restoreTransform(); }

        /* 상태 초기화 */
        window.capturedPhotos = [];
        window.photosReady    = false;
        Selfie.shotIdx        = 0;

        /* 썸네일·도트 초기화 */
        [0,1,2,3].forEach(i => {
          const t = document.getElementById(`t${i}`);
          if (t) {
            t.querySelectorAll('img').forEach(im => im.remove());
            t.classList.remove('ok');
            const num = t.querySelector('.num');
            if (num) num.style.display = '';
          }
          const d = document.getElementById(`d${i}`);
          if (d) { d.className = 'sdot' + (i===0 ? ' active' : ''); }
        });
        const tpBtn = document.getElementById('take-photo-btn');
        if (tpBtn) {
          tpBtn.textContent = '📸 1번째 사진 찍기';
          tpBtn.style.display = '';
          tpBtn.disabled = false;
        }
        const arGoBtn = document.getElementById('ar-go-btn');
        if (arGoBtn) arGoBtn.style.display = 'none';
        const fi = document.getElementById('file-capture');
        if (fi) fi.value = '';

        /* 시작화면 복귀 */
        const c = document.getElementById('container');
        c.style.display    = 'flex';
        c.style.visibility = 'visible';
        setTimeout(() => { c.style.opacity = '1'; }, 15);

      }, { passive: false });
    });
  }
});
</script>
