<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>8th Wall Web: Manipulate</title>

    <!-- We've included a slightly modified version of A-Frame, which fixes some polish concerns -->
    <script src="./../xr_st/8frame-1.3.0.min.js"></script>

    <!-- XR Extras - provides utilities like load screen, almost there, and error handling.
         See github.com/8thwall/web/tree/master/xrextras -->
    <script src="./../xr_st/xrextras.js"></script>

    <!-- Landing Pages - see https://www.8thwall.com/docs/web/#landing-pages -->
    <script src='./../xr_st/landing-page/landing-page.js'></script>

    <!-- 8thWall Web - Replace the app key here with your own app key -->
     <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
    <script src="//cdn.8thwall.com/web/aframe/aframe-extras-7.2.0.min.js"></script>
  </head>

  <body>
    <a-scene
      xrextras-gesture-detector
      landing-page
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb="allowedDevices: any">

      <!-- We can define assets here to be loaded when A-Frame initializes -->
      <a-assets>
        <!-- Credit to Poly by Google for the model: https://poly.google.com/view/5ZMAz7_ucTn -->
        <a-asset-item id="sandCastleModel" src="./tiger_rebuilt.glb"></a-asset-item>
      </a-assets>
    <xrextras-capture-button></xrextras-capture-button>
    <xrextras-capture-preview></xrextras-capture-preview>
      <!-- The raycaster will emit mouse events on scene objects specified with the cantap class -->
      <a-camera
        id="camera"
        position="0 8 8"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-entity
        light="
          type: directional;
          intensity: 0.8;
          castShadow: true;
          shadowMapHeight:2048;
          shadowMapWidth:2048;
          shadowCameraTop: 10;
          target: #model;"
        xrextras-attach="target: model; offset: 1 15 3;"
        shadow>
      </a-entity>

      <a-light type="ambient" intensity="0.7"></a-light>

      <a-entity
        id="model"
        gltf-model="#sandCastleModel"
        class="cantap"
        xrextras-hold-drag
        xrextras-two-finger-rotate
        xrextras-pinch-scale
        scale="1 1 1"
        rotation="0 70 0"
        shadow="receive: false"
        animation-mixer="clip: Howl; loop: repeat; timeScale: 1">
      </a-entity>

      <a-plane
        id="ground"
        rotation="-90 0 0"
        width="1000"
        height="1000"
        material="shader: shadow"
        shadow>
      </a-plane>
    </a-scene>
  </body>
<div style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;">
  <button onclick="changeAnim('Attack')">공격</button>
  <button onclick="changeAnim('Eat')">먹기</button>
  <button onclick="changeAnim('Run')">달리기</button>
  <button onclick="changeAnim('Walk')">걷기</button>
  <button onclick="changeAnim('Walk Fast')">속보</button>
</div>
  <script>
  // 특정 애니메이션을 호출하는 자바스크립트 함수
  function changeAnim(clipName) {
    const model = document.getElementById('model')
    // animation-mixer의 clip 속성을 변경하여 특정 애니메이션 실행
    model.setAttribute('animation-mixer', {
      clip: clipName,
      loop: 'repeat'
    })
  }
</script>
</html>
